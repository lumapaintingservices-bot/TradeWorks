  html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand img{height:30px;width:auto;display:block}

  .count .lbl small{color:var(--ink-3);font-size:12.5px}

  .fine{font-size:12px;color:var(--ink-3);margin-top:14px;text-align:center}

  .btn.pri.acc{background:var(--acc);border-color:var(--acc)}

  .skip{font-size:13px;color:var(--ink-3);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
  .done{text-align:center;padding:24px 0}

  .done h1{margin-bottom:10px}
  .done p{color:var(--ink-2);max-width:460px;margin:0 auto 18px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .foot{max-width:680px;margin:0 auto;padding:0 18px 30px;text-align:center;font-size:12.5px;color:var(--ink-3)}
  .foot a{color:var(--ink-2)}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

function digits(s){ return String(s || "").replace(/[^0-9]/g, ""); }
function rid(){ var a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", o = ""; for(var i = 0; i < 20; i++) o += a[Math.floor(Math.random() * a.length)]; return o; }
function has(list, v){ return list.indexOf(v) >= 0; }
function toggleIn(list, v){ var i = list.indexOf(v); if(i >= 0) list.splice(i, 1); else list.push(v); }
function isCab(){ return has(S.types, "cabinets") || has(S.types, "vanity"); }

function render(){
  var T = t(), root = document.getElementById("root");
  document.documentElement.lang = S.lang;
  document.getElementById("langSw").innerHTML = '<button data-lang="en" class="'+(S.lang==="en"?"on":"")+'">EN</button><button data-lang="es" class="'+(S.lang==="es"?"on":"")+'">ES</button>';
  var total = STEPS.length - 1, pct = S.done ? 100 : Math.round(S.step / total * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("foot").innerHTML = '<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px;font-size:11.5px;color:#8b8e94"><svg width="14" height="14" viewBox="0 0 200 200"><rect width="200" height="200" rx="40" fill="#1a1a2e"/><path d="M100 40 L150 68 L150 132 L100 160 L50 132 L50 68 Z" stroke="#fff" stroke-width="14" stroke-linejoin="round" fill="none"/><circle cx="100" cy="100" r="20" fill="#fff"/></svg>Powered by TradeWorks</div>' + '<a href="'+esc(CONFIG.website)+'" target="_blank" rel="noopener">'+esc(String(CONFIG.website).replace(/^https?:\/\//, "").replace(/\/$/, ""))+'</a> · <a href="tel:+1'+digits(CONFIG.phone)+'">'+esc(CONFIG.phone)+'</a>';
  var bl = document.getElementById("brandLink"); if(bl) bl.href = CONFIG.website;
  var bar = document.getElementById("bar"), barIn = document.getElementById("barIn");
  if(S.done){ root.innerHTML = doneHTML(); bar.hidden = true; bindAll(); return; }
  var name = STEPS[S.step], head = "";
  if(S.step > 0) head = '<div class="step-k">'+esc(T.stepOf.replace("{0}", S.step).replace("{1}", total))+' · '+esc(T.stepLbl[S.step - 1])+'</div>';
  var body = ({ intro:introHTML, types:typesHTML, details:detailsHTML, tier:tierHTML, when:whenHTML, photos:photosHTML, contact:contactHTML })[name]();
  root.innerHTML = '<div class="fade">'+head+body+'<div class="err" id="err">'+esc(S.err)+'</div></div>';
  bar.hidden = false;
  var last = S.step === total;
  barIn.innerHTML = (S.step > 0 ? '<button class="btn" data-go="back">'+T.back+'</button>' : '')+
    '<button class="btn pri'+(last || S.step === 0 ? " acc" : "")+'" data-go="next"'+(S.busy ? " disabled" : "")+'>'+(S.step === 0 ? T.start + " →" : last ? (S.busy ? T.sending : T.send) : T.next + " →")+'</button>';
  bindAll();
}
function optCard(kind, id, title, sub, on, ico, extra){
  return '<button type="button" class="opt'+(ico ? "" : " row")+(on ? " on" : "")+'" data-'+kind+'="'+esc(id)+'">'+
    (ico ? '<span class="ic">'+ico+'</span><b>'+esc(title)+'</b>'+(sub ? '<small>'+esc(sub)+'</small>' : '')
         : '<span class="txt"><b>'+esc(title)+(extra || '')+'</b>'+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</span>')+
    '<span class="ck">'+(on ? "✓" : "")+'</span></button>';
}
function chips(kind, opts, sel, multi){
  return '<div class="chips">'+Object.keys(opts).map(function(k){
    var on = multi ? has(sel, k) : sel === k;
    return '<button type="button" class="chip'+(on ? " on" : "")+'" data-'+kind+'="'+esc(k)+'">'+esc(opts[k])+'</button>';
  }).join("")+'</div>';
}
function stepper(kind, v, off){
  return '<div class="stepper'+(off ? " off" : "")+'"><button type="button" data-dec="'+kind+'" aria-label="-">−</button><input type="number" inputmode="numeric" min="0" max="200" data-num="'+kind+'" value="'+(v || 0)+'"><button type="button" data-inc="'+kind+'" aria-label="+">+</button></div>';
}

function keep(){
  function v(id){ var el = document.getElementById(id); return el ? el.value : null; }
  var x;
  if((x = v("fOther")) !== null) S.other = x;
  if((x = v("fDate")) !== null) S.date = x;
  if((x = v("fMsg")) !== null) S.message = x;
  if((x = v("fName")) !== null) S.name = x;
  if((x = v("fPhone")) !== null) S.phone = x;
  if((x = v("fEmail")) !== null) S.email = x;
  if((x = v("fAddr")) !== null) S.address = x;
  if((x = v("fHeard")) !== null) S.heard = x;
  document.querySelectorAll("[data-num]").forEach(function(el){ setNum(el.getAttribute("data-num"), el.value); });
}
function setNum(k, v){
  v = Math.max(0, Math.min(200, parseInt(v, 10) || 0));
  if(k === "doors" || k === "drawers") S.cab[k] = v; else S.intr[k] = v;
}
function getNum(k){ return (k === "doors" || k === "drawers") ? S.cab[k] : S.intr[k]; }
function bindAll(){
  function each(sel, fn){ document.querySelectorAll(sel).forEach(fn); }
  each("[data-lang]", function(b){ b.onclick = function(){ keep(); S.lang = b.getAttribute("data-lang"); render(); }; });
  each("[data-go]", function(b){ b.onclick = function(){ keep(); b.getAttribute("data-go") === "back" ? go(-1) : next(); }; });
  each("[data-type]", function(b){ b.onclick = function(){ toggleIn(S.types, b.getAttribute("data-type")); S.err = ""; render(); }; });
  each("[data-dec]", function(b){ b.onclick = function(){ keep(); var k = b.getAttribute("data-dec"); setNum(k, getNum(k) - 1); render(); }; });
  each("[data-inc]", function(b){ b.onclick = function(){ keep(); var k = b.getAttribute("data-inc"); setNum(k, getNum(k) + 1); render(); }; });
  var cm = document.getElementById("countMe"); if(cm) cm.onchange = function(){ keep(); S.cab.countMe = cm.checked; render(); };
  function single(attr, obj, key){ each("[data-" + attr + "]", function(b){ b.onclick = function(){ keep(); var v = b.getAttribute("data-" + attr); obj[key] = obj[key] === v ? "" : v; render(); }; }); }
  function multi(attr, list){ each("[data-" + attr + "]", function(b){ b.onclick = function(){ keep(); toggleIn(list, b.getAttribute("data-" + attr)); render(); }; }); }
  single("island", S.cab, "island"); single("style", S.cab, "style"); single("current", S.cab, "current");
  each("[data-extra]", function(b){ b.onclick = function(){ keep(); var v = b.getAttribute("data-extra");
    if(v === "nothing") S.cab.extras = has(S.cab.extras, "nothing") ? [] : ["nothing"];
    else { S.cab.extras = S.cab.extras.filter(function(x){ return x !== "nothing"; }); toggleIn(S.cab.extras, v); }
    render(); }; });
  multi("room", S.intr.rooms); multi("surf", S.intr.surfaces); single("size", S.intr, "size");
  single("story", S.ext, "stories"); multi("esurf", S.ext.surfaces);
  single("tcab", S, "tierCab"); single("twall", S, "tierWall"); single("when", S, "when"); single("contact", S, "contact");
  each("[data-rm]", function(b){ b.onclick = function(){ keep(); S.photos.splice(+b.getAttribute("data-rm"), 1); render(); }; });
  var fp = document.getElementById("fPh"); if(fp) fp.onchange = function(){ keep(); addPhotos(fp.files); };
  var ag = document.getElementById("again"); if(ag) ag.onclick = function(){ location.href = location.pathname + location.search; };
}
function go(d){ S.err = ""; S.step = Math.max(0, Math.min(STEPS.length - 1, S.step + d)); render(); window.scrollTo(0, 0); }
function next(){
  var T = t(), name = STEPS[S.step];
  if(name === "types" && !S.types.length){ S.err = T.need1; render(); return; }
  if(name === "contact"){ submit(); return; }
  go(1);
}

/* ---------- photos: shrunk on the phone before they travel ---------- */
function shrink(file){
  return new Promise(function(res){
    if(!file || !/^image\//.test(file.type)){ res(null); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1100 / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var out = c.toDataURL("image/jpeg", 0.7);
      if(out.length > 850000) out = c.toDataURL("image/jpeg", 0.5);
      res(out.length > 850000 ? null : out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
function addPhotos(files){
  var list = Array.prototype.slice.call(files || []).slice(0, CONFIG.maxPhotos - S.photos.length);
  Promise.all(list.map(shrink)).then(function(out){ out.forEach(function(u){ if(u && S.photos.length < CONFIG.maxPhotos) S.photos.push(u); }); render(); });
}

/* ---------- sending ---------- */
var fbReady = null;
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function loadFirebase(){
  if(fbReady) return fbReady;
  function chain(base){ return loadScript(base + "firebase-app-compat.js").then(function(){ return loadScript(base + "firebase-firestore-compat.js"); }); }
  fbReady = chain(CONFIG.sdk[0]).catch(function(){ return chain(CONFIG.sdk[1]); }).then(function(){
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
    var fs = firebase.firestore();
    try{ fs.settings({ experimentalForceLongPolling:true, merge:true }); }catch(err){}
    return fs;
  });
  fbReady.catch(function(){ fbReady = null; });
  return fbReady;
}
var SVC_EN = { cabinets:"Kitchen cabinets", vanity:"Bathroom vanity", interior:"Interior painting", exterior:"Exterior painting", other:"Other" };
function submit(){
  var T = t();
  var co = document.getElementById("fCo");
  if(co && co.value){ S.done = true; render(); return; }            /* robots fill the hidden field */
  if(!S.name.trim() || digits(S.phone).length < 7){ S.err = T.need6; render(); return; }
  S.err = ""; S.busy = true; render();
  var id = rid(), photoIds = S.photos.map(function(){ return rid(); });
  var details = {
    v:2, types:S.types.slice(0, 5),
    cab: isCab() ? { doors:S.cab.countMe ? 0 : S.cab.doors, drawers:S.cab.countMe ? 0 : S.cab.drawers, countMe:!!S.cab.countMe, island:S.cab.island, style:S.cab.style, current:S.cab.current, extras:S.cab.extras.slice(0, 6) } : null,
    intr: has(S.types, "interior") ? { rooms:S.intr.rooms.slice(0, 10), bedrooms:has(S.intr.rooms, "bedrooms") ? S.intr.bedrooms : 0, bathrooms:has(S.intr.rooms, "bathrooms") ? S.intr.bathrooms : 0, surfaces:S.intr.surfaces.slice(0, 8), size:S.intr.size } : null,
    ext: has(S.types, "exterior") ? { stories:S.ext.stories, surfaces:S.ext.surfaces.slice(0, 8) } : null,
    other: has(S.types, "other") ? S.other.trim().slice(0, 800) : "",
    tierCab:S.tierCab, tierWall:S.tierWall, when:S.when, date:S.date, contact:S.contact, src:SRC || "", ref:String(Q.get("ref") || "").slice(0, 60)
  };
  loadFirebase().then(function(fs){
    var ref = fs.collection("leads").doc(id);
    return photoIds.reduce(function(chain, pid, i){
      return chain.then(function(){ return ref.collection("photos").doc(pid).set({ data:S.photos[i], at:new Date().toISOString() }); });
    }, Promise.resolve()).then(function(){
      return ref.set({
        owner: CONFIG.owner,
        name: S.name.trim().slice(0, 100),
        phone: S.phone.trim().slice(0, 30),
        email: S.email.trim().slice(0, 120),
        city: S.address.trim().slice(0, 80),
        address: S.address.trim().slice(0, 160),
        service: S.types.map(function(k){ return SVC_EN[k]; }).join(", ").slice(0, 120) || "Other",
        message: S.message.trim().slice(0, 1500),
        heard: (SRC || S.heard || "").slice(0, 40),
        lang: S.lang,
        photos: photoIds,
        details: details,
        at: new Date().toISOString(),
        page: String(location.href).slice(0, 200)
      });
    });
  }).then(function(){
    S.busy = false; S.done = true; render(); window.scrollTo(0, 0);
    try{ window.parent && window.parent.postMessage({ luma:"lead-sent" }, "*"); }catch(err){}
  }).catch(function(err){
    try{ console.error(err); }catch(e){}
    S.busy = false; S.err = T.fail + CONFIG.phone + "."; render();
  });
}
/* links and phone follow the LUMA app's Settings (a small public doc the app keeps up to date) */
function loadPublicProfile(){
  var url = "https://firestore.googleapis.com/v1/projects/" + CONFIG.firebase.projectId + "/databases/(default)/documents/public/" + CONFIG.owner;
  fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(!j || !j.fields) return;
    function f(k){ return j.fields[k] && j.fields[k].stringValue ? j.fields[k].stringValue : ""; }
    var changed = false;
    [["website","website"],["instagram","instagram"],["reviews","reviews"],["phone","phone"]].forEach(function(m){ var v = f(m[1]); if(v && CONFIG[m[0]] !== v){ CONFIG[m[0]] = v; changed = true; } });
    var logo = f("logo"), nm = f("name");
    if(logo){ var im = document.getElementById("brandLogo"); if(im) im.src = logo; }
    if(nm){ var parts = nm.split(" "), b = document.getElementById("brandName"), sb = document.getElementById("brandSub");
      if(b) b.textContent = parts[0]; if(sb) sb.textContent = parts.slice(1).join(" "); }
    if(changed){ keep(); render(); }
  }).catch(function(){});
}
render();
loadPublicProfile();
