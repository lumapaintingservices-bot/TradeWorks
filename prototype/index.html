/* =================================================================
   WEBSITE LEADS — requests from the form on the website (lead.html)
   Each one becomes a lead in the pipeline, with its photos. The id is
   the same on every device, so two devices never make it twice.
   ================================================================= */
var WEBLEADS = { unsub:null, busy:{} };
function webLeadsListen(){
  if(!CLOUD.fs || !CLOUD.user) return;
  if(WEBLEADS.unsub){ try{ WEBLEADS.unsub(); }catch(err){} }
  WEBLEADS.unsub = CLOUD.fs.collection("leads").where("owner", "==", CLOUD.user.uid).onSnapshot(function(qs){
    qs.forEach(function(d){ webLeadImport(d.id, d.data() || {}); });
  }, function(err){ /* the rules may not be published yet — the rest of the app keeps working */ });
}
function webLeadImport(lid, L){
  var cid = "c-web-" + lid;
  if(WEBLEADS.busy[lid]) return;
  var col = CLOUD.fs.collection("leads").doc(lid);
  if(byId(DB.clients, cid)){
    /* already here: clean the request out of the inbox once its photos are safely in the app */
    if(L.imported) webLeadCleanup(lid, L);
    return;
  }
  WEBLEADS.busy[lid] = true;
  var ids = Array.isArray(L.photos) ? L.photos.slice(0, 5) : [];
  var photos = [];
  ids.reduce(function(chain, pid){
    return chain.then(function(){
      return col.collection("photos").doc(pid).get().then(function(d){
        var data = d.exists ? (d.data() || {}).data : null;
        if(!data) return;
        var id = "wl-" + lid.slice(0, 8) + "-" + pid.slice(0, 8);
        return PhotoStore.put(id, data).then(function(){ photos.push({ id:id, kind:"before", caption:"" }); });
      }).catch(function(){});
    });
  }, Promise.resolve()).then(function(){
    if(byId(DB.clients, cid)) return;
    var msg = String(L.message || "").trim(), det = (L.details && typeof L.details === "object") ? L.details : null;
    var note = [L.service, L.city, det ? leadSummary(det, "en").join(" · ") : "", msg].filter(function(x){ return x; }).join(" — ");
    DB.clients.push({
      id:cid, name:String(L.name || "").slice(0, 100), phone:String(L.phone || ""), email:String(L.email || ""),
      address:String(L.address || L.city || ""), source:(det && det.ref) ? "Referral" : (det && det.src) ? String(det.src) : "Website" + (L.heard ? " (" + L.heard + ")" : ""), lang:L.lang === "es" ? "es" : "en",
      referredBy:(det && det.ref && byId(DB.clients, String(det.ref))) ? String(det.ref) : "",
      note:note, lead:true, createdAt:String(L.at || isoNow()).slice(0, 10) || todayISO(),
      photos:photos, web:{ id:lid, service:L.service || "", city:L.city || "", message:msg, heard:L.heard || "", at:L.at || "", details:det },
      updatedAt:isoNow()
    });
    var srcName = (det && det.src) ? String(det.src) : "Website";
    if(DB.leadSources && DB.leadSources.indexOf(srcName) < 0) DB.leadSources.push(srcName);
    save();
    toast(TT("New request from your website: {0}","Solicitud nueva desde tu sitio web: {0}").replace("{0}", L.name || ""));
    render();
    return col.update({ imported:true }).catch(function(){});
  }).then(function(){ delete WEBLEADS.busy[lid]; }, function(){ delete WEBLEADS.busy[lid]; });
}
/* photos first, the request last (the rules need the request to check who owns the photos) */
function webLeadCleanup(lid, L){
  if(WEBLEADS.busy["x" + lid]) return;
  WEBLEADS.busy["x" + lid] = true;
  var col = CLOUD.fs.collection("leads").doc(lid);
  /* give the photos time to reach this account's own photo storage before the copy in the inbox goes */
  setTimeout(function(){
    Promise.all((L.photos || []).map(function(pid){ return col.collection("photos").doc(pid).delete().catch(function(){}); }))
      .then(function(){ return col.delete(); }).catch(function(){})
      .then(function(){ delete WEBLEADS.busy["x" + lid]; });
  }, 60000);
}

function showcaseAdd(files){
  var list = Array.prototype.slice.call(files || []).filter(function(f){ return /^image\//.test(f.type); });
  if(!list.length) return;
  if(!cloudOn()){ toast(TT("Connect the cloud first — these photos live there so every link can show them.","Primero conecta la nube — estas fotos viven ahí para que todos los links las muestren.")); return; }
  var room = SHOWCASE_MAX - (DB.showcase||[]).length;
  if(list.length > room){ list = list.slice(0, room); toast(TT("Only 8 photos fit — I added the first ones.","Solo caben 8 fotos — agregué las primeras.")); }
  toast(TT("Uploading {0} photos…","Subiendo {0} fotos…").replace("{0}", list.length));
  list.reduce(function(chain, f){
    return chain.then(function(){
      return resizeImage(f, 1400, 0.72).then(lightCopy).then(function(url){
        if(!url) return;
        var id = uid("sc");
        return CLOUD.fs.collection("showcase").doc(id).set({ owner:CLOUD.user.uid, data:url, at:isoNow() }).then(function(){
          return PhotoStore.put(id, url);
        }).then(function(){
          DB.showcase.push({ id:id, caption:"" });
          save();
        });
      });
    });
  }, Promise.resolve()).then(function(){
    toast(TT("Photos added. They show on every link.","Fotos agregadas. Salen en todos los links."));
    render();
  }).catch(function(err){
    var m = String((err && (err.code || err.message)) || err);
    toast(/permission|insufficient/i.test(m)
      ? TT("The cloud rules need updating first: copy them below and publish them in Firebase.","Primero hay que actualizar las reglas: cópialas abajo y publícalas en Firebase.")
      : m);
    render();
  });
}

    PhotoStore.get(id).then(function(url){
      if(url){ img.src = url; return; }
      if(!cloudOn()) return;
      return CLOUD.fs.collection("showcase").doc(id).get().then(function(d){
        if(d.exists && d.data().data){ img.src = d.data().data; PhotoStore.put(id, d.data().data); }
      });
    }).catch(function(){});
  });
}

/* client page pictures: loaded once, only when the client scrolls to them, kept in memory between repaints */
function ptImgLoad(key){
  PORTAL.imgs = PORTAL.imgs || {}; PORTAL.imgP = PORTAL.imgP || {};
  if(PORTAL.imgs[key]) return Promise.resolve(PORTAL.imgs[key]);
  if(PORTAL.imgP[key]) return PORTAL.imgP[key];
  var kind = key.charAt(0), id = key.slice(2), p;
  if(!PORTAL.mode){
    /* the owner's preview: straight from this device */
    p = PhotoStore.get(id).then(function(u){
      if(u) return u;
      if(kind === "p") return cloudFetchPhoto(id);
      return cloudOn() ? CLOUD.fs.collection("showcase").doc(id).get().then(function(d){ return d.exists ? d.data().data : null; }) : null;
    });
  } else {
    var fs = firebase.firestore();
    var ref = kind === "p" ? fs.collection("portal").doc(PORTAL.token).collection("photos").doc(id) : fs.collection("showcase").doc(id);
    p = ref.get().then(function(d){ return d.exists ? (d.data().data || null) : null; });
  }
  PORTAL.imgP[key] = p.then(function(u){ if(u) PORTAL.imgs[key] = u; else delete PORTAL.imgP[key]; return u; }, function(){ delete PORTAL.imgP[key]; return null; });
  return PORTAL.imgP[key];
}
function ptHydrate(){
  var root = document.getElementById("ptMain");
  if(!root) return;
  PORTAL.imgs = PORTAL.imgs || {};
  var imgs = Array.prototype.slice.call(root.querySelectorAll("img[data-ptimg], img[data-photo]"));
  var need = [];
  imgs.forEach(function(img){
    var key = img.getAttribute("data-ptimg") || ("p|" + img.getAttribute("data-photo"));
    img.setAttribute("data-key", key);
    if(PORTAL.imgs[key]) img.src = PORTAL.imgs[key]; else need.push(img);
  });
  if(!need.length) return;
  function load(img){ ptImgLoad(img.getAttribute("data-key")).then(function(u){ if(u) img.src = u; }); }
  if(!("IntersectionObserver" in window)){ need.forEach(load); return; }
  if(PORTAL.io) PORTAL.io.disconnect();
  PORTAL.io = new IntersectionObserver(function(list){
    list.forEach(function(en){ if(en.isIntersecting){ PORTAL.io.unobserve(en.target); load(en.target); } });
  }, { rootMargin:"300px 0px" });
  need.forEach(function(img){ PORTAL.io.observe(img); });
}

function v4Upcoming(){
  var today = todayISO(), until = addDaysISO(today, 30), out = [];
  DB.estimates.forEach(function(e){
    if(!e.startDate) return;

    if(st === "Declined") return;
    var end = addDaysISO(e.startDate, Math.max(0, (num(e.days) || 1) - 1));
    if(end < today || e.startDate > until) return;
    out.push({ e:e, st:st, end:end, now:e.startDate <= today });

}

      var id = "rec-" + r.id + "-" + cur;

        if(!DB.expenses) DB.expenses = [];

      var d = new Date(cur + "-15T12:00:00"); d.setMonth(d.getMonth() + 1); cur = d.toISOString().slice(0, 7);

function jobCosts(e){
  var mat = jobExpenses(e), other = 0, labor = 0, hrs = 0;
  if(!(mat > 0)) mat = 0;
  liveExpenses().forEach(function(x){ if(x.estId !== e.id) return; if(x.category !== "materials") other += num(x.amount); });
  liveHours().forEach(function(h){ if(h.estId === e.id){ labor += hourAmount(h); hrs += num(h.hours); } });
  var price = calcEstimate(e).total, paid = 0;
  invoicesFor(e.id).forEach(function(v){ if(v.status === "Paid") paid += num(v.amount); });
  var plannedMat = 0; try{ plannedMat = calcMaterials(e).totalCost; }catch(err){}
  var cost = r2(mat + other + labor), profit = r2(price - cost);
  return { price:price, paid:paid, mat:r2(mat), plannedMat:plannedMat, other:r2(other), labor:r2(labor), hrs:hrs, cost:cost, profit:profit,
    margin: price ? profit / price * 100 : 0, hasReal: mat > 0 || other > 0 || labor > 0 };
}

   20 · REPORTS — profit & loss, profit by job, marketing return, export
   ================================================================= */
function incomeRows(b){
  var out = [];
  (DB.invoices || []).forEach(function(v){ if(v.status !== "Paid") return; var d = v.paidDate || v.date; if(inBounds(d, b)) out.push({ date:d, amount:num(v.amount), v:v }); });
  return out;
}
function plFor(b){
  var inc = 0; incomeRows(b).forEach(function(r){ inc += r.amount; });
  var cats = {}, exp = 0;
  expInRange(allExpenseRows(), b).forEach(function(r){ cats[r.cat] = (cats[r.cat] || 0) + r.amount; exp += r.amount; });
  var team = 0; livePays().forEach(function(p){ if(inBounds(p.date, b)) team += num(p.amount); });
  if(team){ cats.team = team; exp += team; }
  return { income:r2(inc), expenses:r2(exp), profit:r2(inc - exp), cats:cats, margin: inc ? (inc - exp) / inc * 100 : 0 };
}
function marketingFor(b){
  var src = {};
  function o(s){ s = s || TT("Not set","Sin anotar"); return src[s] = src[s] || { spend:0, leads:0, won:0, rev:0 }; }
  expInRange(allExpenseRows(), b).forEach(function(r){ if(isMarketingCat(r.cat)) o(r.source || TT("Not set","Sin anotar")).spend += r.amount; });
  /* a lead = a client who reached out: every estimate with a source, plus leads that never got an estimate */
  var counted = {};
  DB.estimates.forEach(function(e){
    if(!inBounds(e.date, b) || !e.leadSource) return;
    var key = e.clientId || nameOf(e);
    if(!counted[key]){ counted[key] = 1; o(e.leadSource).leads++; }
    if(WON_ST[jobStatus(e)]){ var x = o(e.leadSource); x.won++; x.rev += calcEstimate(e).total; }
  });
  DB.clients.forEach(function(c){
    if(c.deleted || !c.source || counted[c.id] || !inBounds(c.createdAt || "", b)) return;
    if(DB.estimates.some(function(e){ return e.clientId === c.id; })) return;
    counted[c.id] = 1; o(String(c.source).replace(/^Website \(([^)]+)\)$/, "$1")).leads++;
  });
  return src;
}
function csvCell(v){ v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCSV(name, rows){
  var txt = "\ufeff" + rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"text/csv;charset=utf-8" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function parseCSV(text){
  var rows = [], row = [], cell = "", q = false;
  text = String(text || "").replace(/^\ufeff/, "");
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === ","){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if(row.some(function(c){ return c.trim(); })) rows.push(row); row = []; }
    else cell += ch;
  }

function kpiValue(id, b){

function icsEsc(s){ return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }
function icsFold(line){ var out = [], s = line; while(s.length > 73){ out.push(s.slice(0, 73)); s = " " + s.slice(73); } out.push(s); return out.join("\r\n"); }
function ymd(iso){ return String(iso || "").slice(0, 10).replace(/-/g, ""); }
function jobEndISO(e){ return addDaysISO(e.startDate, Math.max(1, num(e.days) || 1)); }
function jobEventData(e){
  var t = calcEstimate(e);
  return { uid:"job-" + e.id + "@tradeworks", allDay:true, start:e.startDate, end:jobEndISO(e),
    title:nameOf(e) + " — " + jobWhat(e), where:e.address || "",
    notes:[e.number + " · " + jobStatus(e) + " · " + money(t.total), e.phone ? "Tel: " + e.phone : "", e.email || ""].filter(function(x){ return x; }).join("\n") };
}
function taskEventData(t){
  var e = t.estId ? byId(DB.estimates, t.estId) : null, w = t.workerId ? workerById(t.workerId) : null;
  return { uid:"task-" + t.id + "@tradeworks", allDay:!t.time, start:t.date, time:t.time || "", end:t.time ? "" : addDaysISO(t.date, 1),
    title:(t.title || TT("Task","Tarea")) + (w ? " (" + w.name + ")" : ""), where:e ? (e.address || "") : "", notes:[t.note || "", e ? e.number + " · " + nameOf(e) : ""].filter(function(x){ return x; }).join("\n") };
}
function icsEvent(ev){
  var L = ["BEGIN:VEVENT", "UID:" + ev.uid, "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z"];
  if(ev.allDay){ L.push("DTSTART;VALUE=DATE:" + ymd(ev.start)); L.push("DTEND;VALUE=DATE:" + ymd(ev.end)); }
  else {
    var hm = String(ev.time).replace(":", "").padEnd(4, "0").slice(0, 4), st = ymd(ev.start) + "T" + hm + "00";
    var d = new Date(ev.start + "T" + ev.time + ":00"); d.setHours(d.getHours() + 1);
    var en = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
    L.push("DTSTART;TZID=America/New_York:" + st); L.push("DTEND;TZID=America/New_York:" + en);
  }
  L.push("SUMMARY:" + icsEsc(ev.title));
  if(ev.where) L.push("LOCATION:" + icsEsc(ev.where));
  if(ev.notes) L.push("DESCRIPTION:" + icsEsc(ev.notes));
  L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(ev.title), "TRIGGER:" + (ev.allDay ? "-PT16H" : "-PT60M"), "END:VALARM", "END:VEVENT");
  return L.map(icsFold).join("\r\n");
}
function icsCalendar(events, name){

    "X-WR-CALNAME:" + icsEsc(name || "TradeWorks"), "X-WR-TIMEZONE:America/New_York", "REFRESH-INTERVAL;VALUE=DURATION:PT1H", "X-PUBLISHED-TTL:PT1H"].join("\r\n") +

function calendarEvents(){

/* =================================================================
   25 · LINE CHARTS — soft blue area, dashed grid, hover tooltip
   ================================================================= */
function niceMax(v){ if(!(v > 0)) return 100; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function lcPath(pts, close, h){
  var n = pts.length; if(!n) return "";
  if(n < 3){ var d0 = "M" + pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" L"); return close ? d0 + " L" + pts[n - 1][0].toFixed(1) + "," + h + " L" + pts[0][0].toFixed(1) + "," + h + " Z" : d0; }
  var dx = [], dy = [], m = [], t = [];
  for(var i = 0; i < n - 1; i++){ dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for(i = 1; i < n - 1; i++){ t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2; }
  for(i = 0; i < n - 1; i++){
    if(m[i] === 0){ t[i] = 0; t[i + 1] = 0; continue; }
    var a = t[i] / m[i], b = t[i + 1] / m[i], s2 = a * a + b * b;
    if(s2 > 9){ var k = 3 / Math.sqrt(s2); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  var d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
  for(i = 0; i < n - 1; i++){
    var h3 = dx[i] / 3;
    d += " C" + (pts[i][0] + h3).toFixed(1) + "," + (pts[i][1] + t[i] * h3).toFixed(1) + " " + (pts[i + 1][0] - h3).toFixed(1) + "," + (pts[i + 1][1] - t[i + 1] * h3).toFixed(1) + " " + pts[i + 1][0].toFixed(1) + "," + pts[i + 1][1].toFixed(1);
  }
  if(close) d += " L" + pts[n - 1][0].toFixed(1) + "," + h + " L" + pts[0][0].toFixed(1) + "," + h + " Z";
  return d;
}
/* data: { labels:[], tips:[], series:[{ name, v:[], color, fill:true|false, dash:false }], height, sel:index, click:"insMonth"|"" , keys:[] } */
function lineChartHTML(data){
  var W = 1000, H = 300, n = data.labels.length, all = [];
  data.series.forEach(function(s){ s.v.forEach(function(x){ all.push(num(x)); }); });
  var mx = niceMax(Math.max.apply(null, all.concat([0]))), mn = Math.min(0, Math.min.apply(null, all.concat([0])));
  var rg = mx - mn || 1;
  function X(i){ return n < 2 ? W / 2 : i / (n - 1) * W; }
  function Y(v){ return H - (num(v) - mn) / rg * H; }
  var gid = "g" + Math.random().toString(36).slice(2, 8);
  var grid = [0, .25, .5, .75, 1].map(function(f){ var y = (H * f).toFixed(1); return '<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" class="lc-g"/>'; }).join("");
  var paths = data.series.map(function(s, si){
    var pts = s.v.map(function(v, i){ return [X(i), Y(v)]; });
    return (s.fill ? '<path d="'+lcPath(pts, true, H)+'" fill="url(#'+gid+si+')"/>' : '')+
      '<path d="'+lcPath(pts, false, H)+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.fill ? 2.5 : 2)+'"'+(s.dash ? ' stroke-dasharray="6 6"' : '')+' vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
  }).join("");
  var defs = '<defs>'+data.series.map(function(s, si){ return '<linearGradient id="'+gid+si+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+s.color+'" stop-opacity=".22"/><stop offset="1" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>'; }).join("")+'</defs>';
  var ylab = [1, .75, .5, .25, 0].map(function(f){ return '<span style="top:'+((1 - f) * 100)+'%">'+esc(shortMoney(mn + rg * f))+'</span>'; }).join("");
  var xlab = data.labels.map(function(l, i){ return '<span style="left:'+(n < 2 ? 50 : i / (n - 1) * 100)+'%">'+esc(l)+'</span>'; }).join("");
  var payload = { n:n, labels:data.tips || data.labels, series:data.series.map(function(s){ return { name:s.name, color:s.color, v:s.v.map(function(x){ return num(x); }) }; }), mn:mn, rg:rg, click:data.click || "", keys:data.keys || [], sel:(data.sel === undefined ? -1 : data.sel) };
  return '<div class="lc" style="--lch:'+(data.height || 220)+'px" data-lc="'+esc(JSON.stringify(payload))+'">'+
    '<div class="lc-y">'+ylab+'</div>'+
    '<div class="lc-plot"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+defs+grid+paths+'</svg>'+
      '<div class="lc-band"></div><div class="lc-dots"></div><div class="lc-tip"></div></div>'+
    '<div class="lc-x">'+xlab+'</div>'+
    (data.series.length > 1 ? '<div class="lc-leg">'+data.series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join("")+'</div>' : '')+
  '</div>';
}
function lcShow(el, i){
  var d; try{ d = JSON.parse(el.getAttribute("data-lc")); }catch(err){ return; }
  if(i < 0 || i >= d.n) return;
  var x = d.n < 2 ? 50 : i / (d.n - 1) * 100, plot = el.querySelector(".lc-plot");
  var band = el.querySelector(".lc-band"), dots = el.querySelector(".lc-dots"), tip = el.querySelector(".lc-tip");
  band.style.left = x + "%"; band.style.opacity = 1;
  dots.innerHTML = d.series.map(function(s){ var y = 100 - (s.v[i] - d.mn) / d.rg * 100; return '<i style="left:'+x+'%;top:'+y+'%;border-color:'+s.color+'"></i>'; }).join("");
  var top = Math.min.apply(null, d.series.map(function(s){ return 100 - (s.v[i] - d.mn) / d.rg * 100; }));
  tip.innerHTML = '<b>'+esc(d.labels[i])+'</b>'+d.series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+(d.series.length > 1 ? esc(s.name)+' ' : '')+'<em>'+money(s.v[i])+'</em></span>'; }).join("");
  tip.style.left = Math.max(12, Math.min(88, x)) + "%"; tip.style.top = top + "%"; tip.style.opacity = 1;
}
function lcInit(){
  document.querySelectorAll(".lc").forEach(function(el){
    var d; try{ d = JSON.parse(el.getAttribute("data-lc")); }catch(err){ return; }
    var plot = el.querySelector(".lc-plot");
    function idx(ev){ var r = plot.getBoundingClientRect(), f = (ev.clientX - r.left) / r.width; return Math.round(Math.max(0, Math.min(1, f)) * (d.n - 1)); }
    var start = d.sel >= 0 ? d.sel : (function(){ var last = -1; d.series[0].v.forEach(function(v, i){ if(v) last = i; }); return last >= 0 ? last : d.n - 1; })();
    lcShow(el, start);
    plot.onpointermove = function(ev){ lcShow(el, idx(ev)); };
    plot.onpointerleave = function(){ lcShow(el, start); };
    if(d.click) plot.onclick = function(ev){ var k = d.keys[idx(ev)]; if(k){ VIEW[d.click] = VIEW[d.click] === k ? "" : k; render(); } };
  });
}

function jdKey(day, text){ var h = 0, t = String(text); for(var i = 0; i < t.length; i++){ h = (h * 31 + t.charCodeAt(i)) | 0; } return "s" + day + "_" + (h >>> 0).toString(36); }
/* the checklist comes from this estimate's own scope of work (Day 1…Day N), plus tasks you add */
function checklistFor(e){
  var txt = (UI_LANG === "es" ? (e.scopeEs || e.scopeEn) : (e.scopeEn || e.scopeEs)) || "";
  var groups = scopeGroups(nl2list(txt)), days = Math.max(1, num(e.days) || 1), out = [], titles = {}, seq = 0;
  groups.forEach(function(g){
    if(!g.items.length) return;
    var d = g.day ? num(g.day) : 0;
    if(!d){ seq = Math.min(days, seq + 1); d = seq; } else seq = d;
    if(g.title && !titles[d]) titles[d] = String(g.title).replace(/^[\s\-–—:]+/, "");
    g.items.forEach(function(it){ out.push({ day:d, text:it, key:jdKey(d, it) }); });
  });
  if(!out.length){
    /* no scope written yet: a sensible default for the job type */
    var def = jobTypeOf(e) === "cabinets"
      ? [[1,TT("Protect floors & counters","Proteger pisos y encimeras")],[1,TT("Label & remove doors and drawers","Etiquetar y quitar puertas y cajones")],[1,TT("Clean & degrease","Limpiar y desengrasar")],[2,TT("Sand doors, drawers & frames","Lijar puertas, cajones y marcos")],[2,TT("Fill & caulk","Resanar y sellar")],[3,TT("Prime","Primer")],[3,TT("Sand primer smooth","Lijar el primer")],[4,TT("Finish coat 1","Primera mano")],[4,TT("Finish coat 2","Segunda mano")],[5,TT("Reinstall & align","Reinstalar y alinear")],[5,TT("Touch-ups & clean up","Retoques y limpieza")],[5,TT("Walkthrough with client","Revisión con el cliente")]]
      : [[1,TT("Protect & prep","Proteger y preparar")],[1,TT("Repairs & patching","Reparaciones")],[2,TT("Prime","Primer")],[2,TT("First coat","Primera mano")],[3,TT("Second coat","Segunda mano")],[3,TT("Clean up & walkthrough","Limpieza y revisión")]];
    def.forEach(function(x){ if(x[0] <= Math.max(days, 1) || jobTypeOf(e) === "cabinets") out.push({ day:x[0], text:x[1], key:jdKey(x[0], x[1]) }); });
  }
  (e.jobTasks || []).forEach(function(t){ out.push({ day:num(t.day) || 1, text:t.text, key:"c_" + t.id, custom:true, id:t.id }); });
  var maxDay = days; out.forEach(function(x){ if(x.day > maxDay) maxDay = x.day; });
  return { items:out, days:maxDay, titles:titles };
}

function livePays(){ return (DB.payouts||[]).filter(function(p){ return !p.deleted; }); }
function teamBounds(k){
  if(k === "week"){
    var t = new Date(todayISO() + "T12:00:00"), dow = (t.getDay() + 6) % 7, from = addDaysISO(todayISO(), -dow);
    return { from:from, to:addDaysISO(from, 6) };

function workerStats(w, b){

  liveHours().forEach(function(h){ if(h.workerId !== w.id) return; var a = hourAmount(h); o.earnedAll += a; if(inBounds(h.date, b)){ o.h += num(h.hours); o.earned += a; } });
  livePays().forEach(function(p){ if(p.workerId !== w.id) return; o.paidAll += num(p.amount); if(inBounds(p.date, b)) o.paid += num(p.amount); });

function openPayModal(workerId){
  var act = teamList(true);
  if(!act.length){ toast(TT("Add a worker first.","Primero agrega un trabajador.")); return; }
  var wid = workerId || act[0].id;
  openModal(
    '<div class="modal-h"><h2>'+TT("Payment to a worker","Pago a un trabajador")+'</h2><button class="btn sm" data-close>'+TT("Close","Cerrar")+'</button></div>'+
    '<div class="modal-b"><div class="stack" style="gap:12px">'+
      '<div class="grid g2"><label class="f"><span>'+TT("Worker","Trabajador")+'</span><select id="pyW">'+teamWorkerOptions(wid, true)+'</select></label>'+
      '<label class="f"><span>'+TT("Date","Fecha")+'</span><input type="date" id="pyD" value="'+esc(todayISO())+'"></label></div>'+
      '<div class="grid g2"><label class="f"><span>'+TT("Amount ($)","Monto ($)")+'</span><input type="number" id="pyA" inputmode="decimal" step="0.01" min="0"></label>'+
      '<label class="f"><span>'+TT("Method","Forma de pago")+'</span><select id="pyM">'+PAY_METHODS.map(function(x){ return '<option>'+x+'</option>'; }).join("")+'</select></label></div>'+
      '<label class="f"><span>'+TT("Note (optional)","Nota (opcional)")+'</span><input type="text" id="pyN"></label>'+
      '<div class="muted" id="pyOwed" style="font-size:13px"></div>'+
    '</div><div class="row" style="margin-top:16px"><button class="btn pri" id="pySave">'+TT("Save payment","Guardar pago")+'</button></div></div>',
    function(root){
      root.querySelectorAll("[data-close]").forEach(function(x){ x.onclick = closeModal; });
      function fill(){ var w = workerById(root.querySelector("#pyW").value); var o = w ? workerStats(w, { from:"", to:"" }).owed : 0;
        root.querySelector("#pyOwed").textContent = TT("Owed right now: {0}","Se le debe ahora: {0}").replace("{0}", money(o));
        root.querySelector("#pyA").value = o > 0 ? r2(o) : ""; }
      root.querySelector("#pyW").onchange = fill; fill();
      root.querySelector("#pySave").onclick = function(){
        var a = num(root.querySelector("#pyA").value);
        if(!(a > 0)){ toast(TT("Write the amount.","Escribe el monto.")); return; }
        if(!DB.payouts) DB.payouts = [];
        DB.payouts.push(stampRec({ id:uid("pay"), workerId:root.querySelector("#pyW").value, date:root.querySelector("#pyD").value || todayISO(),
          amount:r2(a), method:root.querySelector("#pyM").value, note:root.querySelector("#pyN").value.trim() }));
        save(); closeModal(); render(); toast(TT("Payment saved.","Pago guardado."));
      };
    });
}

/* =================================================================
   16 · CHARTS — how the business is really doing
   ================================================================= */
var PRICE_BANDS = [[0, 2000], [2000, 4000], [4000, 6000], [6000, 8000], [8000, 12000], [12000, Infinity]];
function bandLabel(b){ function k(x){ return "$" + (x >= 1000 ? (x / 1000) + "k" : x); } return b[1] === Infinity ? k(b[0]) + "+" : k(b[0]) + "–" + k(b[1]); }
function insightsHTML(){
  var es = UI_LANG === "es", now = todayISO(), yNow = now.slice(0, 4);
  /* every year that has estimates, newest first, plus the last 12 months and all time */
  var years = {}; years[yNow] = 1;
  DB.estimates.forEach(function(e){ var y = String(e.date || "").slice(0, 4); if(/^\d{4}$/.test(y)) years[y] = 1; });
  var yList = Object.keys(years).sort().reverse();
  var k = VIEW.insRange || yNow;
  if(k === "year") k = yNow;
  function boundsFor(key){
    if(/^\d{4}$/.test(key)) return { from:key + "-01-01", to:key + "-12-31" };
    if(key === "12m"){ var d0 = new Date(now.slice(0, 7) + "-15T12:00:00"); d0.setMonth(d0.getMonth() - 11); return { from:d0.toISOString().slice(0, 7) + "-01", to:now }; }
    return { from:"", to:"" };
  }
  var b = boundsFor(k);
  var ranges = yList.map(function(y){ return [y, y]; }).concat([["12m", TT("Last 12 months","Últimos 12 meses")], ["all", TT("All years","Todos los años")]]);
  var list = DB.estimates.filter(function(e){ return inBounds(e.date, b); });
  var sent = list.filter(function(e){ return jobStatus(e) !== "Draft"; });
  var won = sent.filter(function(e){ return WON_ST[jobStatus(e)]; });
  var lost = sent.filter(function(e){ return jobStatus(e) === "Declined"; });
  var wonTot = 0; won.forEach(function(e){ wonTot += calcEstimate(e).total; });
  var dts = []; won.forEach(function(e){ var a = e.sentAt || e.date, z = e.signature && e.signature.date; if(a && z){ var d = daysBetween(String(a).slice(0, 10), String(z).slice(0, 10)); if(d >= 0 && d < 365) dts.push(d); } });
  var avgDays = dts.length ? dts.reduce(function(x, y){ return x + y; }, 0) / dts.length : null;
  /* same months, one year earlier — only when a single year is picked */
  var prevWon = null;
  if(/^\d{4}$/.test(k)){
    var py = String(+k - 1), pb = { from:py + "-01-01", to:(k === yNow ? py + now.slice(4) : py + "-12-31") };
    prevWon = 0;
    DB.estimates.forEach(function(e){ if(inBounds(e.date, pb) && WON_ST[jobStatus(e)]) prevWon += calcEstimate(e).total; });
  }
  var ytdWon = wonTot;
  if(k === yNow){ ytdWon = 0; won.forEach(function(e){ if(String(e.date || "") <= now) ytdWon += calcEstimate(e).total; }); }
  var delta = (prevWon !== null && prevWon > 0) ? Math.round((ytdWon - prevWon) / prevWon * 100) : null;
  function tile(kx, v, m){ return '<div class="tile"><div class="k">'+esc(kx)+'</div><div class="v">'+v+'</div>'+(m ? '<div class="m">'+esc(m)+'</div>' : '')+'</div>'; }
  var tiles = '<div class="tiles">'+
    tile(TT("Close rate","Tasa de cierre"), sent.length ? Math.round(won.length / sent.length * 100)+'%' : '—', TT("{0} won of {1} sent","{0} ganados de {1} enviados").replace("{0}", won.length).replace("{1}", sent.length))+
    tile(TT("Won","Ganado"), money(wonTot), delta === null ? (won.length ? TT("average job {0}","trabajo promedio {0}").replace("{0}", money(wonTot / won.length)) : "")
      : (delta >= 0 ? "▲ " : "▼ ") + Math.abs(delta) + "% " + TT("vs same period last year","vs mismo periodo del año pasado"))+
    tile(TT("Days to sign","Días hasta firmar"), avgDays === null ? '—' : avgDays.toFixed(1), TT("from sent to signed","de enviado a firmado"))+
    tile(TT("Declined","Rechazados"), String(lost.length), (won.length + lost.length) ? Math.round(won.length / (won.length + lost.length) * 100)+'% '+TT("won of decided","ganados de los que decidieron") : "")+
  '</div>';

  /* 1 · month by month: quoted vs won */
  var months = [], byYear = k === "all", mLen = byYear ? 4 : 7;
  function mLabel(d){ return d.toLocaleDateString(es ? "es-US" : "en-US", { month:"short" }).replace(".", ""); }
  if(byYear){
    yList.slice().reverse().forEach(function(y){ months.push({ key:y, label:y, q:0, w:0, n:0, nw:0 }); });
  } else if(/^\d{4}$/.test(k)){
    for(var mi = 0; mi < 12; mi++){ var dm = new Date(+k, mi, 15, 12); months.push({ key:k + "-" + String(mi + 1).padStart(2, "0"), label:mLabel(dm), q:0, w:0, n:0, nw:0, future:(k + "-" + String(mi + 1).padStart(2, "0")) > now.slice(0, 7) }); }
  } else {
    for(var i = 11; i >= 0; i--){
      var d = new Date(now.slice(0, 7) + "-15T12:00:00"); d.setMonth(d.getMonth() - i);
      months.push({ key:d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), label:mLabel(d), q:0, w:0, n:0, nw:0 });
    }
  }
  var mIdx = {}; months.forEach(function(m, i){ mIdx[m.key] = i; });
  DB.estimates.forEach(function(e){
    var st = jobStatus(e); if(st === "Draft") return;
    var m = months[mIdx[String(e.date || "").slice(0, mLen)]]; if(!m) return;
    var t = calcEstimate(e).total; m.q += t; m.n++;
    if(WON_ST[st]){ m.w += t; m.nw++; }
  });
  var mx = Math.max.apply(null, months.map(function(m){ return m.q; }).concat([1]));
  var selIdx = -1; months.forEach(function(m, i){ if(m.key === VIEW.insMonth) selIdx = i; });
  var monthChart = lineChartHTML({ labels:months.map(function(m){ return m.label; }), tips:months.map(function(m){ return m.label + (mLen === 7 ? " " + m.key.slice(0, 4) : ""); }), height:230,
      keys:months.map(function(m){ return m.key; }), click:"insMonth", sel:selIdx,
      series:[{ name:TT("Won","Ganado"), v:months.map(function(m){ return m.w; }), color:"#1E6BFF", fill:true },
              { name:TT("Quoted (sent)","Cotizado (enviado)"), v:months.map(function(m){ return m.q; }), color:"#9097A3", dash:true }] })+
    '<div class="muted" style="font-size:12px;margin-top:4px">'+TT("Tap the chart to see the jobs of a month","Toca la gráfica para ver los trabajos de un mes")+'</div>'+
    monthDetailHTML(months, mLen);
  var _oldMonthChart = '<div class="ins-cols">'+months.map(function(m){
    var sel = VIEW.insMonth === m.key;
    return '<button class="ins-col'+(m.future ? " fut" : "")+(sel ? " sel" : "")+(m.key === todayISO().slice(0, 7) ? " cur" : "")+'" data-ins-month="'+esc(m.key)+'" title="'+esc(m.label+": "+TT("quoted","cotizado")+" "+money(m.q)+" · "+TT("won","ganado")+" "+money(m.w))+'">'+
      '<div class="ins-bars"><i class="q" style="height:'+(m.q / mx * 100)+'%"></i><i class="w" style="height:'+(m.w / mx * 100)+'%"></i></div>'+
      '<span>'+esc(m.label)+'</span><em>'+(m.w ? shortMoney(m.w) : '')+'</em></button>';
  }).join("")+'</div>'+
  '<div class="ins-legend"><span><i class="q"></i>'+TT("Quoted (sent)","Cotizado (enviado)")+'</span><span><i class="w"></i>'+TT("Won","Ganado")+'</span><span class="muted">'+TT("Tap a bar to see its jobs","Toca una barra para ver sus trabajos")+'</span></div>'+
  monthDetailHTML(months, mLen);

  /* 2 · the funnel: leads → sent → opened → won → paid */
  var leadsN = DB.clients.filter(function(c){ return !c.deleted && inBounds(c.createdAt || "", b); }).length;
  var opened = sent.filter(function(e){ return (e.portalViews||[]).length || (e.portalSeen && e.portalSeen.views); }).length;
  var paid = sent.filter(function(e){ return jobStatus(e) === "Paid in Full"; }).length;
  var steps = [[TT("Clients & leads","Clientes y leads"), Math.max(leadsN, sent.length)], [TT("Estimates sent","Estimados enviados"), sent.length],
    [TT("Opened the link","Abrieron el link"), opened], [TT("Won","Ganados"), won.length], [TT("Paid in full","Pagados completos"), paid]];
  var top = steps[0][1] || 1;
  var funnel = steps.map(function(s, i){
    var prev = i ? steps[i - 1][1] : 0, conv = i && prev ? Math.round(s[1] / prev * 100) + "%" : "";
    return '<div class="ins-row"><span class="l">'+esc(s[0])+'</span><div class="ins-track"><i style="width:'+Math.max(s[1] / top * 100, s[1] ? 4 : 0)+'%"></i></div>'+
      '<span class="r"><b>'+s[1]+'</b>'+(conv ? ' <em>'+conv+'</em>' : '')+'</span></div>';
  }).join("");

  /* 3 · close rate by price */
  var bands = PRICE_BANDS.map(function(bd){ return { b:bd, sent:0, won:0, lost:0 }; });
  sent.forEach(function(e){
    var t = calcEstimate(e).total, x = bands.filter(function(z){ return t >= z.b[0] && t < z.b[1]; })[0]; if(!x) return;
    x.sent++; if(WON_ST[jobStatus(e)]) x.won++; else if(jobStatus(e) === "Declined") x.lost++;
  });
  var bandRows = bands.filter(function(x){ return x.sent; });
  var best = bandRows.filter(function(x){ return x.sent >= 2; }).sort(function(p, q){ return q.won / q.sent - p.won / p.sent; })[0];
  var priceChart = bandRows.length ? bandRows.map(function(x){
    var pc = Math.round(x.won / x.sent * 100);
    return '<div class="ins-row"><span class="l">'+esc(bandLabel(x.b))+'</span><div class="ins-track"><i class="'+(best === x ? "best" : "")+'" style="width:'+Math.max(pc, pc ? 4 : 0)+'%"></i></div>'+
      '<span class="r"><b>'+pc+'%</b> <em>'+TT("{0} of {1}","{0} de {1}").replace("{0}", x.won).replace("{1}", x.sent)+'</em></span></div>';
  }).join("") + (best ? '<div class="muted" style="font-size:12.5px;margin-top:10px">'+TT("You close best at {0}.","Cierras mejor en {0}.").replace("{0}", "<b>"+esc(bandLabel(best.b))+"</b>")+'</div>' : '')
    : '<div class="muted" style="font-size:13.5px">'+TT("Send a few estimates and this shows at which prices clients say yes.","Manda algunos estimados y aquí ves a qué precios los clientes dicen que sí.")+'</div>';

  /* 4 · close rate by where the client came from */
  var src = {};
  sent.forEach(function(e){ var s = e.leadSource || TT("Not set","Sin anotar"); var o = src[s] = src[s] || { n:0, w:0, v:0 }; o.n++; if(WON_ST[jobStatus(e)]){ o.w++; o.v += calcEstimate(e).total; } });
  var srcRows = Object.keys(src).sort(function(a, z){ return src[z].v - src[a].v || src[z].n - src[a].n; }).map(function(s){
    var o = src[s], pc = Math.round(o.w / o.n * 100);
    return '<div class="ins-row"><span class="l">'+esc(s)+'</span><div class="ins-track"><i style="width:'+Math.max(pc, pc ? 4 : 0)+'%"></i></div>'+
      '<span class="r"><b>'+pc+'%</b> <em>'+o.w+'/'+o.n+(o.v ? ' · '+shortMoney(o.v) : '')+'</em></span></div>';
  }).join("") || '<div class="muted" style="font-size:13.5px">'+TT("Pick the source on each estimate and it shows up here.","Escoge el origen en cada estimado y aparece aquí.")+'</div>';

  var ty = {};
  sent.forEach(function(e){ var t = jobTypeOf(e); var o = ty[t] = ty[t] || { n:0, w:0, v:0 }; o.n++; if(WON_ST[jobStatus(e)]){ o.w++; o.v += calcEstimate(e).total; } });
  var typeRows = Object.keys(ty).sort(function(a, z){ return ty[z].v - ty[a].v || ty[z].n - ty[a].n; }).map(function(t){
    var o = ty[t], pc = Math.round(o.w / o.n * 100);
    return '<div class="ins-row"><span class="l">'+esc(jobTypeLabel(t))+'</span><div class="ins-track"><i style="width:'+Math.max(pc, pc ? 4 : 0)+'%"></i></div>'+
      '<span class="r"><b>'+pc+'%</b> <em>'+o.w+'/'+o.n+(o.v ? ' · '+shortMoney(o.v) : '')+'</em></span></div>';
  }).join("") || '<div class="muted" style="font-size:13.5px">'+TT("No estimates sent in this period.","No hay estimados enviados en este periodo.")+'</div>';
  function card(t, sub, inner){ return '<section class="card" style="margin-top:16px"><div class="card-h"><h2>'+t+'</h2></div><div class="card-b">'+(sub ? '<div class="muted" style="font-size:12.5px;margin:-4px 0 12px">'+sub+'</div>' : '')+inner+'</div></section>'; }
  return '<div class="v4-subtabs ins-ranges" style="margin-top:-6px">'+ranges.map(function(r){ return '<button data-ins-range="'+r[0]+'" class="'+(r[0] === k ? "on" : "")+'">'+esc(r[1])+'</button>'; }).join("")+'</div>'+
    tiles+
    card(byYear ? TT("Year by year","Año por año") : TT("Month by month","Mes por mes") + (/^\d{4}$/.test(k) ? " · " + k : ""), TT("What you quoted and what you won, by estimate date.","Lo que cotizaste y lo que ganaste, por fecha del estimado."), monthChart)+
    '<div class="grid g2" style="align-items:start">'+
      card(TT("From lead to paid","De lead a pagado"), TT("How many make it to each step, and the % from the step before.","Cuántos llegan a cada paso, y el % del paso anterior."), funnel)+
      card(TT("Close rate by price","Tasa de cierre por precio"), TT("Of the estimates you sent in each price range, how many you won.","De los estimados que mandaste en cada rango de precio, cuántos ganaste."), priceChart)+
    '</div>'+
    '<div class="grid g2" style="align-items:start">'+
      card(TT("Close rate by lead source","Tasa de cierre por origen"), TT("Won / sent, and the money won from each source.","Ganados / enviados, y el dinero ganado de cada origen."), srcRows)+
      card(TT("By job type","Por tipo de trabajo"), TT("Won / sent and money won for cabinets, interior, exterior…","Ganados / enviados y dinero ganado en gabinetes, interior, exterior…"), typeRows)+
    '</div>';
}
/* the jobs behind one bar of the chart */
function monthDetailHTML(months, mLen){
  var key = VIEW.insMonth, m = months.filter(function(x){ return x.key === key; })[0];
  if(!m) return "";
  var list = DB.estimates.filter(function(e){ return jobStatus(e) !== "Draft" && String(e.date || "").slice(0, mLen) === key; })
    .sort(function(a, z){ return calcEstimate(z).total - calcEstimate(a).total; });
  var rows = list.map(function(e){
    return '<tr class="clickable" data-open-est="'+esc(e.id)+'"><td class="n">'+esc(e.number)+'</td><td class="rowtitle">'+esc(nameOf(e))+'</td>'+
      '<td class="muted">'+esc(jobTypeLabel(jobTypeOf(e)))+'</td><td>'+badge(jobStatus(e))+'</td><td class="n right">'+money(calcEstimate(e).total)+'</td></tr>';
  }).join("");
  return '<div class="ins-detail"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><b>'+esc(m.label)+(mLen === 7 ? ' ' + key.slice(0, 4) : '')+'</b>'+
    '<span class="muted" style="font-size:12.5px">'+TT("{0} sent · {1} won · {2}","{0} enviados · {1} ganados · {2}").replace("{0}", m.n).replace("{1}", m.nw).replace("{2}", money(m.w))+'</span></div>'+
    (rows ? '<div class="tablewrap"><table class="t"><tbody>'+rows+'</tbody></table></div>' : '<div class="muted" style="font-size:13px">'+TT("No estimates sent this month.","No hay estimados enviados este mes.")+'</div>')+'</div>';
}
function shortMoney(x){ x = num(x); return x >= 1000 ? "$" + (x / 1000).toFixed(x >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : money(x).replace(/\.00$/, ""); }

/* =================================================================
   14 · NEVER A BLANK SCREEN — if something breaks, say what

function showFatal(err){
  var app = document.getElementById("app");
  if(!app) return;
  var msg = String((err && (err.stack || err.message)) || err || "").split("\n").slice(0, 3).join("\n");
  app.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:22px;background:#fff;border:1px solid #f0c9c4;border-radius:14px;font:15px/1.5 system-ui,sans-serif">'+
    '<b style="color:#b42318">'+esc(TT("The app hit an error while opening.","La app tuvo un error al abrir."))+'</b>'+
    '<p style="margin:10px 0">'+esc(TT("Your data is safe. Send a screenshot of this box to fix it.","Tus datos están a salvo. Manda una captura de este cuadro para arreglarlo."))+'</p>'+
    '<pre style="white-space:pre-wrap;font-size:12px;background:#f7f7f8;padding:10px;border-radius:8px;margin:0 0 14px">'+esc(msg)+'</pre>'+
    '<button onclick="location.reload()" style="padding:9px 14px;border-radius:9px;border:0;background:#16171a;color:#fff;font-weight:600;cursor:pointer">'+esc(TT("Reload","Recargar"))+'</button>'+
    ' <button onclick="VIEW.name=\'dashboard\';VIEW.id=null;try{render()}catch(e){}" style="padding:9px 14px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:600;cursor:pointer">'+esc(TT("Go to the dashboard","Ir al Panel"))+'</button>'+
  '</div>';
}
var _renderSafeBase = render;
render = function(){
  try{ return _renderSafeBase.apply(null, arguments); }
  catch(err){ try{ console.error(err); }catch(e2){} showFatal(err); }
};


/* =================================================================
   15 · REMOVE A SIGNATURE — the client backed out or cancelled
   ================================================================= */
function openRemoveSignature(e){
  if(!e || !e.signature){ toast(TT("This estimate has no signature.","Este estimado no tiene firma.")); return; }
  var main = mainInvoicesFor(e.id), unpaid = main.filter(function(v){ return v.status !== "Paid"; }), paid = main.filter(function(v){ return v.status === "Paid"; });
  var paidSum = 0; paid.forEach(function(v){ paidSum += num(v.amount); });
  function opt(val, on, title, sub){
    return '<label class="v4-why'+(on ? " on" : "")+'"><input type="radio" name="v4why" value="'+val+'"'+(on ? " checked" : "")+'>'+
      '<span><b>'+title+'</b><small>'+sub+'</small></span></label>';
  }
  openModal(
    '<div class="modal-h"><h2>'+TT("Remove the signature","Quitar la firma")+' — '+esc(e.number)+'</h2><button class="btn sm" data-close>'+TT("Close","Cerrar")+'</button></div>'+
    '<div class="modal-b">'+
      '<div style="font-size:14px;margin-bottom:12px">'+TT("The signature of {0} from {1} will be removed from the estimate","Se borra la firma de {0} del {1} del estimado").replace("{0}", '<b>'+esc(e.signature.name || e.clientName || "")+'</b>').replace("{1}", esc(fmtDate(e.signature.date, UI_LANG)))+
        (e.portal ? TT(" and from the client link."," y del link del cliente.") : ".")+'</div>'+
      '<div style="font-weight:600;font-size:13.5px;margin-bottom:6px">'+TT("What happened?","¿Qué pasó?")+'</div>'+
      opt("back", true, TT("Backed out or wants changes","Se retractó o quiere cambiar algo"), TT("The estimate goes back to Sent. The client can sign again on the same link.","El estimado vuelve a Enviado. El cliente puede volver a firmar en el mismo link."))+
      opt("cancel", false, TT("Cancelled the job","Canceló el trabajo"), TT("The estimate is marked Declined.","El estimado queda como Rechazado."))+
      '<div id="v4CancelOpts" class="v4-off" style="margin:10px 0 0 4px">'+
        '<label class="check" style="margin:6px 0"><input type="checkbox" id="v4UnCal" checked> '+TT("Take it off the calendar","Quitarlo del calendario")+'</label>'+
        (e.portal ? '<label class="check" style="margin:6px 0"><input type="checkbox" id="v4UnLink" checked> '+TT("Turn off the client link","Apagar el link del cliente")+'</label>' : '')+
      '</div>'+
      (unpaid.length ? '<label class="check" style="margin:12px 0 0"><input type="checkbox" id="v4DelInv"> '+
        (unpaid.length === 1 ? TT("Also delete the unpaid invoice of this job","Borrar también la factura sin pagar de este trabajo")
          : TT("Also delete the {0} unpaid invoices of this job","Borrar también las {0} facturas sin pagar de este trabajo").replace("{0}", unpaid.length))+'</label>' : '')+
      (paid.length ? '<div class="warn-note" style="margin-top:12px">'+TT("This job has paid invoices ({0}). Those stay as they are: if you give money back, note it apart.","Este trabajo tiene facturas pagadas ({0}). Esas se quedan como están: si devuelves dinero, anótalo aparte.").replace("{0}", money(paidSum))+'</div>' : '')+
      '<label class="f" style="margin-top:14px"><span>'+TT("Reason (optional, only you see it)","Motivo (opcional, solo lo ves tú)")+'</span><input type="text" id="v4Why" placeholder="'+esc(TT("Wants another color, found a cheaper price…","Quiere otro color, consiguió más barato…"))+'"></label>'+
      '<div class="row" style="margin-top:16px"><button class="btn danger" id="v4SigGo">'+TT("Remove signature","Quitar firma")+'</button><button class="btn" data-close>'+TT("Cancel","Cancelar")+'</button></div>'+
    '</div>',
    function(root){
      root.querySelectorAll("[data-close]").forEach(function(x){ x.onclick = closeModal; });
      var box = root.querySelector("#v4CancelOpts");
      root.querySelectorAll('input[name="v4why"]').forEach(function(r){
        r.onchange = function(){
          root.querySelectorAll(".v4-why").forEach(function(l){ l.classList.toggle("on", l.querySelector("input").checked); });
          box.classList.toggle("v4-off", r.value !== "cancel" || !r.checked);
        };
      });
      root.querySelector("#v4SigGo").onclick = function(){
        var why = root.querySelector('input[name="v4why"]:checked').value;
        var q = function(id){ var x = root.querySelector(id); return !!(x && x.checked); };
        closeModal();
        removeSignature(e, { cancel:why === "cancel", uncal:why === "cancel" && q("#v4UnCal"), unlink:why === "cancel" && q("#v4UnLink"),
          delInv:q("#v4DelInv"), reason:root.querySelector("#v4Why").value.trim() });
      };
    });
}
function removeSignature(e, o){
  var sig = e.signature;
  if(!sig) return;
  if(sig.id) PhotoStore.del(sig.id);
  e.signature = null;
  e.status = o.cancel ? "Declined" : "Sent";
  if(!o.cancel && !e.sentAt) e.sentAt = todayISO();
  /* the link must not bring the old signature back */
  if(!e.portalSeen) e.portalSeen = { views:0, picks:"{}", sign:false, co:{} };
  e.portalSeen.sign = false;
  e.portalSeen.cleared = isoNow();
  e.portalSeen.clearedSig = sig.via === "link" ? String(sig.at || "") : "";
  var n = 0;
  if(o.delInv){
    DB.invoices = DB.invoices.filter(function(v){
      var drop = v.estimateId === e.id && v.kind !== "change" && v.status !== "Paid";
      if(drop) n++;
      return !drop;
    });
  }
  if(o.uncal) e.startDate = "";
  var tok = e.portal && e.portal.token;
  if(tok && cloudOn()){
    var upd = {};
    upd["client.sign"] = firebase.firestore.FieldValue.delete();
    CLOUD.fs.collection("portal").doc(tok).update(upd).catch(portalErr);
  }
  if(o.unlink && tok){
    var phs = (e.portal && e.portal.ph) || [];
    e.portal = null;
    if(cloudOn()){ portalDropPhotos(tok, phs); CLOUD.fs.collection("portal").doc(tok).delete().catch(portalErr); }
  }
  logAct(e, (o.cancel ? TT("Signature removed — the client cancelled","Firma quitada — el cliente canceló") : TT("Signature removed — the client backed out","Firma quitada — el cliente se retractó")) +
    (o.reason ? ": " + o.reason : "") + (n ? TT(" ({0} unpaid invoices deleted)"," ({0} facturas sin pagar borradas)").replace("{0}", n) : ""));
  touch(e); render();
  toast(o.cancel ? TT("Signature removed. The job is marked Declined.","Firma quitada. El trabajo quedó como Rechazado.")
                 : TT("Signature removed. The estimate is back to Sent.","Firma quitada. El estimado volvió a Enviado."));
}

/* =================================================================
   13 · THE DOOR — on the web address, the app only opens for him.
   Anyone who opens the address without a client link (#p=…) and
   without being signed in sees a simple business card, not the app.
   The file opened by double-click on the PC is never locked.
   ================================================================= */
var GATE = { on:false, form:false, busy:false, err:"" };
function gateNeeded(){ return /^https?:/.test(location.protocol) && !portalTokenFromURL(); }
function gateOK(){ try{ return localStorage.getItem("LUMA_GATE_OK") === "1"; }catch(err){ return false; } }
function gateSet(v){ try{ if(v) localStorage.setItem("LUMA_GATE_OK", "1"); else localStorage.removeItem("LUMA_GATE_OK"); }catch(err){} }
function gateLang(){ return String(navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en"; }
function gateHTML(){
  var es = gateLang() === "es", b = DB.business || {};
  var tx = es ? {
      hi:"Presupuestos de " + (b.name || "LUMA"),
      msg:"Nuestros presupuestos se envían por un link privado. Si recibió uno, ábralo completo desde el mensaje que le enviamos.",
      call:"Llamar", site:"Sitio web", rev:"Reseñas en Google", team:"Acceso del equipo", email:"Correo", pass:"Contraseña", go:"Entrar", wait:"Entrando…"
    } : {
      hi:(b.name || "LUMA") + " estimates",
      msg:"Our estimates are sent by private link. If you received one, please open the full link from the message we sent you.",
      call:"Call", site:"Website", rev:"Google reviews", team:"Team sign-in", email:"Email", pass:"Password", go:"Sign in", wait:"Signing in…"
    };
  var btns = (b.phone ? '<a class="btn" href="tel:'+esc(digitsOnly(b.phone))+'">'+tx.call+' '+esc(b.phone)+'</a><a class="btn wa" href="https://wa.me/'+waNumber(b.phone)+'" target="_blank" rel="noopener">WhatsApp</a>' : '')+
    (DB.websiteUrl ? '<a class="btn" href="'+esc(DB.websiteUrl)+'" target="_blank" rel="noopener">'+tx.site+' ↗</a>' : '')+
    (DB.instagramUrl ? '<a class="btn" href="'+esc(DB.instagramUrl)+'" target="_blank" rel="noopener">Instagram ↗</a>' : '')+
    (DB.reviewUrl ? '<a class="btn" href="'+esc(DB.reviewUrl)+'" target="_blank" rel="noopener">★ '+tx.rev+' ↗</a>' : '');
  var form = GATE.form
    ? '<div class="gate-form">'+
        '<label class="f"><span>'+tx.email+'</span><input type="email" id="gateEmail" autocomplete="username" value="'+esc(localStorage.getItem("LUMA_CLOUD_EMAIL") || "")+'"></label>'+
        '<label class="f"><span>'+tx.pass+'</span><input type="password" id="gatePass" autocomplete="current-password"></label>'+
        (GATE.err ? '<div class="gate-err">'+esc(GATE.err)+'</div>' : '')+
        '<button class="btn pri" id="gateGo"'+(GATE.busy ? ' disabled' : '')+'>'+(GATE.busy ? tx.wait : tx.go)+'</button>'+
      '</div>'
    : '<button class="gate-team" id="gateTeam">'+tx.team+'</button>';
  return '<div class="pt"><div class="pt-in"><section class="pt-sec gate">'+
      '<div class="gate-mark">'+markHTML("gate-logo")+'</div>'+
      '<h1>'+esc(tx.hi)+'</h1>'+
      '<p class="gate-msg">'+tx.msg+'</p>'+
      '<div class="pt-links">'+btns+'</div>'+
      (b.area ? '<p class="pt-fine" style="margin-top:18px">'+esc(b.area)+'</p>' : '')+
      form+
    '</section></div></div>';
}
function gateShow(){
  document.getElementById("app").innerHTML = gateHTML();
  var t = document.getElementById("gateTeam");
  if(t) t.onclick = function(){ GATE.form = true; gateShow(); var e = document.getElementById("gateEmail"); if(e) (e.value ? document.getElementById("gatePass") : e).focus(); };
  var go = document.getElementById("gateGo"), pw = document.getElementById("gatePass");
  function submit(){
    var em = document.getElementById("gateEmail").value, ps = pw.value;
    if(!em || !ps) return;
    try{ localStorage.setItem("LUMA_CLOUD_EMAIL", String(em).trim()); }catch(err){}
    GATE.busy = true; GATE.err = ""; gateShow();
    cloudSignIn(em, ps).then(function(){
      GATE.busy = false;
      if(!CLOUD.user){ GATE.err = gateLang() === "es" ? "No se pudo entrar. Revise el correo y la contraseña." : "Could not sign in. Check the email and password."; gateShow(); }
    });
  }
  if(go) go.onclick = submit;
  if(pw) pw.onkeydown = function(ev){ if(ev.key === "Enter") submit(); };
}

function bootMain(){
    if(DB.uiLang === "portal"){
      DB = defaults();
      try{ localStorage.removeItem(KEY); }catch(err){}
    }
    v4Ensure();
    activityCleanupOnce();
    try{ runRecurring(); }catch(err){}
    /* on the web address, a device that never signed in gets the business card, not the app */
    if(gateNeeded() && !gateOK()) GATE.on = true;
    applyTheme();
    try{ if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); }catch(err){}
    render();
    /* give the cloud a moment to sign in: someone who already has an account never sees the setup */
    if(!GATE.on && DB.uiLang && needsOnboarding()) setTimeout(function(){ if(needsOnboarding() && !(CLOUD.status === "connecting" || CLOUD.status === "syncing")) openOnboarding(); }, 1500);
    cloudInit();
}
try{
  if(portalTokenFromURL()){
    portalBoot();
  } else {
    var smallCopy = null;
    try{ smallCopy = localStorage.getItem(KEY); }catch(err){}
    if(smallCopy) bootMain();
    else {
      /* nothing in the small store: the data may live in the large one — read it before anything draws or syncs */
      DataStore.get(KEY).then(function(raw){
        if(raw){ DB = loadFrom(raw); DATA_SIZE = raw.length; UI_LANG = DB.uiLang === "es" ? "es" : "en"; }
        try{ bootMain(); }catch(err){ showFatal(err); }
      });
    }
  }
}catch(err){ showFatal(err); }
</script>
</body>
