function openRoomModal(e){
  function row(id, label, hint){
    return '<label class="room-line"><input type="checkbox" id="'+id+'" checked>'+
      '<span>'+esc(label)+'<div class="muted" style="font-size:12px">'+esc(hint)+'</div></span>'+
      '<span class="qty" id="'+id+'Q">0</span></label>';
  }
  openModal(
    '<div class="modal-h"><h2>Measure a room</h2><button class="btn sm" data-close>Close</button></div>'+
    '<div class="modal-b">'+
      '<label class="f"><span>Room</span><input type="text" id="rmName" placeholder="Living room, kitchen, hallway\u2026"></label>'+
      '<div class="grid g3" style="margin-top:12px">'+
        '<label class="f"><span>Length (ft)</span><input type="number" id="rmL" min="0" step="0.5" value="0"></label>'+
        '<label class="f"><span>Width (ft)</span><input type="number" id="rmW" min="0" step="0.5" value="0"></label>'+
        '<label class="f"><span>Height (ft)</span><input type="number" id="rmH" min="0" step="0.5" value="8"></label>'+
      '</div>'+
      '<div style="margin-top:14px">'+
        row("rmWalls","Walls","perimeter \u00d7 height, in sq ft")+
        row("rmCeil","Ceiling","length \u00d7 width, in sq ft")+
        row("rmBase","Baseboards","the perimeter, in linear ft")+
      '</div>'+
      '<div class="muted" style="font-size:12.5px;margin-top:10px">Openings are not taken out \u2014 trim the quantity afterwards if the room has wide doors or windows.</div>'+
      '<div class="row" style="margin-top:16px">'+
        '<button class="btn pri" id="rmAdd">Add to the estimate</button>'+
      '</div>'+
    '</div>',
    function(d){
      function calc(){
        var L = num(d.querySelector("#rmL").value), W = num(d.querySelector("#rmW").value),
            H = num(d.querySelector("#rmH").value);
        var per = 2*(L+W);
        var v = { rmWalls: Math.round(per*H*100)/100, rmCeil: Math.round(L*W*100)/100, rmBase: Math.round(per*100)/100 };
        d.querySelector("#rmWallsQ").textContent = v.rmWalls + " sq ft";
        d.querySelector("#rmCeilQ").textContent = v.rmCeil + " sq ft";
        d.querySelector("#rmBaseQ").textContent = v.rmBase + " lin ft";
        return v;
      }
      ["#rmL","#rmW","#rmH"].forEach(function(sel){ d.querySelector(sel).addEventListener("input", calc); });
      calc();
      d.querySelector("#rmAdd").onclick = function(){
        var v = calc(), where = String(d.querySelector("#rmName").value || "").trim();
        var any = false;
        if(d.querySelector("#rmWalls").checked && v.rmWalls > 0){ addService(e, svcById("walls"), v.rmWalls, where); any = true; }
        if(d.querySelector("#rmCeil").checked && v.rmCeil > 0){ addService(e, svcById("ceiling"), v.rmCeil, where); any = true; }
        if(d.querySelector("#rmBase").checked && v.rmBase > 0){ addService(e, svcById("base"), v.rmBase, where); any = true; }
        closeModal();
        if(any) toast(T("Room added."));
        else toast(T("Enter the measurements first."));
      };
      var n = d.querySelector("#rmName"); if(n) n.focus();
    }
  );
}

/* ---------------- invoices from an estimate ---------------- */
function makeInvoice(e, kind, percent, amount, n){
  return {
    id: uid("i"),
    number: DB.numbering.invPrefix + pad(n, DB.numbering.pad),
    estimateId: e.id, estNumber: e.number, clientId: e.clientId,
    clientName: e.clientName, address: e.address, phone: e.phone, email: e.email,
    kind: kind, percent: percent, amount: amount,
    date: todayISO(), status: "Draft", paidDate: "",
    createdAt: new Date().toISOString()
  };
}
function createInvoices(e){
  if(payPlanOn(e)) return createPlanInvoices(e);
  if(mainInvoicesFor(e.id).length){ toast(T("This job already has invoices.")); return; }
  var t = calcEstimate(e);
  if(t.total <= 0){ toast(T("Add line items before invoicing.")); return; }
  var n = nextInvNumber();
  if(t.deposit > 0 && t.balance > 0){
    DB.invoices.push(makeInvoice(e, "deposit", t.depositPct, t.deposit, n));
    DB.invoices.push(makeInvoice(e, "balance", 100 - t.depositPct, t.balance, n+1));
    DB.numbering.nextInv = n + 2;
    toast(T("Deposit and balance invoices created."));
  } else {
    DB.invoices.push(makeInvoice(e, "full", 100, t.total, n));
    DB.numbering.nextInv = n + 1;
    toast(T("Invoice created."));
  }
  if(e.status === "Draft" || e.status === "Sent") e.status = "Accepted";
  touch(e); render();
}
function syncInvoices(e){
  var t = calcEstimate(e), invs = invoicesFor(e.id), changed = 0;
  invs.forEach(function(v){
    if(v.status === "Paid" || v.kind === "change") return;
    if(v.kind === "progress"){
      if(payPlanOn(e)){
        var pa = planAmounts(e, t.total)[num(v.stage)];
        if(pa !== undefined && Math.abs(num(v.amount) - pa) > 0.004){ v.amount = pa; changed++; }
      }
      v.clientId = e.clientId; v.clientName = e.clientName; v.address = e.address; v.phone = e.phone; v.email = e.email;
      return;
    }
    var amt = v.kind === "deposit" ? t.deposit : v.kind === "balance" ? t.balance : t.total;
    if(Math.abs(num(v.amount) - amt) > 0.004){ v.amount = amt; changed++; }
    v.percent = v.kind === "deposit" ? t.depositPct : v.kind === "balance" ? (100 - t.depositPct) : 100;
    v.clientId = e.clientId; v.clientName = e.clientName; v.address = e.address; v.phone = e.phone; v.email = e.email;
  });
  save(); render();
  toast(changed ? T("Updated {0} invoice amounts.", changed) : T("Invoices already match the estimate."));
}
/* =================================================================
   SCHEDULING, SIGNATURE, LEAD SOURCE, FOLLOW-UPS, MESSAGES
   ================================================================= */
function daysBetween(a, b){
  var pa = String(a||"").split("-"), pb = String(b||"").split("-");
  if(pa.length !== 3 || pb.length !== 3) return 0;
  var da = Date.UTC(num(pa[0]), num(pa[1])-1, num(pa[2]));
  var db = Date.UTC(num(pb[0]), num(pb[1])-1, num(pb[2]));
  return Math.round((db - da) / 86400000);
}
function jobDates(e){
  if(!e.startDate) return [];
  var n = Math.max(1, Math.round(num(e.days) || 1)), out = [], i;
  for(i = 0; i < n; i++) out.push(addDaysISO(e.startDate, i));
  return out;
}
function shiftJobTasks(e, from, to){
  if(!from || !to || from === to) return 0;
  var d = daysBetween(from, to);
  if(!d) return 0;
  var n = 0;
  allTasks().forEach(function(t){
    if(!t || t.estId !== e.id || !t.date) return;
    t.date = addDaysISO(t.date, d); n++;
  });
  return n;
}
function tasksMovedToast(n){
  if(n === 1) toast(T("1 task moved with the job."));
  else if(n > 1) toast(T("{0} tasks moved with the job.", n));
}
function jobsOn(iso){
  return DB.estimates.filter(function(e){
    var st = jobStatus(e);
    if(st === "Declined") return false;
    return jobDates(e).indexOf(iso) >= 0;
  });
}
function blockedOn(iso){
  var b = DB.blocked || [];
  for(var i = 0; i < b.length; i++) if(b[i].date === iso) return b[i];
  return null;
}
var JOB_TINTS = ["#0f5b52","#1d5f7a","#8a5a12","#5d3f7a","#3f6b2f","#8a3b3b"];
function jobTint(id){
  var h = 0, i;
  for(i = 0; i < String(id).length; i++) h = (h*31 + String(id).charCodeAt(i)) >>> 0;
  return JOB_TINTS[h % JOB_TINTS.length];
}

/* ---------------- tasks ---------------- */
function allTasks(){ if(!DB.tasks) DB.tasks = []; return DB.tasks; }
function taskById(id){
  var a = allTasks(), i;
  for(i = 0; i < a.length; i++) if(a[i].id === id) return a[i];
  return null;
}
function taskSort(a, b){
  var at = a.time || "99:99", bt = b.time || "99:99";
  if(at !== bt) return at < bt ? -1 : 1;
  return String(a.title || "").localeCompare(String(b.title || ""));
}
function tasksOn(iso){
  return allTasks().filter(function(t){ return t.date === iso; }).sort(taskSort);
}
function openTasks(){
  return allTasks().filter(function(t){ return !t.done; }).sort(function(a, b){
    if(a.date !== b.date) return String(a.date).localeCompare(String(b.date));
    return taskSort(a, b);
  });
}
function fmtTime(hhmm){
  if(!hhmm) return "";
  var p = String(hhmm).split(":"), h = num(p[0]), m = (p[1] || "00").slice(0,2);
  var ap = h >= 12 ? "PM" : "AM", hh = h % 12;
  if(hh === 0) hh = 12;
  return hh + ":" + m + " " + ap;
}
function taskDateLabel(iso){
  var today = todayISO();
  if(iso === today) return T("Today");
  if(iso === addDaysISO(today, 1)) return T("Tomorrow");
  return fmtDate(iso, UI_LANG);
}
function toggleTask(id){
  var t = taskById(id);
  if(!t) return;
  t.done = !t.done;
  save(); render();
}
function taskRowsHTML(list, showDate){
  var today = todayISO();
  return list.map(function(t){
    var job = t.estId ? byId(DB.estimates, t.estId) : null;
    var late = !t.done && t.date < today;
    var when = showDate
      ? '<div class="task-due'+(late?" late":"")+'">'+esc(taskDateLabel(t.date))+
        (t.time ? " · "+esc(fmtTime(t.time)) : "")+(late ? " · "+T("Late") : "")+'</div>'
      : "";
    return '<div class="task-row">'+
      '<button class="task-check'+(t.done?" on":"")+'" data-task-toggle="'+esc(t.id)+'" '+
        'title="'+esc(t.done ? T("Mark not done") : T("Mark done"))+'">&#10003;</button>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="task-title'+(t.done?" done":"")+'">'+
          (!showDate && t.time ? '<span class="task-time">'+esc(fmtTime(t.time))+'</span>' : "")+
          esc(t.title)+'</div>'+
        (t.note ? '<div class="muted" style="font-size:12.5px;white-space:pre-wrap">'+esc(t.note)+'</div>' : "")+
        (job ? '<div class="muted" style="font-size:12.5px">'+esc(job.number+" · "+nameOf(job))+'</div>' : "")+
        when+
      '</div>'+
      '<button class="btn sm" data-task="'+esc(t.id)+'">'+T("Edit")+'</button>'+
    '</div>';
  }).join("");
}
function tasksPanelHTML(){

/* ---------------- calendar ---------------- */
var DOW_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOW_ES = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
var MONTH_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthKey(iso){ return String(iso).slice(0,7); }
function viewMonth(){
  if(!VIEW.month) VIEW.month = monthKey(todayISO());
  return VIEW.month;
}
function shiftMonth(key, delta){
  var y = num(key.slice(0,4)), m = num(key.slice(5,7)) - 1 + delta;
  var d = new Date(y, m, 1);
  return d.getFullYear() + "-" + (d.getMonth()+1 < 10 ? "0" : "") + (d.getMonth()+1);
}
function viewCalendar(){
  var key = viewMonth();
  var y = num(key.slice(0,4)), m = num(key.slice(5,7)) - 1;
  var first = new Date(y, m, 1);
  var startPad = first.getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var today = todayISO();
  var dow = (UI_LANG === "es" ? DOW_ES : DOW_EN);
  var title = (UI_LANG === "es" ? MONTH_ES[m] : MONTH_EN[m]) + " " + y;

  var cells = "", i, iso, dnum;
  for(i = 0; i < startPad; i++) cells += '<div class="cal-cell out"></div>';
  for(dnum = 1; dnum <= daysInMonth; dnum++){
    iso = y + "-" + (m+1 < 10 ? "0" : "") + (m+1) + "-" + (dnum < 10 ? "0" : "") + dnum;
    var jobs = jobsOn(iso), blk = blockedOn(iso);
    var chips = jobs.map(function(e){
      var dayIdx = jobDates(e).indexOf(iso) + 1;
      var jst = jobStatus(e);
      var soft = (jst === "Draft" || jst === "Sent");
      return '<button class="cal-chip'+(soft?" draft":"")+'" data-open-est="'+esc(e.id)+'" style="border-left-color:'+jobTint(e.id)+'" '+
             'title="'+esc(nameOf(e))+' — '+esc(e.number)+' — '+esc(T(jst))+'">'+
             esc(nameOf(e))+' <span class="d">'+dayIdx+'/'+Math.max(1,Math.round(num(e.days)||1))+'</span></button>';
    }).join("");
    var tchips = tasksOn(iso).map(function(t){
      return '<button class="cal-task'+(t.done?" done":"")+'" data-task="'+esc(t.id)+'" '+
             'title="'+esc(t.title)+'">'+
             (t.time ? '<span class="tm">'+esc(fmtTime(t.time))+'</span>' : "")+
             '<span>'+esc(t.title)+'</span></button>';
    }).join("");
    cells += '<div class="cal-cell'+(iso===today?" today":"")+(blk?" blocked":"")+(iso===VIEW.day?" sel":"")+'" data-day="'+iso+'">'+
      '<div class="cal-n">'+dnum+'</div>'+
      (blk ? '<div class="cal-blk">'+esc(blk.note || T("Blocked"))+'</div>' : "")+
      chips+
      tchips+
    '</div>';
  }
  var trail = (7 - ((startPad + daysInMonth) % 7)) % 7;
  for(i = 0; i < trail; i++) cells += '<div class="cal-cell out"></div>';

  /* this week */
  var wStart = addDaysISO(today, -new Date(num(today.slice(0,4)), num(today.slice(5,7))-1, num(today.slice(8,10))).getDay());
  var weekJobs = [], seen = {};
  for(i = 0; i < 7; i++){
    jobsOn(addDaysISO(wStart, i)).forEach(function(e){ if(!seen[e.id]){ seen[e.id] = 1; weekJobs.push(e); } });
  }
  var weekVal = 0;
  weekJobs.forEach(function(e){ weekVal += calcEstimate(e).total; });

  var sel = VIEW.day ? daySummary(VIEW.day) : "";

  return ''+
  '<div class="page-h"><div><h1>'+T("Calendar")+'</h1>'+
    '<div class="sub">'+T("{0} jobs this week · {1} scheduled", weekJobs.length, money(weekVal))+'</div></div>'+
    '<div class="sp"></div>'+
    '<button class="btn pri" data-add-task>+ '+T("Task")+'</button>'+
    '<button class="btn" data-mon="-1">←</button>'+
    '<button class="btn" id="calToday">'+T("Today")+'</button>'+
    '<button class="btn" data-mon="1">→</button>'+
  '</div>'+
  '<section class="card"><div class="card-h"><h2>'+esc(title)+'</h2><div class="sp"></div>'+
    '<span class="muted" style="font-size:12.5px">'+T("Tap a day to add a task, block it, or see the jobs on it")+'</span></div>'+
    '<div class="card-b" style="padding:10px">'+
      '<div class="cal-dow">'+dow.map(function(d){ return '<div>'+d+'</div>'; }).join("")+'</div>'+
      '<div class="cal-grid">'+cells+'</div>'+
    '</div>'+
  '</section>'+
  sel;
}
function daySummary(iso){
  var jobs = jobsOn(iso), blk = blockedOn(iso);
  var rows = jobs.map(function(e){
    var t = calcEstimate(e);
    return '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2);gap:10px;flex-wrap:wrap">'+
      '<span style="width:4px;height:30px;border-radius:2px;background:'+jobTint(e.id)+';flex:none"></span>'+
      '<div style="flex:1;min-width:140px"><div style="font-weight:600">'+esc(nameOf(e))+' '+badge(jobStatus(e))+'</div>'+
      '<div class="muted" style="font-size:12.5px">'+esc(e.number)+(e.address ? ' · '+esc(e.address) : '')+'</div></div>'+
      '<span class="num" style="font-weight:600">'+money(t.total)+'</span>'+
      '<label class="row" style="gap:6px;font-size:12.5px;flex:none" title="'+esc(T("Change the day of this job"))+'">'+
        '<span class="muted">'+T("Move to")+'</span>'+
        '<input type="date" class="mini-date" data-jobmove="'+esc(e.id)+'" value="'+esc(e.startDate||"")+'"></label>'+
      '<button class="btn sm" data-joboff="'+esc(e.id)+'">'+T("Take off the calendar")+'</button>'+
      '<button class="btn sm" data-gcal="'+esc(e.id)+'" title="Google Calendar">+ Google</button>'+
      '<button class="btn sm" data-ics="'+esc(e.id)+'" title="Outlook / Apple (.ics)">+ Outlook/Apple</button>'+
      '<button class="btn sm" data-open-est="'+esc(e.id)+'">'+T("Open")+'</button>'+
    '</div>';
  }).join("");
  var tRows = taskRowsHTML(tasksOn(iso), false);
  return '<section class="card" style="margin-top:14px"><div class="card-h"><h2>'+esc(fmtDate(iso, UI_LANG))+'</h2>'+
    '<div class="sp"></div>'+
    '<button class="btn pri sm" data-add-task>+ '+T("Task")+'</button>'+
    '<button class="btn sm" id="blockDay">'+(blk ? T("Unblock this day") : T("Block this day"))+'</button>'+
    '<button class="btn sm" id="closeDay">'+T("Close")+'</button>'+
  '</div><div class="card-b">'+
    (blk ? '<div class="warn-note" style="margin-bottom:10px">'+T("Blocked")+(blk.note?" — "+esc(blk.note):"")+'</div>' : "")+
    '<div class="k-sub">'+T("Tasks")+'</div>'+
    (tRows || '<div class="muted" style="font-size:13.5px">'+T("No tasks for this day.")+'</div>')+
    '<hr class="hr">'+
    '<div class="k-sub">'+T("Jobs on this day")+'</div>'+
    (rows || '<div class="muted" style="font-size:13.5px">'+T("Nothing scheduled for this day.")+'</div>')+
  '</div></section>';
}
function bindCalendar(){
  document.querySelectorAll("[data-mon]").forEach(function(el){
    el.onclick = function(){ VIEW.month = shiftMonth(viewMonth(), num(el.getAttribute("data-mon"))); render(); };
  });
  var tb = document.getElementById("calToday");
  if(tb) tb.onclick = function(){ VIEW.month = monthKey(todayISO()); VIEW.day = todayISO(); render(); };
  document.querySelectorAll("[data-day]").forEach(function(el){
    el.onclick = function(ev){
      if(ev.target.closest("[data-open-est]")) return;
      if(ev.target.closest("[data-task]") || ev.target.closest("[data-task-toggle]") || ev.target.closest("[data-add-task]")) return;
      VIEW.day = el.getAttribute("data-day");
      render();
    };
  });
  var cd = document.getElementById("closeDay");
  if(cd) cd.onclick = function(){ VIEW.day = null; render(); };
  document.querySelectorAll("[data-jobmove]").forEach(function(el){
    el.onchange = function(){
      var e = byId(DB.estimates, el.getAttribute("data-jobmove"));
      if(!e) return;
      var prev = e.startDate;
      e.startDate = el.value;
      touch(e);
      var mv = shiftJobTasks(e, prev, e.startDate);
      if(el.value) VIEW.day = el.value;
      save(); render();
      if(e.startDate) toast(T("{0} moved to {1}.", e.number, fmtDate(e.startDate, UI_LANG)));
      else toast(T("{0} is off the calendar now.", e.number));
      tasksMovedToast(mv);
    };
  });
  document.querySelectorAll("[data-joboff]").forEach(function(el){
    el.onclick = function(){
      var e = byId(DB.estimates, el.getAttribute("data-joboff"));
      if(!e) return;
      if(!confirm(T("Take {0} off the calendar? The job stays saved — it only loses its dates.", e.number))) return;
      e.startDate = ""; touch(e); save(); render();
      toast(T("{0} is off the calendar now.", e.number));
    };
  });
  var bd = document.getElementById("blockDay");
  if(bd) bd.onclick = function(){
    var iso = VIEW.day, blk = blockedOn(iso);
    DB.blocked = DB.blocked || [];
    if(blk){ DB.blocked = DB.blocked.filter(function(x){ return x.date !== iso; }); }
    else {
      var note = prompt(T("Why is this day blocked? (optional)"), "");
      if(note === null) return;
      DB.blocked.push({ date: iso, note: note });
    }
    save(); render();
  };
}

/* ---------------- signature ---------------- */
function openSignature(e){
  var lang = VIEW.lang === "es" ? "es" : "en";
  openModal(
    '<div class="modal-h"><h2>'+T("Client signature")+'</h2>'+
      '<button class="btn sm" data-close>'+T("Close")+'</button></div>'+
    '<div class="modal-b">'+
      '<div class="muted" style="font-size:13px;margin-bottom:10px">'+T("Hand the phone to the client and have them sign with a finger.")+'</div>'+
      '<canvas id="sigPad" class="sigpad"></canvas>'+
      '<div class="row" style="margin-top:8px">'+
        '<button class="btn sm" id="sigClear">'+T("Clear")+'</button>'+
        '<span class="muted" style="font-size:12.5px">'+T("Sign above the line")+'</span>'+
      '</div>'+
      '<label class="f" style="margin-top:12px"><span>'+T("Name of the person signing")+'</span>'+
        '<input type="text" id="sigName" value="'+esc((e.signature && e.signature.name) || e.clientName || "")+'"></label>'+
      '<div class="row" style="margin-top:14px">'+
        '<button class="btn pri" id="sigSave">'+T("Save signature")+'</button>'+
        (e.signature ? '<button class="btn danger" id="sigDel">'+T("Remove signature")+'</button>' : "")+
      '</div>'+
    '</div>',
    function(root){
      root.querySelectorAll("[data-close]").forEach(function(x){ x.onclick = closeModal; });
      var c = root.querySelector("#sigPad");
      var rect = c.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      c.width = Math.round(rect.width * dpr);
      c.height = Math.round(180 * dpr);
      c.style.height = "180px";
      var ctx = c.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = "#101a1f";
      var drawing = false, dirty = false, last = null;
      function pos(ev){
        var r = c.getBoundingClientRect();
        return { x: ev.clientX - r.left, y: ev.clientY - r.top };
      }
      c.addEventListener("pointerdown", function(ev){
        ev.preventDefault(); drawing = true; dirty = true;
        c.setPointerCapture(ev.pointerId); last = pos(ev);
      });
      c.addEventListener("pointermove", function(ev){
        if(!drawing) return;
        ev.preventDefault();
        var p = pos(ev);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
      });
      ["pointerup","pointercancel","pointerleave"].forEach(function(t){
        c.addEventListener(t, function(){ drawing = false; });
      });
      root.querySelector("#sigClear").onclick = function(){
        ctx.clearRect(0, 0, c.width, c.height); dirty = false;
      };
      root.querySelector("#sigSave").onclick = function(){
        if(!dirty){ toast(T("Nothing signed yet.")); return; }
        var url;
        try{ url = c.toDataURL("image/png"); }catch(err){ toast(T("The signature could not be saved.")); return; }
        var id = (e.signature && e.signature.id) || uid("sig");
        PhotoStore.put(id, url).then(function(){
          e.signature = { id:id, name: root.querySelector("#sigName").value || e.clientName, date: todayISO() };
          if(e.status === "Draft" || e.status === "Sent") e.status = "Accepted";
          touch(e); closeModal(); render();
          toast(T("Signature saved."));
        });
      };
      var del = root.querySelector("#sigDel");
      if(del) del.onclick = function(){ closeModal(); openRemoveSignature(e); };
    }
  );
}

/* ---------------- pre-written messages ---------------- */
function fillTemplate(txt, e, lang){
  var t = calcEstimate(e), b = DB.business;
  var map = {
    "{client}": e.clientName || "",
    "{number}": e.number || "",
    "{total}": money(t.total),
    "{deposit}": money(t.deposit),
    "{balance}": money(t.balance),
    "{valid}": fmtDate(addDaysISO(e.date, e.validDays), lang),
    "{start}": e.startDate ? fmtDate(e.startDate, lang) : "",
    "{business}": b.name, "{phone}": b.phone, "{email}": b.email,
    "{website}": b.website, "{date}": fmtDate(todayISO(), lang)
  };
  var out = String(txt || ""), k;
  for(k in map) out = out.split(k).join(map[k]);
  return out;
}
function digitsOnly(s){ return String(s||"").replace(/[^0-9]/g, ""); }
function openMessages(e, startId){
  var lang = e.docLang === "es" ? "es" : "en";
  var tpls = DB.templates || [];
  var cur = startId || (tpls[0] && tpls[0].id);
  function bodyFor(id){
    var tp = null, i;
    for(i=0;i<tpls.length;i++) if(tpls[i].id === id) tp = tpls[i];
    if(!tp) return { subject:"", body:"" };
    return {
      subject: fillTemplate(lang === "es" ? (tp.subjectEs || tp.subject) : tp.subject, e, lang),
      body:    fillTemplate(lang === "es" ? (tp.bodyEs || tp.body) : tp.body, e, lang)
    };

      '<div class="row" style="margin-top:14px">'+
        '<button class="btn pri" id="msgMail">'+T("Open email")+'</button>'+
        '<button class="btn" id="msgSms">'+T("Open SMS")+'</button>'+
        '<button class="btn" id="msgWa">'+T("WhatsApp")+'</button>'+
        '<button class="btn" id="msgCopy">'+T("Copy")+'</button>'+
      '</div>'+
      '<div class="muted" style="font-size:12px;margin-top:10px">'+T("These open your own mail or messaging app with the text already filled in — nothing is sent automatically.")+'</div>'+
    '</div>',
    function(root){
      root.querySelectorAll("[data-close]").forEach(function(x){ x.onclick = closeModal; });
      root.querySelectorAll("[data-tpl]").forEach(function(el){
        el.onclick = function(){
          cur = el.getAttribute("data-tpl");
          root.querySelectorAll("[data-tpl]").forEach(function(o){ o.classList.toggle("on", o === el); });
          var v = bodyFor(cur);
          root.querySelector("#msgSubj").value = v.subject;
          root.querySelector("#msgBody").value = v.body;
        };
      });
      function subj(){ return root.querySelector("#msgSubj").value; }
      function body(){ return root.querySelector("#msgBody").value; }
      root.querySelector("#msgMail").onclick = function(){
        window.location.href = "mailto:" + encodeURIComponent(e.email || "") +
          "?subject=" + encodeURIComponent(subj()) + "&body=" + encodeURIComponent(body());
      };
      root.querySelector("#msgSms").onclick = function(){
        window.location.href = "sms:" + digitsOnly(e.phone) + "?&body=" + encodeURIComponent(body());
      };
      root.querySelector("#msgWa").onclick = function(){
        var d = digitsOnly(e.phone);
        if(d.length === 10) d = "1" + d;
        window.open("https://wa.me/" + d + "?text=" + encodeURIComponent(body()), "_blank");
      };
      root.querySelector("#msgCopy").onclick = function(){
        var txt = body();
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){ toast(T("Copied.")); },
            function(){ toast(T("Could not copy — select the text and copy it by hand.")); });
        } else {
          var ta = root.querySelector("#msgBody");
          ta.select(); try{ document.execCommand("copy"); toast(T("Copied.")); }catch(err){ toast(T("Could not copy — select the text and copy it by hand.")); }
        }
      };
    }
  );
}

/* ---------------- lead sources + follow-ups ---------------- */
function leadReport(){
  var map = {}, order = [];
  DB.estimates.forEach(function(e){
    var src = e.leadSource || T("Not set");
    if(!map[src]){ map[src] = { src:src, jobs:0, quoted:0, won:0, wonJobs:0 }; order.push(src); }
    var t = calcEstimate(e), st = jobStatus(e);
    map[src].jobs++;
    map[src].quoted += t.total;
    if(st === "Deposit Paid" || st === "Paid in Full" || st === "Accepted"){ map[src].won += t.total; map[src].wonJobs++; }
  });
  return order.map(function(k){ return map[k]; }).sort(function(a,b){ return b.won - a.won; });
}
function leadReportHTML(){
  var rows = leadReport();
  if(!rows.length) return "";
  var max = 0;
  rows.forEach(function(r){ if(r.won > max) max = r.won; });
  var body = rows.map(function(r){
    var conv = r.jobs ? Math.round(r.wonJobs / r.jobs * 100) : 0;
    var w = max > 0 ? Math.max(2, Math.round(r.won / max * 100)) : 0;
    return '<tr>'+
      '<td class="rowtitle">'+esc(r.src)+
        '<div class="bar"><i style="width:'+w+'%"></i></div></td>'+
      '<td class="n right">'+r.jobs+'</td>'+
      '<td class="n right">'+money(r.quoted)+'</td>'+
      '<td class="n right" style="font-weight:600">'+money(r.won)+'</td>'+
      '<td class="n right">'+conv+'%</td>'+
    '</tr>';
  }).join("");
  return '<section class="card" style="margin-top:16px"><div class="card-h"><h2>'+T("Where the work comes from")+'</h2>'+
    '<div class="sp"></div><span class="muted" style="font-size:12.5px">'+T("won = accepted, deposit paid or paid in full")+'</span></div>'+
    '<div class="tablewrap"><table class="t"><thead><tr><th>'+T("Source")+'</th><th class="right">'+T("Jobs")+'</th>'+
    '<th class="right">'+T("Quoted")+'</th><th class="right">'+T("Won")+'</th><th class="right">'+T("Conversion")+'</th></tr></thead>'+
    '<tbody>'+body+'</tbody></table></div></section>';
}
function followUps(){
  var limit = num(DB.followUpDays) || 5, today = todayISO();
  return DB.estimates.filter(function(e){
    if(e.status !== "Sent") return false;
    if(invoicesFor(e.id).length) return false;
    return daysBetween(e.sentAt || e.date, today) >= limit;
  }).sort(function(a,b){
    return daysBetween(b.sentAt || b.date, today) - daysBetween(a.sentAt || a.date, today);
  });
}
function followUpsHTML(){
  var list = followUps();
  if(!list.length) return "";
  var today = todayISO();
  var rows = list.map(function(e){
    var d = daysBetween(e.sentAt || e.date, today);
    var t = calcEstimate(e);
    return '<tr>'+
      '<td class="rowtitle">'+esc(nameOf(e))+'<div class="muted" style="font-weight:400;font-size:12.5px">'+esc(e.number)+'</div></td>'+
      '<td><span class="badge '+(d>=14?"b-declined":d>=8?"b-deposit":"b-sent")+'">'+T("{0} days", d)+'</span></td>'+
      '<td class="n right">'+money(t.total)+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn sm pri" data-msg="'+esc(e.id)+'">'+T("Message")+'</button> '+
        '<button class="btn sm" data-open-est="'+esc(e.id)+'">'+T("Open")+'</button>'+
      '</td></tr>';
  }).join("");
  return '<section class="card" style="margin-top:16px" id="followCard"><div class="card-h"><h2>'+T("Needs a follow-up")+'</h2>'+
    '<div class="sp"></div><span class="muted" style="font-size:12.5px">'+T("sent {0}+ days ago, no answer", num(DB.followUpDays)||5)+'</span></div>'+
    '<div class="tablewrap"><table class="t"><thead><tr><th>'+T("Client")+'</th><th>'+T("Waiting")+'</th>'+
    '<th class="right">'+T("Total")+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}

function bindSettings(){
  bindCloud();
  bindV4Settings();
  document.querySelectorAll("[data-sf]").forEach(function(el){
    var path = el.getAttribute("data-sf"), t = el.getAttribute("data-t");
    var ev = (t === "check") ? "change" : "input";
    el.addEventListener(ev, function(){
      var v = t === "check" ? el.checked : t === "number" ? (el.value===""?0:num(el.value)) : el.value;
      setPath(DB, path, v); save();
    });
  });
  document.querySelectorAll("[data-sfl]").forEach(function(el){
    el.addEventListener("input", function(){ setPath(DB, el.getAttribute("data-sfl"), nl2list(el.value)); save(); });
  });
  document.querySelectorAll(".dsc").forEach(function(el){
    var ev = (el.type === "checkbox" || el.tagName === "SELECT") ? "change" : "input";
    el.addEventListener(ev, function(){
      var i = num(el.getAttribute("data-i")), f = el.getAttribute("data-f");
      if(!DB.discounts[i]) return;
      DB.discounts[i][f] = el.type === "checkbox" ? el.checked : (f === "value" ? num(el.value) : el.value);
      save();
    });
  });
  document.querySelectorAll(".dsc-del").forEach(function(el){
    el.onclick = function(){ DB.discounts.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var ac = document.getElementById("addCode");
  if(ac) ac.onclick = function(){
    DB.discounts.push({ code:"NEWCODE", type:"percent", value:10, label:"New discount", labelEs:"Nuevo descuento", active:true });
    save(); render();
  };
  document.querySelectorAll(".pmf").forEach(function(el){
    el.addEventListener("input", function(){
      var i = num(el.getAttribute("data-i"));
      if(!DB.payment.methods[i]) return;
      DB.payment.methods[i][el.getAttribute("data-f")] = el.value; save();
    });
  });
  document.querySelectorAll(".pm-del").forEach(function(el){
    el.onclick = function(){ DB.payment.methods.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var apm = document.getElementById("addPm");
  if(apm) apm.onclick = function(){ DB.payment.methods.push({en:"New method", es:"Nuevo método"}); save(); render(); };

  document.querySelectorAll(".svc").forEach(function(el){
    el.addEventListener("input", function(){
      var i = num(el.getAttribute("data-i")), f = el.getAttribute("data-f");
      if(!DB.services || !DB.services[i]) return;
      DB.services[i][f] = (f === "rate" || f === "sqftPerUnit") ? (el.value === "" ? 0 : num(el.value)) : el.value;
      save();
    });
  });
  document.querySelectorAll(".svc-del").forEach(function(el){
    el.onclick = function(){ DB.services.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var asv = document.getElementById("addSvc");
  if(asv) asv.onclick = function(){
    if(!DB.services) DB.services = [];
    DB.services.push({ id:uid("sv"), short:T("New service"), en:"", es:"", unit:"sq ft", unitEs:"pie\u00b2", rate:0, sqftPerUnit:1 });
    save(); render();
  };
  document.querySelectorAll(".upg").forEach(function(el){
    el.addEventListener("input", function(){
      var i = num(el.getAttribute("data-i")), f = el.getAttribute("data-f");
      if(!DB.upgrades || !DB.upgrades[i]) return;
      DB.upgrades[i][f] = (f === "qty" || f === "rate") ? (el.value === "" ? 0 : num(el.value)) : el.value;
      save();
    });
  });
  document.querySelectorAll(".upg-del").forEach(function(el){
    el.onclick = function(){ DB.upgrades.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var auc = document.getElementById("addUpgCat");
  if(auc) auc.onclick = function(){
    if(!DB.upgrades) DB.upgrades = [];
    DB.upgrades.push({ id:uid("upc"), short:T("New upgrade"), en:"", es:"", qty:1, rate:0 });
    save(); render();
  };

  document.querySelectorAll(".lsrc").forEach(function(el){
    el.addEventListener("input", function(){
      DB.leadSources[num(el.getAttribute("data-i"))] = el.value; save();
    });
  });
  document.querySelectorAll(".lsrc-del").forEach(function(el){
    el.onclick = function(){ DB.leadSources.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var asrc = document.getElementById("addSource");
  if(asrc) asrc.onclick = function(){ DB.leadSources.push(T("New source")); save(); render(); };
  document.querySelectorAll(".tplf").forEach(function(el){
    el.addEventListener("input", function(){
      var i = num(el.getAttribute("data-i"));
      if(!DB.templates[i]) return;
      DB.templates[i][el.getAttribute("data-f")] = el.value; save();
    });
  });
  document.querySelectorAll(".sup").forEach(function(el){
    var ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, function(){
      var i = num(el.getAttribute("data-i")), f = el.getAttribute("data-f");
      if(!DB.materials.supplies[i]) return;
      DB.materials.supplies[i][f] = (f === "cost" || f === "qty") ? num(el.value) : el.value;
      save();
      var sp = DB.materials.supplies[i];
      var cell = document.querySelector('.sup-line[data-i="'+i+'"]');
      if(cell){
        var basis = (sp.basis === "job" || !sp.basis) ? "item" : sp.basis;
        var q = sp.qty === undefined ? 1 : num(sp.qty);
        cell.textContent = money(q*num(sp.cost));
      }
    });
  });
  document.querySelectorAll(".sup-del").forEach(function(el){
    el.onclick = function(){ DB.materials.supplies.splice(num(el.getAttribute("data-i")),1); save(); render(); };
  });
  var asup = document.getElementById("addSupply");
  if(asup) asup.onclick = function(){
    DB.materials.supplies.push({ name:T("New supply"), qty:1, cost:0, basis:"item" }); save(); render();
  };
  var ac2 = document.getElementById("applyCov");
  if(ac2) ac2.onclick = function(){
    var c = coverageFromJobs();
    var v = c.paint || c.primer;
    if(!v){ toast(T("No job data yet.")); return; }
    DB.materials.coverageSqftPerGal = v;
    DB.materials.wastePct = 0;
    save(); render();
    toast(T("Coverage set to {0} sq ft/gal from your own jobs; waste set to 0.", v));
  };
  var lb = document.getElementById("logoBtn"), li = document.getElementById("logoInput");
  if(lb && li){
    lb.onclick = function(){ li.click(); };
    li.onchange = function(){
      var f = li.files[0];
      if(!f) return;
      var tr = document.getElementById("logoTrim");
      var doTrim = tr ? tr.checked : true;
      var rep = document.getElementById("logoReport");
      lb.disabled = true; lb.textContent = "Processing…";
      if(rep) rep.textContent = "Reading " + f.name + " (" + Math.round(f.size/1024) + " KB)…";
      prepareLogo(f, 600, doTrim).then(function(out){
        lb.disabled = false;
        li.value = "";                       /* so picking the same file again still fires */
        if(!out.url){
          lb.textContent = DB.business.logo ? "Replace logo" : "Upload logo";
          if(rep){ rep.textContent = out.report; rep.style.color = "var(--bad)"; }
          toast(out.report);
          return;
        }
        var prev = DB.business.logo;
        DB.business.logo = out.url;
        DB.business.logoCleared = false;
        if(saveNow()){
          LAST_LOGO_REPORT = out.report;
          render();
          toast(T("Logo saved."));
        } else {
          DB.business.logo = prev; render();
          toast(T("Logo too large for browser storage — try a smaller file."));
        }
      });
    };
  }
  var rep0 = document.getElementById("logoReport");
  if(rep0 && LAST_LOGO_REPORT){ rep0.textContent = LAST_LOGO_REPORT; rep0.style.color = "var(--ok)"; }
  var ld = document.getElementById("logoDel");
  if(ld) ld.onclick = function(){ DB.business.logo = ""; DB.business.logoCleared = true; saveNow(); render(); toast(T("Logo removed.")); };

  var ex = document.getElementById("expData");
  if(ex) ex.onclick = exportData;
  var ib = document.getElementById("impBtn"), ifl = document.getElementById("impFile");
  if(ib) ib.onclick = function(){ ifl.click(); };
  if(ifl) ifl.onchange = function(){ importData(ifl.files[0]); };
  var wipe = document.getElementById("wipeData");
  if(wipe) wipe.onclick = function(){
    if(!confirm(T("Erase all clients, estimates and invoices? Export a backup first — this cannot be undone."))) return;
    if(!confirm(T("Last check: erase everything?"))) return;
    var old = allPhotoIds();
    old.forEach(function(id){ PhotoStore.del(id); });
    DB = defaults(); saveNow(); go("dashboard"); toast(T("All data erased."));
  };
}
function exportData(){
  saveNow();
  var ids = allPhotoIds();
  var btn = document.getElementById("expData");
  if(btn){ btn.disabled = true; btn.textContent = "Preparing backup…"; }
  PhotoStore.dump(ids).then(function(map){
    var payload = JSON.parse(JSON.stringify(DB));
    payload.photoData = map;
    var text = JSON.stringify(payload, null, 2);
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "luma-backup-" + todayISO() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    if(btn){ btn.disabled = false; btn.textContent = "Export backup (JSON)"; }
    toast(T("Backup downloaded — {0} KB, {1} photos included.", Math.round(text.length/1024), ids.length));
  });
}
function importData(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var data = JSON.parse(r.result);
      if(!data || !data.estimates || !data.clients) throw new Error("bad file");
      if(!confirm(T("Replace everything in this browser with the backup file? Current records: {0} estimates. Backup: {1} estimates.", DB.estimates.length, data.estimates.length))) return;
      var photos = data.photoData || {};
      delete data.photoData;
      DB = deepMerge(defaults(), data);
      saveNow();
      PhotoStore.restore(photos).then(function(){
        go("dashboard");
        toast(T("Backup imported — {0} estimates, {1} photos.", DB.estimates.length, Object.keys(photos).length));
      });
    }catch(err){
      toast(T("That file is not a LUMA backup."));
    }
  };
  r.readAsText(file);
}

function docLines(e, lang){
  var p = DB.pricing, out = [];
  var withFrame = (e.frameMode || "included") === "included";
  var doorDesc = withFrame
    ? (lang==="es" ? (p.doorLabelEs||p.doorLabel) : p.doorLabel)
    : (lang==="es" ? (p.doorLabelNoFrameEs||p.doorLabelNoFrame||p.doorLabelEs) : (p.doorLabelNoFrame||p.doorLabel));
  if(num(e.doors) > 0) out.push({
    desc: doorDesc,
    sub: lang==="es" ? (e.specEs||e.spec||"") : (e.spec||""),
    qty: num(e.doors), rate: num(e.doorRate), amount: num(e.doors)*num(e.doorRate)
  });
  if(e.frameMode === "separate" && num(e.frames) > 0) out.push({
    desc: lang==="es" ? (p.frameLabelEs||p.frameLabel) : p.frameLabel,
    sub:"", qty: num(e.frames), rate: num(e.frameRate), amount: num(e.frames)*num(e.frameRate)
  });
  if(e.boxMode === "separate" && num(e.boxes) > 0) out.push({
    desc: lang==="es" ? (p.boxLabelEs||p.boxLabel) : p.boxLabel,
    sub:"", qty: num(e.boxes), rate: num(e.boxRate), amount: num(e.boxes)*num(e.boxRate)
  });
  if(num(e.drawers) > 0) out.push({
    desc: lang==="es" ? (p.drawerLabelEs||p.drawerLabel) : p.drawerLabel,
    sub:"", qty: num(e.drawers), rate: num(e.drawerRate), amount: num(e.drawers)*num(e.drawerRate)
  });
  (e.items||[]).forEach(function(it){
    if(it.hidden) return;   /* hidden from the client: the price stays in the total, the line does not show */
    var d = lang==="es" ? (it.descEs || it.desc) : it.desc;
    if(!d && !num(it.qty)) return;
    out.push({ desc: d || "\u2014", sub:"",
      qty:num(it.qty), unit: lang==="es" ? (it.unitEs || it.unit || "") : (it.unit || ""),
      rate:num(it.rate), amount:num(it.qty)*num(it.rate) });
  });
  (e.upgrades||[]).forEach(function(u){
    if(!u.included) return;
    var d = lang==="es" ? (u.descEs || u.desc) : (u.desc || u.descEs);
    if(!d && !num(u.rate)) return;
    out.push({ desc: d || "—", sub: lang==="es" ? "Mejora" : "Upgrade",
      qty:num(u.qty), rate:num(u.rate), amount:num(u.qty)*num(u.rate) });
  });
  return out;
}

function bindDoc(){
  var back = document.getElementById("docBack");
  if(back) back.onclick = function(){
    if(VIEW.back === "estimate" && VIEW.backId) go("estimate", VIEW.backId);
    else if(VIEW.back) go(VIEW.back);
    else go("estimates");
  };
  document.querySelectorAll("[data-lang]").forEach(function(el){
    el.onclick = function(){
      var lg = el.getAttribute("data-lang");
      VIEW.lang = lg;
      var v = VIEW.kind === "invoice" ? byId(DB.invoices, VIEW.id) : null;
      var e = v ? byId(DB.estimates, v.estimateId) : byId(DB.estimates, VIEW.id);
      if(e){
        e.docLang = lg;
        var c = e.clientId ? byId(DB.clients, e.clientId) : null;
        if(c) c.lang = lg;
        save();
      }
      render();
    };
  });
  var cmp = document.getElementById("cmpToggle");
  if(cmp) cmp.onchange = function(){ VIEW.compact = cmp.checked; render(); };
  var sg = document.getElementById("docSign");
  if(sg) sg.onclick = function(){
    var e = byId(DB.estimates, VIEW.id);
    if(e) openSignature(e);
  };
  var pr = document.getElementById("docPrint");
  if(pr) pr.onclick = function(){
    pr.disabled = true;
    hydratePhotos();
    imagesReady().then(function(){ pr.disabled = false; window.print(); });
  };
  var st = document.getElementById("docStatus");

var CLOUD_BACKUP_KEY = "LUMA_PRECLOUD_BACKUP";

function cloudArr(kind){
  if(kind === "tasks"){ if(!DB.tasks) DB.tasks = []; return DB.tasks; }

function parseFirebaseConfig(text){
  var out = {}, re = /["']?([A-Za-z_][A-Za-z0-9_]*)["']?\s*:\s*["']([^"']*)["']/g, m;

/* ---- loading the Firebase libraries, only when there is a config ---- */
function cloudLoadScript(src){
  return new Promise(function(res, rej){
    var el = document.createElement("script");
    el.src = src; el.async = true;
    el.onload = function(){ res(); };
    el.onerror = function(){ rej(new Error("No internet, or the Firebase library could not be loaded.")); };
    document.head.appendChild(el);
  });
}
function cloudLoadSDK(){
  if(window.firebase && window.firebase.firestore) return Promise.resolve();
  function chain(base){
    return cloudLoadScript(base+"firebase-app-compat.js")
      .then(function(){ return cloudLoadScript(base+"firebase-auth-compat.js"); })
      .then(function(){ return cloudLoadScript(base+"firebase-firestore-compat.js"); });
  }
  /* second source in case the first one is unreachable */
  return chain(CLOUD_SDK).catch(function(){ return chain(CLOUD_SDK_ALT); });
}
function cloudInit(){
  var cfg = cloudCfg();
  if(!cfg){ CLOUD.status = "off"; cloudPaint(); return Promise.resolve(); }
  CLOUD.cfg = cfg;
  CLOUD.status = "loading"; cloudPaint();
  return cloudLoadSDK().then(function(){
    if(!CLOUD.app){
      CLOUD.app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(cfg);
      CLOUD.auth = firebase.auth();
      CLOUD.fs = firebase.firestore();
      try{ CLOUD.fs.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(err){}
      CLOUD.auth.onAuthStateChanged(function(u){
        CLOUD.user = u || null;
        if(u){
          if(gateNeeded()){ gateSet(true); if(GATE.on){ GATE.on = false; render(); } }
          cloudStart();
        }
        else {
          cloudStop(); CLOUD.status = "signedout"; cloudPaint();
          if(gateNeeded()){ gateSet(false); GATE.on = true; gateShow(); }
        }
      });
    }
  }).catch(cloudFail);
}

function cloudSignOut(){

  CLOUD.auth.signOut();
  cloudStop();
  CLOUD.status = "signedout"; cloudPaint(); render();
}
function cloudStop(){
  CLOUD.unsub.forEach(function(u){ try{ u(); }catch(err){} });
  CLOUD.unsub = []; CLOUD.pulled = false; CLOUD.snap = {}; CLOUD.photoIndex = {};

/* ---- a local copy of everything, taken before the first merge ---- */
function cloudSafetyBackup(){
  try{
    if(localStorage.getItem(CLOUD_BACKUP_KEY)) return;
    if(!DB.estimates.length && !DB.clients.length) return;
    localStorage.setItem(CLOUD_BACKUP_KEY, JSON.stringify({ at:cloudNow(), db:DB }));
  }catch(err){}
}
function cloudRestoreBackup(){
  try{
    var raw = localStorage.getItem(CLOUD_BACKUP_KEY);
    if(!raw){ toast(T("There is no earlier copy saved.")); return; }
    var b = JSON.parse(raw);
    if(!b || !b.db) return;
    DB = deepMerge(defaults(), b.db);
    saveNow(true); render();
    toast(T("The copy from before the cloud is back on this device."));
  }catch(err){ toast(T("That copy could not be read.")); }
}

/* ---- records in and out ---- */
function recBody(rec){
  var c = {}, k;
  for(k in rec) if(k !== "updatedAt") c[k] = rec[k];
  return JSON.stringify(c);
}
function cloudSnapSet(kind, rec){
  if(!CLOUD.snap[kind]) CLOUD.snap[kind] = {};
  CLOUD.snap[kind][rec.id] = recBody(rec);
}
function cloudApplyDoc(kind, id, data){
  if(!data) return false;
  var arr = cloudArr(kind), i = -1, k;
  for(k = 0; k < arr.length; k++){ if(arr[k] && arr[k].id === id){ i = k; break; } }
  if(data.deleted){
    if(i >= 0){ arr.splice(i, 1); if(CLOUD.snap[kind]) delete CLOUD.snap[kind][id]; return true; }
    return false;
  }
  var rec;
  try{ rec = JSON.parse(data.json); }catch(err){ return false; }
  if(!rec || !rec.id) return false;
  /* the snapshot mirrors what the cloud holds, so a local copy that is newer
     still shows up as a change to send on the next push */
  if(!CLOUD.snap[kind]) CLOUD.snap[kind] = {};
  CLOUD.snap[kind][id] = recBody(rec);
  if(i >= 0 && String(arr[i].updatedAt || "") >= String(rec.updatedAt || data.updatedAt || "")) return false;
  rec.updatedAt = rec.updatedAt || data.updatedAt || cloudNow();
  if(i >= 0) arr[i] = rec; else arr.push(rec);
  return true;
}
function cloudSettingsBlob(){
  return {
    business:DB.business, pricing:DB.pricing, materials:DB.materials, tax:DB.tax,
    discounts:DB.discounts, terms:DB.terms, scope:DB.scope, upgrades:DB.upgrades,
    payment:DB.payment, templates:DB.templates, leadSources:DB.leadSources,
    numbering:DB.numbering, blocked:DB.blocked, followUpDays:DB.followUpDays,
    processDays:DB.processDays, defaultDocLang:DB.defaultDocLang,
    production:DB.production, jobTemplates:DB.jobTemplates, typePresets:DB.typePresets, dashCards:DB.dashCards, payZelle:DB.payZelle, payZelleName:DB.payZelleName, payLink:DB.payLink, payNote:DB.payNote, goal:DB.goal, clock:DB.clock, calToken:DB.calToken, calOn:DB.calOn, calWorker:DB.calWorker, recurring:DB.recurring, bankRules:DB.bankRules, expCats:DB.expCats, portalUrl:DB.portalUrl, reviewUrl:DB.reviewUrl,
    websiteUrl:DB.websiteUrl, instagramUrl:DB.instagramUrl, showcase:DB.showcase
  };
}
function cloudApplySettings(data){
  if(!data || !data.json) return false;
  CLOUD.snap.settings = data.json;
  if(String(DB.settingsAt || "") >= String(data.updatedAt || "")) return false;
  var blob;
  try{ blob = JSON.parse(data.json); }catch(err){ return false; }
  var mineEst = DB.numbering ? num(DB.numbering.nextEst) : 1;
  var mineInv = DB.numbering ? num(DB.numbering.nextInv) : 1;
  var k;
  for(k in blob){ if(blob[k] !== undefined && blob[k] !== null) DB[k] = blob[k]; }
  if(DB.numbering){
    DB.numbering.nextEst = Math.max(num(DB.numbering.nextEst), mineEst);
    DB.numbering.nextInv = Math.max(num(DB.numbering.nextInv), mineInv);
  }
  if(!DB.business.logo && !DB.business.logoCleared) DB.business.logo = LUMA_LOGO;
  DB.settingsAt = data.updatedAt;
  return true;
}

/* ---- first connection on a device: read everything, then send what is newer ---- */
function cloudStart(){
  if(CLOUD.unsub.length) return;
  CLOUD.status = "syncing"; CLOUD.note = ""; cloudPaint();
  cloudSafetyBackup();
  CLOUD.snap = {};
  CLOUD_SETS.forEach(function(kind){ CLOUD.snap[kind] = {}; });
  var root = cloudRoot(), jobs = [];
  CLOUD_SETS.forEach(function(kind){
    jobs.push(root.collection(kind).get().then(function(qs){
      qs.forEach(function(d){ cloudApplyDoc(kind, d.id, d.data()); });
    }));
  });
  jobs.push(root.collection("meta").doc("settings").get().then(function(d){
    if(d.exists) cloudApplySettings(d.data());
  }));
  jobs.push(root.collection("meta").doc("photos").get().then(function(d){
    if(d.exists) CLOUD.photoIndex = (d.data() || {}).ids || {};
  }));
  Promise.all(jobs).then(function(){
    CLOUD.pulled = true;
    saveNow(true);
    cloudListen();
    portalListen();
    webLeadsListen();
    return cloudPushNow();
  }).then(function(){
    CLOUD.status = "on"; CLOUD.lastSync = cloudNow();
    cloudPaint(); render();
  }).catch(cloudFail);
}
function cloudListen(){
  var root = cloudRoot();
  CLOUD_SETS.forEach(function(kind){
    CLOUD.unsub.push(root.collection(kind).onSnapshot(function(qs){
      var touched = false;
      qs.docChanges().forEach(function(ch){
        if(ch.type === "removed") return;
        if(cloudApplyDoc(kind, ch.doc.id, ch.doc.data())) touched = true;
      });
      if(touched){ saveNow(true); CLOUD.lastSync = cloudNow(); cloudPaint(); cloudRepaintSoon(); }
    }, cloudFail));
  });
  CLOUD.unsub.push(root.collection("meta").doc("settings").onSnapshot(function(d){
    if(d.exists && cloudApplySettings(d.data())){ saveNow(true); cloudPaint(); cloudRepaintSoon(); }
  }, cloudFail));
  CLOUD.unsub.push(root.collection("meta").doc("photos").onSnapshot(function(d){
    if(d.exists) CLOUD.photoIndex = (d.data() || {}).ids || {};
  }, cloudFail));
}

/* ---- sending local changes up ---- */
function cloudSchedule(){
  if(!cloudOn() || CLOUD.applying) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(function(){ cloudPushNow(); }, 1200);
}
function cloudPushNow(){
  if(!cloudOn()) return Promise.resolve();
  if(CLOUD.pushing){ CLOUD.again = true; return Promise.resolve(); }
  CLOUD.pushing = true;
  var root = cloudRoot(), now = cloudNow(), ops = [];
  CLOUD_SETS.forEach(function(kind){
    var arr = cloudArr(kind), here = {};
    if(!CLOUD.snap[kind]) CLOUD.snap[kind] = {};
    arr.forEach(function(rec){
      if(!rec || !rec.id) return;
      here[rec.id] = true;
      var body = recBody(rec), was = CLOUD.snap[kind][rec.id];
      if(was === body) return;
      if(was !== undefined || !rec.updatedAt) rec.updatedAt = now;
      CLOUD.snap[kind][rec.id] = body;
      ops.push(root.collection(kind).doc(rec.id).set({ json:JSON.stringify(rec), updatedAt:rec.updatedAt }));
    });
    Object.keys(CLOUD.snap[kind]).forEach(function(id){
      if(here[id]) return;
      delete CLOUD.snap[kind][id];
      ops.push(root.collection(kind).doc(id).set({ deleted:true, updatedAt:now }));
    });
  });
  var blob = JSON.stringify(cloudSettingsBlob());
  if(blob !== CLOUD.snap.settings){
    CLOUD.snap.settings = blob;
    DB.settingsAt = now;
    ops.push(root.collection("meta").doc("settings").set({ json:blob, updatedAt:now }));
  }
  return Promise.all(ops).then(function(){
    return cloudPushPhotos(root, now).then(portalPushAll);
  }).then(function(){
    if(ops.length){ CLOUD.lastSync = cloudNow(); cloudPaint(); }
    CLOUD.pushing = false;
    if(CLOUD.again){ CLOUD.again = false; return cloudPushNow(); }
  }).catch(function(err){ CLOUD.pushing = false; cloudFail(err); });
}
/* photos: one document each, uploaded once, never re-uploaded */
function cloudPushPhotos(root, now){
  var ids = allPhotoIds().filter(function(id){ return !CLOUD.photoIndex[id]; });
  if(!ids.length) return Promise.resolve();
  return ids.reduce(function(chain, id){
    return chain.then(function(){
      return PhotoStore.get(id).then(function(data){
        if(!data) return;
        return root.collection("photos").doc(id).set({ data:data, at:now }).then(function(){
          CLOUD.photoIndex[id] = 1;
        });
      });
    });
  }, Promise.resolve()).then(function(){
    return root.collection("meta").doc("photos").set({ ids:CLOUD.photoIndex });
  });
}
function cloudFetchPhoto(id){
  if(!cloudOn() || !id) return Promise.resolve(null);
  if(CLOUD.fetching[id]) return CLOUD.fetching[id];
  CLOUD.fetching[id] = cloudRoot().collection("photos").doc(id).get().then(function(d){
    delete CLOUD.fetching[id];
    if(!d.exists) return null;
    var data = (d.data() || {}).data;
    if(!data) return null;
    PhotoStore.put(id, data);
    return data;
  }).catch(function(){ delete CLOUD.fetching[id]; return null; });
  return CLOUD.fetching[id];
}
function cloudDeletePhoto(id){
  if(!cloudOn() || !id) return;
  delete CLOUD.photoIndex[id];
  var root = cloudRoot();
  root.collection("photos").doc(id).delete().catch(function(){});
  root.collection("meta").doc("photos").set({ ids:CLOUD.photoIndex }).catch(function(){});
}

  }
  var doors = num(e.doors), drawers = num(e.drawers);
  add(TT("Cabinet doors","Puertas de gabinete"), doors, p.doorHrs, "", "door");
  add(TT("Drawer fronts","Frentes de cajón"), drawers, p.drawerHrs, "", "drawer");
  /* frames and boxes only add their own hours when they are charged apart and counted;
     when they go inside the door price, their work is inside the hours per door */
  if(e.frameMode === "separate") add(TT("Frames","Marcos"), e.frames, p.frameHrs, "", "frame");
  if(e.boxMode === "separate") add(TT("Boxes","Cajas"), e.boxes, p.boxHrs, "", "box");

  (e.items||[]).forEach(function(it){
    var d = UI_LANG === "es" ? (it.descEs || it.desc) : (it.desc || it.descEs);

function crewCost(e, h){
  var p = prodP();
  if(p.payBy !== "piece") return r2(h.total * num(p.laborRate));
  var c = num(e.doors)*num(p.doorPay) + num(e.drawers)*num(p.drawerPay) +
          (e.frameMode === "separate" ? num(e.frames)*num(p.framePay) : 0) +
          (e.boxMode === "separate" ? num(e.boxes)*num(p.boxPay) : 0);
  /* everything that is not paid by the piece is paid by the hour */
  var other = 0;
  h.rows.forEach(function(r){ if(["door","drawer","frame","box"].indexOf(r.kind) < 0) other += r.h; });
  return r2(c + other * num(p.laborRate));

  var co = coSignedTotal(e);

  var labor = mode === "crew" ? crewCost(e, h) : 0;
  var cost = r2(labor + mat), profit = r2(revenue - cost);
  var tm = Math.min(90, Math.max(0, num(p.targetMargin))), th = num(p.targetHourly);
  var people = mode === "crew" ? Math.max(1, num(p.crewSize)) : 1;

function attachPad(c){
  var rect = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(rect.width * dpr));
  c.height = Math.round(180 * dpr);
  c.style.height = "180px";
  var ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#101a1f";
  var drawing = false, dirty = false, last = null;
  function pos(ev){ var r = c.getBoundingClientRect(); return { x:ev.clientX - r.left, y:ev.clientY - r.top }; }
  c.addEventListener("pointerdown", function(ev){ ev.preventDefault(); drawing = true; dirty = true; if(c.setPointerCapture) c.setPointerCapture(ev.pointerId); last = pos(ev); });
  c.addEventListener("pointermove", function(ev){
    if(!drawing) return;
    ev.preventDefault();
    var p = pos(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(t){ c.addEventListener(t, function(){ drawing = false; }); });
  return {
    dirty:function(){ return dirty; },
    clear:function(){ ctx.clearRect(0, 0, c.width, c.height); dirty = false; },
    /* a smaller copy so it travels fast and fits in the cloud record */
    data:function(){
      var w = Math.min(600, c.width), h = Math.round(c.height * w / c.width);
      var o = document.createElement("canvas"); o.width = w; o.height = h;
      o.getContext("2d").drawImage(c, 0, 0, w, h);
      return o.toDataURL("image/png");
    }
  };
}

var PORTAL = { mode:false, token:"", ref:null, model:null, lang:"en", langSet:false, viewed:false,

function portalTokenFromURL(){
  var m = /[#&?]p=([A-Za-z0-9]{12,})/.exec(location.hash || "") || /[?&]p=([A-Za-z0-9]{12,})/.exec(location.search || "");
  return m ? m[1] : "";
}
function newToken(){
  var a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", out = "", i;
  var arr = new Uint32Array(24);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
  else for(i = 0; i < 24; i++) arr[i] = Math.floor(Math.random() * 4294967295);
  for(i = 0; i < 24; i++) out += a.charAt(arr[i] % a.length);
  return out;
}
function portalBase(){
  var b = String(DB.portalUrl || "").trim();
  if(b && !/^https?:\/\//i.test(b)) b = "https://" + b.replace(/^\/+/, "");
  if(!b && /^https?:/.test(location.protocol)) b = location.origin + location.pathname;
  b = b.replace(/[?#].*$/, "");
  if(!/\.html?$/i.test(b) && b.slice(-1) !== "/") b += "/";
  return b;
}
function portalLink(e){
  var b = portalBase();
  return (b && e.portal && e.portal.token) ? b + "#p=" + e.portal.token : "";

/* a lighter copy of a photo for the client's phone: about 1100 px, JPEG */
function shrinkDataURL(url, maxDim, q){
  return new Promise(function(res){
    if(!url){ res(null); return; }
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ res(url); return; }
      var k = Math.min(1, maxDim / Math.max(w, h)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
      var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try{ res(c.toDataURL("image/jpeg", q)); }catch(err){ res(url); }
    };
    img.onerror = function(){ res(null); };
    img.src = url;
  });
}
function lightCopy(url){
  return shrinkDataURL(url, 1100, 0.68).then(function(u){
    /* a Firestore document holds up to 1 MB — make sure it fits */
    if(u && u.length > 850000) return shrinkDataURL(url, 800, 0.6);
    return u;
  });
}
/* keeps portal/{token}/photos in step with the photos marked for the client */
function portalSyncPhotos(e){
  if(PORTAL.mode || !cloudOn() || !e.portal || !e.portal.token) return Promise.resolve();
  var tok = e.portal.token, uid0 = CLOUD.user.uid;
  var want = e.showPhotos ? (e.photos||[]).map(function(ph){ return ph.id; }) : [];
  var have = (e.portal.ph || []).slice();
  if(e.portal.phTok !== tok) have = [];
  if(PORTAL.phBusy && PORTAL.phBusy[tok]) return PORTAL.phBusy[tok];
  var col = CLOUD.fs.collection("portal").doc(tok).collection("photos");
  var gone = have.filter(function(id){ return want.indexOf(id) < 0; });
  var add = want.filter(function(id){ return have.indexOf(id) < 0; });
  if(!gone.length && !add.length) return Promise.resolve();
  PORTAL.phBusy = PORTAL.phBusy || {};
  var done = have.filter(function(id){ return gone.indexOf(id) < 0; });
  var job = Promise.all(gone.map(function(id){ return col.doc(id).delete().catch(function(){}); }))
    .then(function(){
      return add.reduce(function(chain, id){
        return chain.then(function(){
          return PhotoStore.get(id).then(function(url){ return url || cloudFetchPhoto(id); })
            .then(lightCopy)
            .then(function(small){
              if(!small) return;
              return col.doc(id).set({ owner:uid0, data:small, at:isoNow() }).then(function(){ done.push(id); });
            }).catch(function(err){ portalErr(err); });
        });
      }, Promise.resolve());
    })
    .then(function(){
      if(e.portal && e.portal.token === tok){ e.portal.ph = done; e.portal.phTok = tok; save(); }
      delete PORTAL.phBusy[tok];
    }, function(){ delete PORTAL.phBusy[tok]; });
  PORTAL.phBusy[tok] = job;
  return job;
}

/* what the client did on their page lands on the estimate */
function portalApply(d){
  if(!d || !d.estId) return false;
  var e = byId(DB.estimates, d.estId);
  if(!e || !e.portal) return false;
  var c = d.client || {}, ch = false, news = "";
  var seen = e.portalSeen || (e.portalSeen = { views:0, picks:"{}", sign:false, co:{} });
  var views = c.views || [];
  if(views.length > num(seen.views)){
    e.portalViews = views.slice(-30); seen.views = views.length; ch = true;
    logAct(e, views.length === 1 ? TT("Opened the link","Abrió el link") : TT("Opened the link (time {0})","Abrió el link ({0}ª vez)").replace("{0}", views.length));
    news = TT("{0} opened the estimate","{0} abrió el estimado").replace("{0}", nameOf(e));
  }
  var pj = JSON.stringify(c.picks || {});
  if(pj !== (seen.picks || "{}")){
    var picks = c.picks || {}, prev = {};
    try{ prev = JSON.parse(seen.picks || "{}"); }catch(err){ prev = {}; }
    if(!e.signature){
      (e.upgrades||[]).forEach(function(u){
        if(!(u.id in picks) || prev[u.id] === picks[u.id]) return;
        if(u.included && !u.byClient) return;
        if(!!u.included === !!picks[u.id]) return;   /* nothing really changed — don't write "Removed" for something never added */
        u.included = !!picks[u.id]; u.byClient = !!picks[u.id];
        logAct(e, (picks[u.id] ? TT("Added: ","Agregó: ") : TT("Removed: ","Quitó: ")) + (UI_LANG === "es" ? (u.descEs || u.desc) : (u.desc || u.descEs)));
      });
      news = TT("{0} changed the options","{0} cambió las opciones").replace("{0}", nameOf(e));
    }
    seen.picks = pj; ch = true;
  }
  var chat = c.chat || [], had = (e.chat||[]).length;
  if(chat.length !== had){
    var fresh = 0;
    chat.slice(had).forEach(function(m){ if(m.from === "client") fresh++; });
    e.chat = chat.slice(-200); ch = true;
    if(fresh){
      e.chatUnread = num(e.chatUnread) + fresh;
      logAct(e, TT("Message: ","Mensaje: ") + "“" + String(chat[chat.length-1].text || "").slice(0, 60) + "”");
      news = TT("New message from {0}","Mensaje nuevo de {0}").replace("{0}", nameOf(e));
    }
  }
  /* only the exact signature that was removed is ignored — never compare clocks of two different devices */
  if(c.sign && c.sign.img && !seen.sign && !(seen.clearedSig && String(c.sign.at || "") === seen.clearedSig)){
    seen.sign = true; ch = true;
    if(!e.signature){
      var sid = "sig-link-" + e.id;
      PhotoStore.put(sid, c.sign.img).then(function(){ cloudSchedule(); render(); });
      e.signature = { id:sid, name:c.sign.name || e.clientName, date:String(c.sign.at || isoNow()).slice(0, 10), via:"link", at:c.sign.at || "" };
      if(e.status === "Draft" || e.status === "Sent") e.status = "Accepted";
      logAct(e, TT("Signed and accepted from the link ({0})","Firmó y aceptó desde el link ({0})").replace("{0}", money(calcEstimate(e).total)));
      news = TT("{0} signed the estimate!","¡{0} firmó el estimado!").replace("{0}", nameOf(e));
    }
  }
  var cos = c.coSign || {};
  Object.keys(cos).forEach(function(id){
    if(!seen.co) seen.co = {};
    if(seen.co[id]) return;
    seen.co[id] = 1; ch = true;
    var co = null;
    (e.changeOrders||[]).forEach(function(x){ if(x.id === id) co = x; });
    if(co && co.status !== "signed" && cos[id] && cos[id].img){
      signChangeOrder(e, co, cos[id].img, cos[id].name || e.clientName, "link");
      news = TT("{0} approved a change order","{0} aprobó una orden de cambio").replace("{0}", nameOf(e));
    }
  });
  if(c.paid && c.paid.at && seen.paid !== c.paid.at){
    seen.paid = c.paid.at; ch = true; e.payClaim = { method:c.paid.method || "", at:c.paid.at };
    logAct(e, TT("Client says the deposit was sent ({0})","El cliente dice que envió el depósito ({0})").replace("{0}", c.paid.method || ""));
    news = TT("{0} says the deposit was sent","{0} dice que envió el depósito").replace("{0}", nameOf(e));
  }
  if(ch){ touch(e); if(news) toast(news); }
  return ch;
}

function bindV4Editor(){
  var e = currentEstimate();
  if(!e) return;
  var el;
  if(num(e.chatUnread)){ e.chatUnread = 0; save(); }
  if((el = document.getElementById("v4Wo"))) el.onclick = function(){ go("workorder", e.id); };
  if((el = document.getElementById("v4SigDel"))) el.onclick = function(){ openRemoveSignature(e); };
  if((el = document.getElementById("v4Tpl"))) el.onclick = function(){ saveAsTemplate(e); };
  /* ticking "include" by hand makes it your decision, not the client's */
  document.querySelectorAll('.up-f[data-f="included"]').forEach(function(cb){
    cb.addEventListener("change", function(){ var u = (e.upgrades||[])[num(cb.getAttribute("data-i"))]; if(u) u.byClient = false; save(); });
  });
  var hb = document.getElementById("v4HoursBox");
  if(hb) hb.addEventListener("change", function(ev){
    var f = ev.target.getAttribute("data-v4ef"), li = ev.target.getAttribute("data-v4item");
    if(li !== null){
      var it = (e.items||[])[num(li)];
      if(it) it.hrs = ev.target.value === "" ? "" : num(ev.target.value);
    } else if(f === "laborMode") e.laborMode = ev.target.value;
    else if(f) e[f] = num(ev.target.value);
    else return;
    touch(e); hb.innerHTML = hoursCardHTML(e);
    var sm = document.getElementById("v4Sum"); if(sm) sm.innerHTML = v4SumInner(e);
  });

  /* change orders */
  document.querySelectorAll("[data-co]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var co = (e.changeOrders||[])[num(inp.getAttribute("data-co"))], f = inp.getAttribute("data-f");
      if(!co) return;
      co[f] = (f === "amount" || f === "hours") ? num(inp.value) : inp.value;
      touch(e);
    });
  });
  if((el = document.getElementById("coAdd"))) el.onclick = function(){
    if(!e.changeOrders) e.changeOrders = [];
    var n = 1;
    e.changeOrders.forEach(function(c){ if(num(c.n) >= n) n = num(c.n) + 1; });
    e.changeOrders.push({ id:uid("co"), n:n, desc:"", descEs:"", amount:0, hours:0, status:"pending", createdAt:isoNow() });
    logAct(e, TT("Change order #{0} created","Cambio #{0} creado").replace("{0}", n));
    touch(e); render();
    var ins = document.querySelectorAll('[data-co][data-f="desc"]');
    if(ins.length) ins[ins.length-1].focus();
  };
  document.querySelectorAll("[data-co-sign]").forEach(function(b){
    b.onclick = function(){
      var co = e.changeOrders[num(b.getAttribute("data-co-sign"))];
      if(!co) return;
      if(!(num(co.amount) > 0) || !String(co.desc || co.descEs || "").trim()){ toast(TT("Write what will be done and the price first.","Primero escribe qué se va a hacer y el precio.")); return; }
      openPadModal(TT("Client signature — change #","Firma del cliente — cambio #") + co.n,
        esc(UI_LANG === "es" ? (co.descEs || co.desc) : (co.desc || co.descEs)) + ' — <b>' + money(co.amount) + '</b>',
        e.clientName, padLabels(), function(url, name){
          signChangeOrder(e, co, url, name, "here").then(function(){ render(); toast(TT("Change signed. Its invoice is ready.","Cambio firmado. Su factura ya está lista.")); });
        });
    };
  });
  document.querySelectorAll("[data-co-send]").forEach(function(b){
    b.onclick = function(){
      var co = e.changeOrders[num(b.getAttribute("data-co-send"))];
      if(!co) return;
      if(!(num(co.amount) > 0)){ toast(TT("Put the price first.","Primero pon el precio.")); return; }
      window.open("https://wa.me/" + waNumber(e.phone) + "?text=" + encodeURIComponent(coMessage(e, co)), "_blank");
      logAct(e, TT("Change #{0} sent for approval","Cambio #{0} mandado para aprobar").replace("{0}", co.n)); touch(e);
    };
  });
  document.querySelectorAll("[data-co-del]").forEach(function(b){
    b.onclick = function(){
      if(!confirm(TT("Delete this change order?","¿Borrar esta orden de cambio?"))) return;
      e.changeOrders.splice(num(b.getAttribute("data-co-del")), 1);
      touch(e); render();
    };
  });

  /* payment stages */
  if((el = document.getElementById("ppOn"))) el.onchange = function(){
    e.payPlanOn = this.checked;
    if(this.checked && !(e.payPlan && e.payPlan.length >= 2)) e.payPlan = defaultPlan();
    touch(e); render();
  };
  document.querySelectorAll("[data-pp]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var s = e.payPlan[num(inp.getAttribute("data-pp"))], f = inp.getAttribute("data-f");
      if(!s) return;
      s[f] = f === "pct" ? num(inp.value) : inp.value;
      touch(e); recalc();
    });
    if(inp.getAttribute("data-f") === "pct") inp.addEventListener("change", function(){ render(); });
  });
  document.querySelectorAll("[data-pp-del]").forEach(function(b){
    b.onclick = function(){
      e.payPlan.splice(num(b.getAttribute("data-pp-del")), 1);
      if(e.payPlan.length < 2) e.payPlanOn = false;
      touch(e); render();
    };
  });
  if((el = document.getElementById("ppAdd"))) el.onclick = function(){ e.payPlan.push({ label:"Payment", labelEs:"Pago", pct:0 }); touch(e); render(); };
  document.querySelectorAll("[data-pp-preset]").forEach(function(b){
    b.onclick = function(){
      var p = b.getAttribute("data-pp-preset").split(",").map(num), base = defaultPlan();
      e.payPlan = p.map(function(x, i){
        var nm = i === 0 ? base[0] : i === p.length-1 ? base[2] : base[1];
        return { label:nm.label, labelEs:nm.labelEs, pct:x };
      });
      touch(e); render();
    };
  });

  /* client link */
  if((el = document.getElementById("v4Pub"))) el.onclick = function(){ portalPublish(e); };
  if((el = document.getElementById("v4Send"))) el.onclick = function(){ if(portalLink(e)) openSendLink(e); else go("settings"); };
  if((el = document.getElementById("v4Unpub"))) el.onclick = function(){ portalRemove(e); };
  if((el = document.getElementById("v4Prev"))) el.onclick = function(){ openPortalPreview(e); };
  if((el = document.getElementById("v4ActClear"))) el.onclick = function(){
    if(!confirm(TT("Clear the activity of this estimate? The estimate, the link, the chat and the signature stay as they are.","¿Limpiar la actividad de este estimado? El estimado, el link, el chat y la firma se quedan igual."))) return;
    e.activity = []; touch(e); render();
    toast(TT("Activity cleared","Actividad limpia"));
  };
  var rp = document.getElementById("v4Reply"), rb = document.getElementById("v4ReplyBtn");
  function sendReply(){ portalReply(e, rp.value); rp.value = ""; }
  if(rb) rb.onclick = sendReply;
  if(rp) rp.onkeydown = function(ev){ if(ev.key === "Enter") sendReply(); };
  var ms = document.getElementById("v4Msgs");
  if(ms) ms.scrollTop = ms.scrollHeight;
}

var PIPE = [
  { k:"lead",         en:"Leads",        es:"Leads",           bg:"#e9e5da", fg:"#101a1f" },
  { k:"Draft",        en:"Draft",        es:"Borrador",        bg:"#d5ded9", fg:"#101a1f" },
  { k:"Sent",         en:"Sent",         es:"Enviado",         bg:"#a9bfb4", fg:"#101a1f" },
  { k:"Accepted",     en:"Accepted",     es:"Aceptado",        bg:"#6b9080", fg:"#ffffff" },
  { k:"Deposit Paid", en:"Deposit paid", es:"Depósito pagado", bg:"#43604f", fg:"#ffffff" },
  { k:"Paid in Full", en:"Paid in full", es:"Pagado completo", bg:"#1d2822", fg:"#ffffff" },
  { k:"Declined",     en:"Declined",     es:"Rechazado",       bg:"#d9ccc4", fg:"#101a1f" }
];
function leadClients(){
  return DB.clients.filter(function(c){
    return !c.archived && !DB.estimates.some(function(e){ return e.clientId === c.id; });
  });
}
function pipeCardHTML(e){
  var st = jobStatus(e), t = calcEstimate(e), today = todayISO();
  var ref = st === "Sent" ? (e.sentAt || e.date) : String(e.updatedAt || "").slice(0, 10) || e.date;
  var days = daysBetween(ref, today), chips = [];
  if(e.portal && e.portal.token) chips.push((e.portalViews||[]).length
    ? '<span class="v4-chip ok">'+TT("Viewed {0}×","Visto {0}×").replace("{0}", (e.portalViews||[]).length)+'</span>'
    : '<span class="v4-chip">'+TT("Link not opened","Link sin abrir")+'</span>');
  if(e.signature) chips.push('<span class="v4-chip ok">'+TT("Signed","Firmado")+'</span>');
  if(num(e.chatUnread)) chips.push('<span class="v4-chip bad">'+TT("New message","Mensaje nuevo")+'</span>');
  if((e.changeOrders||[]).some(function(c){ return c.status !== "signed"; })) chips.push('<span class="v4-chip warn">'+TT("Change pending","Cambio pendiente")+'</span>');
  var order = ["Draft","Sent","Accepted"], i = order.indexOf(st), mv = "";
  if(i >= 0) mv = '<div class="v4-mv">'+
    (i > 0 ? '<button data-pipe-mv="'+esc(e.id)+'|'+order[i-1]+'" title="'+esc(TT("Move back","Mover atrás"))+'">‹</button>' : '')+
    '<button data-pipe-mv="'+esc(e.id)+'|Declined" title="'+esc(TT("Mark declined","Marcar rechazado"))+'">✕</button>'+
    (i < 2 ? '<button data-pipe-mv="'+esc(e.id)+'|'+order[i+1]+'" title="'+esc(TT("Move forward","Mover adelante"))+'">›</button>' : '')+'</div>';
  if(st === "Declined") mv = '<div class="v4-mv"><button data-pipe-mv="'+esc(e.id)+'|Sent" style="width:auto;padding:0 8px">'+TT("Reopen","Reabrir")+'</button></div>';
  return '<div class="v4-card" data-open-est="'+esc(e.id)+'">'+
    '<div class="v4-card-t"><b>'+esc(nameOf(e))+'</b><span class="num">'+money(t.total)+'</span></div>'+
    '<div class="muted v4-card-s">'+esc(e.number)+(e.leadSource ? ', '+esc(e.leadSource) : '')+', '+TT("{0} d","{0} d").replace("{0}", days)+'</div>'+
    (chips.length ? '<div class="v4-chips">'+chips.join("")+'</div>' : '')+mv+'</div>';

function leadCardHTML(c){

    '<div class="v4-card-t"><b>'+esc(c.name || T("Unnamed client"))+'</b><span class="muted" style="font-size:12px">'+TT("{0} d","{0} d").replace("{0}", d)+'</span></div>'+
    '<div class="muted v4-card-s">'+esc([c.phone, c.source].filter(function(x){ return x; }).join(", ") || "—")+'</div>'+

      ((c.photos||[]).length ? ' · 📷 '+(c.photos||[]).length : '')+'</div>'+
      (c.web.details ? '<div class="muted" style="font-size:12px;margin-top:3px;line-height:1.4">'+esc(leadSummary(c.web.details).join(" · "))+'</div>' : '')+
      (c.web.message ? '<div class="muted" style="font-size:12px;margin-top:3px;line-height:1.35">'+esc(String(c.web.message).slice(0, 140))+(String(c.web.message).length > 140 ? '…' : '')+'</div>' : '') : '')+

      '<button class="btn sm" data-lead-drop="'+esc(c.id)+'" title="'+esc(TT("Not interested","No le interesa"))+'">✕</button></div></div>';

function viewPipeline(){
  var byCol = {};
  PIPE.forEach(function(p){ byCol[p.k] = []; });
  DB.estimates.forEach(function(e){ var st = jobStatus(e); (byCol[st] || byCol.Draft).push(e); });
  var cols = PIPE.map(function(p){
    var cards, n, val = 0;
    if(p.k === "lead"){
      var ls = leadClients();
      n = ls.length;
      cards = ls.map(leadCardHTML).join("");
    } else {
      var es = byCol[p.k].sort(function(a, b){ return String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")); });
      n = es.length;
      es.forEach(function(e){ val += calcEstimate(e).total; });
      cards = es.map(pipeCardHTML).join("");
    }
    return '<div class="v4-col"><div class="v4-chipH" style="background:'+p.bg+';color:'+p.fg+'"><b>'+(UI_LANG === "es" ? p.es : p.en)+'</b>'+
      '<span>'+n+(val ? ' · '+money(val) : '')+'</span></div>'+
      '<div class="v4-cards">'+(cards || '<div class="muted" style="font-size:12.5px;padding:4px">'+TT("Empty","Vacío")+'</div>')+'</div></div>';
  }).join("");
  return '<div class="page-h"><div><h1>'+TT("Pipeline","Embudo de ventas")+'</h1>'+
    '<div class="sub">'+TT("Every job in its stage. When the client signs on the link, it moves to Accepted by itself.","Cada trabajo en su etapa. Cuando el cliente firma en el link, pasa solo a Aceptado.")+'</div></div>'+
    '<div class="sp"></div>'+
    (archivedLeads().length ? '<button class="btn" id="lostLeads">'+TT("Removed leads ({0})","Leads quitados ({0})").replace("{0}", archivedLeads().length)+'</button>' : '')+
    '<button class="btn pri" id="addLead">'+TT("+ New lead","+ Lead nuevo")+'</button></div>'+
    '<div class="v4-board">'+cols+'</div>';
}
function bindPipeline(){
  var el;
  document.querySelectorAll("[data-pipe-mv]").forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var p = b.getAttribute("data-pipe-mv").split("|"), e = byId(DB.estimates, p[0]);
      if(!e) return;
      e.status = p[1];
      if(p[1] === "Sent" && !e.sentAt) e.sentAt = todayISO();
      logAct(e, TT("Moved to {0}","Movido a {0}").replace("{0}", T(p[1])));
      touch(e); render();
    };
  });
  document.querySelectorAll("[data-lead-est]").forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var id = b.getAttribute("data-lead-est");
      openTemplatePicker(id);
    };
  });
  document.querySelectorAll("[data-lead-drop]").forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var c = byId(DB.clients, b.getAttribute("data-lead-drop"));
      if(!c || !confirm(TT("Take {0} off the pipeline? The client stays saved.","¿Quitar a {0} del embudo? El cliente queda guardado.").replace("{0}", c.name))) return;
      c.archived = true; c.archivedAt = isoNow(); c.updatedAt = new Date().toISOString(); save(); render();
      toast(TT("Removed. You can put it back from “Removed leads”.","Quitado. Lo puedes regresar desde “Leads quitados”."));
    };
  });
  if((el = document.getElementById("addLead"))) el.onclick = openLeadModal;
  if((el = document.getElementById("lostLeads"))) el.onclick = openRemovedLeads;
}
/* leads taken off the pipeline with ✕ — they can always come back */
function archivedLeads(){
  return DB.clients.filter(function(c){ return c.archived && !DB.estimates.some(function(e){ return e.clientId === c.id; }); })
    .sort(function(a, b){ return String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")); });
