/* ================= TradeWorks design system (v7 · light) ================= */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F7F8FA;
  --ink:#0B0D12; --ink-2:#4B5263; --ink-3:#9097A3;
  --line:#ECEEF2; --line-2:#F3F4F6;
  --acc:#1E6BFF; --acc-soft:#EAF1FF; --acc-ink:#1550C9;
  --ok:#12B76A; --bad:#F04438; --warn:#F79009;
  --r:16px; --shadow:none;
  --blue-grad:linear-gradient(180deg,#2F74FF 0%,#8FB3FF 100%);
  --hatch:repeating-linear-gradient(135deg,#E4E7EC 0 6px,#F2F4F7 6px 12px);
}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
/* client pages keep the business look */
.pt{--acc:#EF6A2C;--acc-soft:#FDEEE6;--acc-ink:#C2501B}
/* ---------- sidebar: white, calm, black active item ---------- */
.v4-sb{background:#fff !important;border-right:1px solid var(--line) !important;color:var(--ink-2)}
.v4-sb .v4-sb-top{padding:20px 18px 14px;gap:10px;cursor:pointer}
.v4-sb .tw-mark{width:34px;height:34px;flex:none;border-radius:9px}
.v4-sb .v4-sb-top b{color:var(--ink);font-size:18px;letter-spacing:-.02em;font-weight:700}
.v4-sb .v4-sb-top span{color:var(--ink-3);font-size:12px}
.tw-ws{display:flex;align-items:center;gap:9px;margin:0 14px 10px;padding:9px 11px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;min-width:0;cursor:pointer}
.tw-ws img{width:24px;height:24px;object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--line);padding:2px;flex:none}
.tw-ws span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-sb .v4-sb-new{background:var(--ink) !important;border-color:var(--ink) !important;color:#fff !important;border-radius:12px;height:42px;font-weight:600;margin:2px 14px 8px;width:calc(100% - 28px);box-shadow:0 1px 2px rgba(11,13,18,.15)}
.v4-sb .v4-sb-new:hover{background:#262A33 !important}
.v4-sb-lbl{color:var(--ink-3) !important;font-size:11px !important;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:16px 24px 6px !important}
.v4-sb-nav button{color:var(--ink-2) !important;border-radius:10px !important;margin:1px 12px;width:calc(100% - 24px) !important;padding:9px 12px !important;font-weight:500;background:none;position:relative}
.v4-sb-nav button .ico{color:var(--ink-3)}
.v4-sb-nav button:hover{background:var(--surface-2) !important;color:var(--ink) !important}
.v4-sb-nav button.on{background:linear-gradient(180deg,#1C1F26 0%,#0B0D12 100%) !important;color:#fff !important;font-weight:600;box-shadow:0 2px 6px rgba(11,13,18,.18)}
.v4-sb-nav button.on .ico{color:#fff}
.v4-sb-nav button em{background:var(--acc) !important;color:#fff !important;border-radius:999px;font-weight:600}
.v4-sb-nav button.on em{background:#fff !important;color:var(--ink) !important}
.v4-sb-foot{border-top:1px solid var(--line) !important}
.v4-sb-me b{color:var(--ink) !important}.v4-sb-me span{color:var(--ink-3) !important}
.v4-sb .v4-av{background:var(--surface-2) !important;color:var(--ink) !important;border:1px solid var(--line)}
/* ---------- mobile bars ---------- */
.v4-mtop{background:#fff !important;border-bottom:1px solid var(--line) !important}
.v4-mtop .tw-mark{width:28px;height:28px;border-radius:8px}
.v4-mtop b{font-weight:700;letter-spacing:-.02em;font-size:16px}
.v4-bnav{background:#fff !important;border-top:1px solid var(--line) !important}
.v4-bnav button{color:var(--ink-3) !important}
.v4-bnav button.on{color:var(--ink) !important}
.v4-bnav button.on .ico{color:var(--acc)}
.v4-bnav button em{background:var(--acc) !important}
/* ---------- page ---------- */
.page-h h1,.page-h > div > h1{font-size:24px;font-weight:600;letter-spacing:-.025em}
.page-h .sub{color:var(--ink-3)}
/* ---------- buttons (black primary, white secondary) ---------- */
.btn{border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:#E0E3E8}
.btn .ico{color:var(--ink-2)}
.btn.pri,.btn.v4-cta,.v4-cta{background:var(--ink) !important;border-color:var(--ink) !important;color:#fff !important;font-weight:600}
.btn.pri .ico,.btn.v4-cta .ico{color:#fff}
.btn.pri:hover,.btn.v4-cta:hover{background:#262A33 !important}
.btn.danger{color:var(--bad);border-color:#FEE4E2;background:#fff}
.btn.danger:hover{background:#FEF3F2}
.btn.wa{background:#12B76A;border-color:#12B76A;color:#fff}
/* ---------- cards & tiles ---------- */
.card,.kcard,.gl-card,.tile{border-radius:var(--r) !important;border:1px solid var(--line) !important;box-shadow:none !important;background:#fff}
.card-h{border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tile .k,.kh span:first-child{font-size:13.5px;font-weight:500;color:var(--ink)}
.tile .v{font-size:28px;font-weight:600;letter-spacing:-.03em}
.tile .m{color:var(--ink-3)}
.kv{font-weight:600;letter-spacing:-.03em;font-size:30px}
.kd{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.kd .dp{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
.kd .dp.up{background:#ECFDF3;color:#067647}.kd .dp.down{background:#FEF3F2;color:#B42318}
.kd.up,.kd.down{color:var(--ink-3)}
.kic{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;flex:none;margin-right:8px}
.kic svg{width:17px;height:17px}
.kic.c-blue{background:#EAF1FF;color:#1E6BFF}.kic.c-green{background:#ECFDF3;color:#12B76A}.kic.c-purple{background:#F4F0FF;color:#7A5AF8}
.kic.c-pink{background:#FDF2FA;color:#DD2590}.kic.c-orange{background:#FFF4ED;color:#EF6820}.kic.c-red{background:#FEF3F2;color:#F04438}
.kic.c-teal{background:#EFFCF9;color:#0E9384}.kic.c-amber{background:#FFFAEB;color:#DC6803}
.kh{align-items:center}
.kh .kt{display:flex;align-items:center;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink)}
/* ---------- tables ---------- */
table.t thead th{background:var(--surface-2);color:var(--ink-3);font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;border-bottom:1px solid var(--line)}
table.t tbody tr:hover{background:#FAFBFC}
table.t td{border-bottom:1px solid var(--line-2)}
/* ---------- forms ---------- */
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],select,textarea{border:1px solid var(--line) !important;border-radius:10px !important;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.03)}
input:focus,select:focus,textarea:focus{border-color:#9DBBFF !important;box-shadow:0 0 0 4px rgba(30,107,255,.12) !important;outline:none}
select.kp{border:1px solid var(--line) !important;border-radius:8px !important;box-shadow:none !important;background-color:#fff !important;padding:4px 24px 4px 9px !important;color:var(--ink-2) !important;font-size:12.5px;font-weight:500}
/* ---------- pills & segmented tabs ---------- */
.pill{border-radius:999px;border:1px solid var(--line);font-weight:500;color:var(--ink);background:#fff}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.v4-subtabs{display:flex;gap:4px;border-bottom:0 !important;background:#EDEFF2;border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.v4-subtabs button{font-weight:500;color:var(--ink-2);border-radius:9px;padding:7px 14px;box-shadow:none !important;border:0 !important;white-space:nowrap}
.v4-subtabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1) !important}
.badge{border-radius:999px;font-weight:600}
/* ---------- charts: hatched gray + blue highlight, dashed grid ---------- */
.ins-bars,.gl-bar{background-image:repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), #E9ECF1 calc(25% - 1px), #E9ECF1 25%);background-size:100% 100%}
.ins-bars{gap:4px !important}
.ins-bars i{border-radius:8px 8px 3px 3px !important;max-width:22px !important}
.ins-bars i.q,.ins-legend i.q{background:var(--hatch) !important}
.ins-bars i.w,.ins-legend i.w,.ins-bars i.inc{background:var(--blue-grad) !important}
.ins-bars i.exp{background:linear-gradient(180deg,#0B0D12 0%,#5B6170 100%) !important}
.ins-legend i{border-radius:999px !important}
.ins-col.cur span{color:var(--ink);font-weight:700}
.gl-bar i{border-radius:10px 10px 4px 4px !important;width:56% !important;max-width:30px !important}
.gl-owe .gl-bar i{background:repeating-linear-gradient(135deg,#FDA29B 0 6px,#FECDCA 6px 12px) !important}
.gl-owe .gl-col:first-child .gl-bar i{background:linear-gradient(180deg,#F04438 0%,#FDA29B 100%) !important}
.gl-ahead .gl-bar i{background:var(--hatch) !important}
.gl-ahead .gl-col:first-child .gl-bar i{background:var(--blue-grad) !important}
.ins-track,.hbar{border-radius:999px;background:#EEF0F4;height:10px}
.ins-track i{background:var(--acc) !important;border-radius:999px}
.ins-track i.best{background:var(--ink) !important}
.hbar i{border-radius:999px}
.hbar.split i:first-child{border-radius:999px 0 0 999px}
.spark polyline{stroke:var(--acc) !important}
.aj .bars .t{border-radius:999px;border:0;background:#EEF0F4}
.aj .bars .t i{border-radius:999px}
/* ---------- modals ---------- */
.modal-card{border-radius:18px !important;box-shadow:0 24px 48px -12px rgba(16,24,40,.22) !important}
/* powered-by line on client-facing pages */
.tw-pow{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#9097A3;margin-top:14px}
.tw-pow .tw-mark{width:14px;height:14px}
.gl-card,.kcard{min-width:0;overflow:hidden}
.gl-cols{min-width:0}
.kh{flex-wrap:wrap;row-gap:6px}
@media (max-width:640px){ .tile .v{font-size:22px} .kv{font-size:24px} }
/* line charts */
.lc{position:relative;display:grid;grid-template-columns:44px 1fr;grid-template-rows:var(--lch) auto auto;column-gap:8px;margin-top:10px}
.lc-y{position:relative;grid-row:1}
.lc-y span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-plot{position:relative;grid-row:1;grid-column:2;cursor:crosshair;touch-action:pan-y}
.lc-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc-g{stroke:#E4E7EC;stroke-width:1;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.lc-band{position:absolute;top:0;bottom:0;width:22px;margin-left:-11px;border-radius:8px;background:linear-gradient(180deg,rgba(30,107,255,.14),rgba(30,107,255,0));opacity:0;pointer-events:none;transition:left .12s ease}
.lc-dots i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 1px 4px rgba(16,24,40,.25);pointer-events:none;transition:left .12s ease,top .12s ease}
.lc-tip{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 6px 18px rgba(16,24,40,.12);font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;display:grid;gap:2px;transition:left .12s ease,top .12s ease;z-index:2}
.lc-tip b{font-size:11.5px;color:var(--ink-3);font-weight:500}
.lc-tip span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.lc-tip span i{width:8px;height:8px;border-radius:50%}
.lc-tip em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.lc-x{position:relative;grid-column:2;height:22px}
.lc-x span{position:absolute;top:6px;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.lc-leg{grid-column:2;display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.lc-leg i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
@media (max-width:640px){ .lc{grid-template-columns:36px 1fr} .lc-x span:nth-child(even){display:none} }
/* list card (still to collect) */
.gl-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
@media (max-width:900px){ .gl-main{grid-template-columns:1fr} }
.gl-head{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.gl-head .kv{font-size:30px}
.owe-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
.owe{box-sizing:border-box;min-width:0;max-width:100%;overflow:hidden;display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.owe:hover{background:var(--surface-2)}
.owe .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.owe .nm{flex:1 1 auto;min-width:0}
.owe .nm > span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owe .amt{flex:none}
.owe .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owe .nm span{font-size:12px;color:var(--ink-3)}
.owe .amt{font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.owe .chev{color:var(--ink-3)}
.dep-chip{font-style:normal;display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:#EAF1FF;color:#1550C9;margin-left:4px}

/* ---------- spacing scale (4 · 8 · 12 · 16 · 24 · 32) ---------- */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
.wrap{padding:var(--s6) var(--s6) 96px !important}
.page-h{margin-bottom:var(--s5) !important;gap:var(--s3)}
.card + .card,.card + section,section.card{margin-top:var(--s4)}
.card-h{padding:var(--s4) var(--s5) !important;min-height:56px}
.card-b{padding:var(--s5) !important}
.tiles{gap:var(--s4) !important}
.kgrid,.gl-main,.gl-4{gap:var(--s4) !important}
.kcard,.gl-card{padding:var(--s5) !important}
.tile{padding:var(--s4) var(--s5) !important}
.v4-subtabs{margin-bottom:var(--s5) !important}
table.t th,table.t td{padding:var(--s3) var(--s4) !important}
.toolbar{gap:var(--s3);margin-bottom:var(--s4)}
@media (max-width:760px){ .wrap{padding:var(--s4) var(--s4) 110px !important} .card-h{padding:var(--s3) var(--s4) !important} .card-b,.kcard,.gl-card{padding:var(--s4) !important} .tile{padding:var(--s3) var(--s4) !important} }
/* ---------- estimates as cards on phones ---------- */
.est-cards{display:none}
@media (max-width:640px){
  .est-table{display:none}
  .est-cards{display:grid;gap:var(--s2);padding:var(--s3)}
}
.ec{display:grid;grid-template-columns:1fr auto;gap:4px var(--s3);align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:var(--s3) var(--s4);font:inherit;color:inherit;cursor:pointer}
.ec:active{background:var(--surface-2)}
.ec b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec .amt{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.ec .meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec .st{justify-self:end}
/* ---------- empty states ---------- */
.es{text-align:center;padding:48px 24px}
.es-ic{width:56px;height:56px;border-radius:16px;background:var(--acc-soft);color:var(--acc);display:inline-grid;place-items:center;margin-bottom:var(--s4)}
.es-ic svg{width:26px;height:26px}
.es h3{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.es p{margin:0 auto;max-width:380px;color:var(--ink-3);font-size:14px;line-height:1.5}
.es-b{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap;margin-top:var(--s5)}
.welcome{display:flex;align-items:center;gap:var(--s5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);margin-bottom:var(--s4)}
.welcome h3{margin:0 0 4px;font-size:17px}.welcome p{margin:0;color:var(--ink-3);font-size:14px}
.welcome .es-b{margin:0 0 0 auto}
@media (max-width:640px){ .welcome{flex-direction:column;align-items:flex-start} .welcome .es-b{margin:0} }
/* ---------- first-time setup ---------- */
.onb{position:fixed;inset:0;z-index:200;background:rgba(11,13,18,.45);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.onb-card{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:20px;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);color:var(--ink)}
.onb-dots{display:flex;gap:6px;margin-bottom:22px}.onb-dots i{height:4px;flex:1;border-radius:4px;background:var(--line)}.onb-dots i.on{background:var(--ink)}
.onb-body h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.onb-body p.muted{margin:0 0 18px}
.onb-hero{text-align:center;padding:10px 0}
.onb-hero .tw-mark{width:64px;height:64px;border-radius:16px;margin-bottom:14px}
.onb-hero p{color:var(--ink-3);max-width:400px;margin:0 auto 14px;line-height:1.5}
.onb-ok{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#ECFDF3;color:#12B76A;font-size:30px;margin-bottom:12px}
.onb-foot{display:flex;flex-direction:row-reverse;gap:8px;margin-top:24px}
.onb-foot .onb-go{flex:1}
.onb-skip{position:absolute;top:22px;right:22px;border:0;background:none;color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer}
.onb-logo{display:flex;gap:14px;align-items:flex-end}
.onb-lg{width:72px;height:72px;border-radius:16px;border:1.5px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;background:var(--surface-2);color:var(--ink-3);font-size:12.5px;font-weight:600}
.onb-lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.onb-trades{display:grid;gap:8px}
.onb-tr{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
.onb-tr i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font-size:12px}
.onb-tr.on{border-color:var(--ink)}.onb-tr.on i{background:var(--ink);border-color:var(--ink);color:#fff}
/* ---------- dark theme ---------- */
html.tw-dark{--bg:#0B0D12;--surface:#14171E;--surface-2:#1A1E27;--ink:#F2F4F7;--ink-2:#C3C8D1;--ink-3:#7F8795;--line:#252B36;--line-2:#1C212A;--acc:#4C8DFF;--acc-soft:#16233F;--acc-ink:#8DB4FF;
  --hatch:repeating-linear-gradient(135deg,#2A303B 0 6px,#20252E 6px 12px)}

html.tw-dark .v4-sb .v4-sb-new,html.tw-dark .btn.pri,html.tw-dark .btn.v4-cta,html.tw-dark .v4-cta{background:#F2F4F7 !important;border-color:#F2F4F7 !important;color:#0B0D12 !important}

html.tw-dark .card,html.tw-dark .kcard,html.tw-dark .gl-card,html.tw-dark .tile,html.tw-dark .modal-card,html.tw-dark .owe,html.tw-dark .kl,html.tw-dark .welcome{background:var(--surface) !important;border-color:var(--line) !important;color:var(--ink)}

html.tw-dark .btn:hover{background:#222734}
html.tw-dark input[type=text],html.tw-dark input[type=number],html.tw-dark input[type=email],html.tw-dark input[type=password],html.tw-dark input[type=tel],html.tw-dark input[type=date],html.tw-dark input[type=time],html.tw-dark select,html.tw-dark textarea{background:var(--surface-2) !important;color:var(--ink) !important;border-color:var(--line) !important;color-scheme:dark}
html.tw-dark table.t thead th{background:var(--surface-2)}
html.tw-dark table.t tbody tr:hover{background:#1A1F29}
html.tw-dark .pill{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
html.tw-dark .pill.on{background:#F2F4F7;color:#0B0D12;border-color:#F2F4F7}
html.tw-dark .v4-subtabs{background:#1A1E27}
html.tw-dark .v4-subtabs button.on{background:#2A303C;color:var(--ink)}
html.tw-dark .lc-tip{background:#1A1E27;border-color:var(--line)}
html.tw-dark .lc-g{stroke:#262C37}
html.tw-dark .lc-dots i{background:#14171E}
html.tw-dark .ins-track,html.tw-dark .hbar,html.tw-dark .aj .bars .t{background:#232833}
html.tw-dark .tw-ws{background:#1A1E27;border-color:var(--line);color:var(--ink)}
html.tw-dark .muted{color:var(--ink-3)}
html.tw-dark .sheet,html.tw-dark .sheet *{color-scheme:light}
html.tw-dark .onb-card{background:var(--surface)}
.onb-foot{flex-wrap:wrap}
@media (max-width:520px){ .onb-foot{flex-direction:column} .onb-foot .btn{width:100%} .onb-card{padding:22px} }
html.tw-dark .kic{background:rgba(255,255,255,.06) !important}
html.tw-dark .v4-lsw{background:var(--surface-2) !important;border-color:var(--line) !important}

html.tw-dark .v4-lsw button.on{background:#F2F4F7 !important;color:#0B0D12 !important}
html.tw-dark .cloudchip{background:var(--surface-2) !important;border-color:var(--line) !important;color:var(--ink-2) !important}

.pt-pay{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pt-pay h3{margin:0 0 10px;font-size:16px}
.pt-amt{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface-2,#f7f7f5);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pt-amt b{font-size:22px}
.pt-pm{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.pt-pm b{display:block}.pt-pm span{font-size:13px;color:var(--ink-2)}
.pt-card{display:flex;justify-content:center;width:100%;margin-bottom:6px}
.pt-sent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.pt-paid{color:#12805C;font-weight:600}
.jd-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.jd-list{display:grid;gap:4px}
.jd-day{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 2px}
.jd-it{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.jd-it input{width:18px;height:18px;accent-color:#12B76A}
.jd-it.on span{text-decoration:line-through;color:var(--ink-3)}
.jd-it em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-3)}
.jd-it span{flex:1;min-width:0;line-height:1.4}
.jd-x{border:0;background:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:0 4px}
.jd-day span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-2)}
.jd-add{display:flex;gap:6px;margin-top:4px}
.jd-add input{flex:1;min-width:0;font-size:13px !important;padding:7px 10px !important}
.jd-col input{min-width:90px}
pre.shop{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.7;background:var(--surface-2);border-radius:12px;padding:14px;margin:0}
.clk{color:#12B76A;font-weight:600;font-size:12.5px}
.cp-av{width:52px;height:52px;border-radius:50%;background:#EAF1FF;color:#1E6BFF;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.cp-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cp-ph img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--line-2)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.goal-t{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.goal-t .btn{margin-left:auto}

function T(s, a, b, c, d){
  var out = (UI_LANG === "es" && ES[s]) ? ES[s] : s;
  if(a !== undefined) out = out.split("{0}").join(a);
  if(b !== undefined) out = out.split("{1}").join(b);
  if(c !== undefined) out = out.split("{2}").join(c);
  if(d !== undefined) out = out.split("{3}").join(d);
  return out;
}
/* walk the rendered app and swap the interface strings.
   The client document keeps its own language, so .sheet is skipped,
   and so is anything the user typed (inputs, textareas). */
function translateUI(root){
  if(UI_LANG !== "es" || !root) return;
  /* an <option> without a value uses its text as its value — freeze the value first */
  root.querySelectorAll("option").forEach(function(o){
    if(!o.hasAttribute("value")) o.setAttribute("value", o.textContent);
  });
  var skip = { TEXTAREA:1, INPUT:1, SCRIPT:1, STYLE:1 };
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      var p = n.parentNode;
      if(!p || skip[p.nodeName]) return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest(".sheet")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [], n;
  while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var raw = node.nodeValue, key = raw.trim();
    if(!key || key.length > 400) return;
    var hit = ES[key];
    if(hit) node.nodeValue = raw.replace(key, hit);
  });
  root.querySelectorAll("[placeholder]").forEach(function(el){
    var k = el.getAttribute("placeholder");
    if(ES[k]) el.setAttribute("placeholder", ES[k]);
  });
  root.querySelectorAll("[title]").forEach(function(el){
    var k = el.getAttribute("title");
    if(ES[k]) el.setAttribute("title", ES[k]);
  });
}

var KEY = "LUMA_DATA_V1";
var DB = null;
var saveTimer = null;

function deepMerge(base, over){
  if(over === null || over === undefined) return base;
  if(Array.isArray(base)) return Array.isArray(over) ? over : base;
  if(typeof base === "object" && typeof over === "object"){
    var out = {}, k;
    for(k in base) out[k] = base[k];
    for(k in over){
      out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
    }
    return out;
  }
  return over === undefined ? base : over;
}
/* --- 2.2 — scope, terms and notes are three separate blocks now.
   Records written before that keep one combined list, so split it once:
   payment / warranty / validity lines become terms, the rest stays scope. --- */
function isTermLine(s){
  return /warrant|garant|\b\d{1,3}\s*%|dep[o\u00f3]sito|day 1|valid|vigen|quoted|cotiza/i.test(String(s));
}
function splitBullets(list){
  var scope = [], terms = [];
  (list||[]).forEach(function(x){ if(String(x).trim()) (isTermLine(x) ? terms : scope).push(x); });
  return { scope:scope, terms:terms };
}
function splitScopeFromTerms(db){
  var d = defaults();
  if(!db.scope) db.scope = { en:[], es:[] };
  ["en","es"].forEach(function(L){
    var s = splitBullets((db.terms && db.terms[L]) ? db.terms[L] : []);
    db.scope[L] = s.scope.length ? s.scope : d.scope[L].slice();
    var t = s.terms.slice();
    d.terms[L].forEach(function(line){ if(t.indexOf(line) < 0) t.push(line); });
    db.terms[L] = t;
  });
  (db.estimates||[]).forEach(function(e){
    if(!e.upgrades) e.upgrades = [];
    if(e.scopeEn !== undefined || e.scopeEs !== undefined) return;
    var a = splitBullets(nl2list(e.termsEn||""));
    var b = splitBullets(nl2list(e.termsEs||""));
    e.scopeEn = (a.scope.length ? a.scope : db.scope.en).join("\n");
    e.scopeEs = (b.scope.length ? b.scope : db.scope.es).join("\n");
    e.termsEn = (a.terms.length ? a.terms : db.terms.en).join("\n");
    e.termsEs = (b.terms.length ? b.terms : db.terms.es).join("\n");
  });
}
/* =================================================================
   DATA STORE — the app's data lives in the browser's small store
   (localStorage, ~5 MB) until it grows past ~3.5 MB; then it moves by
   itself to the large store (IndexedDB, hundreds of MB or more).
   The copy is written first and checked before the small one is cleared,
   and the cloud keeps its own full copy the whole time.
   ================================================================= */
var DATA_WHERE_KEY = "LUMA_DATA_WHERE", DATA_MOVE_AT = 3500000, DATA_SMALL_MAX = 5000000, DATA_SIZE = 0;
var DataStore = (function(){
  var dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if(!window.indexedDB){ rej(new Error("no indexedDB")); return; }
      var r = indexedDB.open("luma-data", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    dbp.catch(function(){ dbp = null; });
    return dbp;
  }
  function get(k){
    return open().then(function(db){ return new Promise(function(res){
      var q = db.transaction("kv", "readonly").objectStore("kv").get(k);
      q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); };
    }); }).catch(function(){ return null; });
  }
  function put(k, v){
    return open().then(function(db){ return new Promise(function(res){
      var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k);
      tx.oncomplete = function(){ res(true); }; tx.onerror = function(){ res(false); }; tx.onabort = function(){ res(false); };
    }); }).catch(function(){ return false; });
  }
  return { get:get, put:put };
})();
function dataWhere(){ try{ return localStorage.getItem(DATA_WHERE_KEY) === "idb" ? "idb" : "local"; }catch(e){ return "local"; } }
/* move to the large store: write there, read it back, and only then clear the small copy */
function moveToLargeStore(json, quiet){
  json = json || JSON.stringify(DB);
  return DataStore.put(KEY, json).then(function(ok){
    if(!ok) return false;
    return DataStore.get(KEY).then(function(back){
      if(back !== json) return false;
      try{ localStorage.setItem("LUMA_DATA_BACKUP_BEFORE_MOVE_AT", new Date().toISOString()); localStorage.removeItem(KEY); localStorage.setItem(DATA_WHERE_KEY, "idb"); }catch(e){}
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
      if(!quiet) toast(TT("Your data now lives in the large storage — plenty of room to grow.","Tus datos ahora viven en el almacenamiento grande — hay espacio de sobra."));
      return true;
    });
  });
}
function persistNow(){
  var json = JSON.stringify(DB);
  DATA_SIZE = json.length;
  DataStore.put(KEY, json);                         /* the large store always keeps a copy */
  if(dataWhere() === "idb") return true;
  if(json.length > DATA_MOVE_AT){ moveToLargeStore(json); return true; }
  try{ localStorage.setItem(KEY, json); return true; }
  catch(e){
    moveToLargeStore(json).then(function(ok){ if(!ok) toast(T("Could not save — browser storage is full or blocked.")); });
    return false;
  }
}
function loadFrom(raw){
  if(!raw) return defaults();
  try{
    var parsed = JSON.parse(raw);
    var needsSplit = !(parsed && parsed.scope && parsed.scope.en);
    var merged = deepMerge(defaults(), parsed);
    if(needsSplit) splitScopeFromTerms(merged);
    /* records saved before the logo shipped carry an empty one — fill it in,
       unless the logo was deliberately removed */
    if(!merged.business.logo && !merged.business.logoCleared) merged.business.logo = LUMA_LOGO;
    return merged;
  }catch(e){
    return defaults();
  }
}
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ raw = null; }
  if(raw) DATA_SIZE = raw.length;
  return loadFrom(raw);
}
function portalPage(){ return typeof PORTAL !== "undefined" && PORTAL && PORTAL.mode; }
function save(){
  if(portalPage()) return;   /* a client's link page must never touch the saved data on this device */
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 120);
  cloudSchedule();
}
function saveNow(quiet){
  if(portalPage()) return true;
  clearTimeout(saveTimer);
  if(!quiet) cloudSchedule();
  return persistNow();
}

/* ---------------- photo store ----------------
   Photos live in IndexedDB (room for hundreds), with a localStorage
   fallback if IndexedDB is blocked. Only ids are kept in the main record. */
var PhotoStore = (function(){
  var dbp = null, useIDB = !!window.indexedDB, mem = {};
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      try{
        var r = indexedDB.open("LUMA_PHOTOS", 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore("photos"); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      }catch(err){ rej(err); }
    });
    return dbp;
  }
  function tx(mode){
    return open().then(function(db){ return db.transaction("photos", mode).objectStore("photos"); });
  }
  function req(r){
    return new Promise(function(res, rej){
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function fbGet(){ 
    try{ return JSON.parse(localStorage.getItem("LUMA_PHOTOS_FB") || "{}"); }catch(e){ return {}; }
  }
  function fbSet(o){ localStorage.setItem("LUMA_PHOTOS_FB", JSON.stringify(o)); }
  return {
    put: function(id, dataUrl){
      if(!useIDB){ var o = fbGet(); o[id] = dataUrl; fbSet(o); return Promise.resolve(); }
      return tx("readwrite").then(function(st){ return req(st.put(dataUrl, id)); })
        .catch(function(){ useIDB = false; var o = fbGet(); o[id] = dataUrl; fbSet(o); });
    },
    get: function(id){
      if(mem[id]) return Promise.resolve(mem[id]);
      if(!useIDB) return Promise.resolve(fbGet()[id] || null);
      return tx("readonly").then(function(st){ return req(st.get(id)); })
        .then(function(v){ if(v) mem[id] = v; return v || null; })
        .catch(function(){ return fbGet()[id] || null; });
    },
    del: function(id){
      delete mem[id];
      if(!useIDB){ var o = fbGet(); delete o[id]; fbSet(o); return Promise.resolve(); }
      return tx("readwrite").then(function(st){ return req(st.delete(id)); }).catch(function(){});
    },
    /* every id referenced by a record, as {id: dataUrl} — used by the backup */
    dump: function(ids){
      var out = {};
      return ids.reduce(function(chain, id){
        return chain.then(function(){
          return PhotoStore.get(id).then(function(v){ if(v) out[id] = v; });
        });
      }, Promise.resolve()).then(function(){ return out; });
    },
    restore: function(map){
      var ids = Object.keys(map || {});
      return ids.reduce(function(chain, id){
        return chain.then(function(){ return PhotoStore.put(id, map[id]); });
      }, Promise.resolve());
    },
    prune: function(keep){
      if(!useIDB) return Promise.resolve();
      return tx("readwrite").then(function(st){
        return req(st.getAllKeys()).then(function(keys){
          keys.forEach(function(k){ if(keep.indexOf(k) < 0) st.delete(k); });
        });
      }).catch(function(){});
    }
  };
})();
function allPhotoIds(){
  var ids = [];
  DB.estimates.forEach(function(e){ (e.photos||[]).forEach(function(ph){ ids.push(ph.id); }); });
  DB.clients.forEach(function(c){ (c.photos||[]).forEach(function(ph){ ids.push(ph.id); }); });
  (DB.expenses || []).forEach(function(x){ if(x.receiptId && !x.deleted) ids.push(x.receiptId); });
  return ids;
}
/* shrink a phone photo to something a browser can hold happily.
   alpha:true keeps a transparent background (PNG out) — used for the logo. */
function resizeImage(file, maxDim, quality, alpha){
  return new Promise(function(res){
    if(!file || !/^image\//.test(file.type)) { res(null); return; }
    var reader = new FileReader();
    reader.onload = function(){
      /* SVG has no fixed pixel size — keep the original, it scales on its own */
      if(file.type === "image/svg+xml"){ res(reader.result); return; }
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ res(reader.result); return; }
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        var ctx = c.getContext("2d");
        if(!alpha){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cw,ch); }
        ctx.drawImage(img, 0, 0, cw, ch);
        try{
          if(alpha){
            var png = c.toDataURL("image/png");
            /* a very large PNG would crowd browser storage — flatten it instead */
            if(png.length > 900000){
              ctx.globalCompositeOperation = "destination-over";
              ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cw,ch);
              res(c.toDataURL("image/jpeg", 0.9));
            } else res(png);
          } else {
            res(c.toDataURL("image/jpeg", quality));
          }
        }catch(err){ res(null); }
      };
      img.onerror = function(){ res(null); };
      img.src = reader.result;
    };
    reader.onerror = function(){ res(null); };
    reader.readAsDataURL(file);
  });
}
/* Prepare an uploaded logo. Looks at the border pixels to decide what the
   background actually is, knocks out a white one, trims the empty margin,
   then scales so the longest side is maxDim. Resolves
   {url, report} so the UI can say exactly what happened. */
function prepareLogo(file, maxDim, trim){
  return new Promise(function(res){
    var fail = function(msg){ res({ url:null, report:msg }); };
    if(!file){ fail("No file chosen."); return; }
    if(!/^image\//.test(file.type)){ fail("That file is not an image (" + (file.type || "unknown type") + ")."); return; }
    var reader = new FileReader();
    reader.onload = function(){
      if(file.type === "image/svg+xml"){
        res({ url:reader.result, report:"SVG kept as-is — it scales to any size." });
        return;
      }
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ fail("The image reported no size — try exporting it again as PNG."); return; }
        var ow = w, oh = h;
        var pre = Math.min(1, 1600 / Math.max(w, h));
        var pw = Math.max(1, Math.round(w*pre)), ph = Math.max(1, Math.round(h*pre));
        var c = document.createElement("canvas");
        c.width = pw; c.height = ph;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, pw, ph);

        var dat;
        try{ dat = ctx.getImageData(0, 0, pw, ph); }
        catch(err){ fail("The browser blocked reading this image."); return; }
        var d = dat.data, i, r, g, b, a, mn, al, x, y;
        var note = "";

        /* what is the background? look at the border ring */
        var clear = 0, white = 0, seen = 0, sr = 0, sg = 0, sb = 0;
        function sample(px, py){
          var k = (py*pw + px)*4;
          seen++;
          if(d[k+3] < 40){ clear++; return; }
          sr += d[k]; sg += d[k+1]; sb += d[k+2];
          if(Math.min(d[k], Math.min(d[k+1], d[k+2])) > 232) white++;
        }
        for(x = 0; x < pw; x += Math.max(1, Math.floor(pw/220))){ sample(x, 0); sample(x, ph-1); }
        for(y = 0; y < ph; y += Math.max(1, Math.floor(ph/220))){ sample(0, y); sample(pw-1, y); }
        var pctClear = clear/seen, pctWhite = white/seen;
        var opaqueCount = seen - clear;
        var bg = opaqueCount ? [Math.round(sr/opaqueCount), Math.round(sg/opaqueCount), Math.round(sb/opaqueCount)] : [255,255,255];
        var mode = pctClear > 0.6 ? "clear" : (pctWhite > 0.6 ? "white" : "solid");

        if(trim && mode === "white"){
          /* undo the white background: white -> clear, ink -> opaque,
             antialiased edges keep their partial alpha */
          for(i = 0; i < d.length; i += 4){
            r = d[i]; g = d[i+1]; b = d[i+2];
            mn = Math.min(r, Math.min(g, b));
            al = 1 - mn/255;
            if(al < 0.025){ d[i+3] = 0; continue; }
            d[i]   = Math.max(0, Math.min(255, Math.round((r - 255*(1-al))/al)));
            d[i+1] = Math.max(0, Math.min(255, Math.round((g - 255*(1-al))/al)));
            d[i+2] = Math.max(0, Math.min(255, Math.round((b - 255*(1-al))/al)));
            d[i+3] = Math.round(al*255);
          }
          ctx.putImageData(dat, 0, 0);
          note = "white background removed";
        } else if(trim && mode === "clear"){
          note = "already transparent";
        } else if(trim){
          note = "background kept (it is not white)";
        } else {
          note = "left exactly as uploaded";
        }

        /* trim: by transparency when we have it, otherwise by difference from the background colour */
        if(trim){
          var byAlpha = (mode === "white" || mode === "clear");
          var x0 = pw, y0 = ph, x1 = -1, y1 = -1, k, keep;
          for(y = 0; y < ph; y++){
            for(x = 0; x < pw; x++){
              k = (y*pw + x)*4;
              if(byAlpha){ keep = d[k+3] > 8; }
              else {
                keep = d[k+3] > 8 && (Math.abs(d[k]-bg[0]) + Math.abs(d[k+1]-bg[1]) + Math.abs(d[k+2]-bg[2]) > 40);
              }
              if(keep){
                if(x < x0) x0 = x;
                if(x > x1) x1 = x;
                if(y < y0) y0 = y;
                if(y > y1) y1 = y;
              }
            }
          }
          if(x1 < x0 || y1 < y0){ fail("This image looks blank after processing — try unticking the trim box."); return; }
          var padPx = Math.round(Math.max(x1-x0, y1-y0) * 0.03);
          x0 = Math.max(0, x0 - padPx); y0 = Math.max(0, y0 - padPx);
          x1 = Math.min(pw-1, x1 + padPx); y1 = Math.min(ph-1, y1 + padPx);
          var cw = x1 - x0 + 1, chh = y1 - y0 + 1;
          if(cw < pw - 2 || chh < ph - 2){
            var cut = document.createElement("canvas");
            cut.width = cw; cut.height = chh;
            cut.getContext("2d").drawImage(c, x0, y0, cw, chh, 0, 0, cw, chh);
            c = cut; pw = cw; ph = chh;
            note += ", margin trimmed";
          }
        }

        var sc = Math.min(1, maxDim / Math.max(pw, ph));
        var fw = Math.max(1, Math.round(pw*sc)), fh = Math.max(1, Math.round(ph*sc));
        var out = document.createElement("canvas");
        out.width = fw; out.height = fh;
        var octx = out.getContext("2d");
        octx.imageSmoothingQuality = "high";
        octx.drawImage(c, 0, 0, fw, fh);
        var url;
        try{ url = out.toDataURL("image/png"); }
        catch(err){ fail("The browser could not export the processed logo."); return; }
        res({
          url: url,
          report: ow + " × " + oh + " → " + fw + " × " + fh + " · " + note + " · " + Math.round(url.length/1024) + " KB"
        });
      };
      img.onerror = function(){ fail("The browser could not decode this file. Save it as PNG or JPG and try again."); };
      img.src = reader.result;
    };
    reader.onerror = function(){ fail("The file could not be read."); };
    reader.readAsDataURL(file);
  });
}
/* fill every <img data-photo="id"> on the page from the store */
function hydratePhotos(){
  document.querySelectorAll("img[data-photo]").forEach(function(img){
    if(img.getAttribute("data-loaded")) return;

    });

function imagesReady(){

  return Promise.all(imgs.map(function(im){
    if(im.complete && im.naturalWidth) return Promise.resolve();
    return new Promise(function(res){
      var done = function(){ res(); };
      im.addEventListener("load", done, {once:true});
      im.addEventListener("error", done, {once:true});
      setTimeout(done, 2500);
    });

}

/* ---------------- helpers ---------------- */
function uid(p){ return (p||"id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function money(n){
  var v = Math.round(num(n)*100)/100;
  var s = Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (v<0?"-$":"$") + s;
}
function pad(n, w){ var s = String(Math.max(0, Math.floor(num(n)))); while(s.length<w) s = "0"+s; return s; }
function esc(s){
  return String(s===null||s===undefined?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayISO(){
  var d = new Date(), m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}
function addDaysISO(iso, days){
  var p = String(iso||todayISO()).split("-");
  var d = new Date(num(p[0]), num(p[1])-1, num(p[2]));
  d.setDate(d.getDate() + num(days));
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}
var MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MON_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(iso, lang){

  if(p.length!==3) return iso;
  var y=num(p[0]), m=num(p[1])-1, d=num(p[2]);

/* ---------------- newer version waiting? ---------------- */
var UPD = { last:0, found:"" };
function updateBar(){
  var b = document.getElementById("updbar");
  if(b) return b;
  b = document.createElement("div");
  b.id = "updbar";
  document.body.appendChild(b);
  return b;
}
function showUpdate(v){
  if(UPD.found === v) return;
  UPD.found = v;

  b.innerHTML = '<span>'+esc(T("New version {0} is ready.", v))+'</span><span class="sp"></span>'+
    '<button class="ghost" id="updLater">'+esc(T("Later"))+'</button>'+

  document.getElementById("updGo").onclick = function(){ applyUpdate(); };

function applyUpdate(){
  var reload = function(){ location.reload(); };
  try{
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }).then(reload, reload);
      setTimeout(reload, 2500);
      return;
    }
  }catch(err){}
  reload();
}
function checkForUpdate(){
  if(PORTAL.mode) return;
  if(!/^https?:/.test(location.protocol)) return;
  var now = Date.now();
  if(now - UPD.last < 300000) return;   /* at most once every 5 minutes */
  UPD.last = now;
  var url = location.pathname + (location.pathname.slice(-1) === "/" ? "index.html" : "") + "?v=" + now;
  fetch(url, { cache:"no-store" }).then(function(r){
    return r.ok ? r.text() : "";
  }).then(function(txt){
    var m = /APP_VERSION\s*=\s*"([^"]+)"/.exec(txt || "");
    if(m && m[1] && m[1] !== APP_VERSION) showUpdate(m[1]);
  }).catch(function(){});
}
function byId(arr, id){
  for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i];
  return null;
}
var NL_ABBR = /(?:\b(?:sq|ft|in|ea|approx|aprox|no|nos|vs|etc|est|inc|corp|co|ltd|mr|mrs|ms|dr|jr|sr|st|rd|ave|apt|ste|pkg|qty|max|min|hr|hrs|lb|lbs|oz|gal|gals|yd|yds|yr|yrs|am|pm|ref|dept|sra|srta|av|ud|uds|pag|num|art)\.|(?:^|\s)[A-Za-z]\.)$/i;
function nlNextOk(c){ return /[A-Z\u00C0-\u00D6\u00D8-\u00DE\u00BF\u00A1"'(\u201C\u2018\u2022\u2013\u2014\-#0-9]/.test(c); }
function nlSentences(line){
  var out = [], start = 0, i = 0, n = line.length;
  while(i < n){
    var c = line.charAt(i);
    if(c === "." || c === "!" || c === "?"){
      var j = i;
      while(j + 1 < n && ".!?".indexOf(line.charAt(j+1)) >= 0) j++;
      var k = j + 1;
      while(k < n && ")]}\"'\u201D\u2019".indexOf(line.charAt(k)) >= 0) k++;
      var w = k;
      while(w < n && /\s/.test(line.charAt(w))) w++;
      if(w > k && w < n && nlNextOk(line.charAt(w))){
        var chunk = line.slice(start, k).replace(/\s+$/, "");
        var marker = /^[(\[]?\d{1,3}[.)\]]$/.test(chunk.replace(/^[\s\u2022\-\u2013\u2014*]+/, ""));
        if(!marker && !NL_ABBR.test(chunk)){
          var t = chunk.trim();
          if(t) out.push(t);
          start = w; i = w; continue;
        }
      }
      i = k; continue;
    }
    i++;
  }
  var last = line.slice(start).trim();
  if(last) out.push(last);
  return out;
}
function nl2list(s){
  var out = [];
  String(s||"").split("\n").forEach(function(line){
    line = String(line).replace(/^[\s\u2022\u00B7*\u2013\u2014]+/, "").replace(/^-\s+/, "").trim();
    if(!line) return;
    nlSentences(line).forEach(function(p){ if(p) out.push(p); });
  });
  return out;
}

/* scope lines that are titles, not bullets: "Day 1 — Setup", "OUR 5-DAY PROCESS", or a line ending in ":" */
var SCOPE_DAY_RE = /^(day|d[ií]a)\s*(\d+)\s*[\u2014\u2013:\-.]*\s*(.*)$/i;
function isScopeHead(x){
  x = String(x||"").trim();
  if(!x || x.length > 70) return false;
  if(/:$/.test(x)) return true;
  if(/[.!?]$/.test(x)) return false;
  if(SCOPE_DAY_RE.test(x)) return true;
  var letters = x.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g, "");
  return letters.length >= 4 && letters === letters.toUpperCase();
}
/* groups the list under its titles: [{ head, day, title, items }] */
function scopeGroups(list){
  var out = [], cur = null;
  (list||[]).forEach(function(x){
    if(isScopeHead(x)){
      var m = SCOPE_DAY_RE.exec(String(x).trim());
      cur = { head:String(x).replace(/:$/, ""), day: m ? m[2] : "", title: m ? (m[3] || x) : String(x).replace(/:$/, ""), items:[] };
      out.push(cur);
    } else {
      if(!cur){ cur = { head:"", day:"", title:"", items:[] }; out.push(cur); }
      cur.items.push(x);
    }
  });
  return out;
}
/* printed document: titles as full-width bold rows, the rest as bullets */
function scopeDocLis(list){
  return (list||[]).map(function(x){
    return isScopeHead(x) ? '<li class="scope-h">'+esc(String(x).replace(/:$/, ""))+'</li>' : '<li>'+esc(x)+'</li>';
  }).join("");
}
/* client link: each "Day N" becomes a numbered step with its bullets; other titles are plain headings */
function scopePortalHTML(list){
  var g = scopeGroups(list);
  if(!g.some(function(x){ return x.head; })) return '<ul class="pt-ul">'+list.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul>';
  return '<div class="pt-scope">'+g.map(function(x){
    var ul = x.items.length ? '<ul class="pt-ul">'+x.items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join("")+'</ul>' : '';
    if(x.day) return '<div class="pt-day"><span class="pt-day-n">'+esc(x.day)+'</span><div class="pt-day-b"><div class="pt-day-t">'+esc(x.title)+'</div>'+ul+'</div></div>';
    return (x.head ? '<div class="pt-scope-h">'+esc(x.head)+'</div>' : '')+ul;
  }).join("")+'</div>';
}

/* ---------------- app state ---------------- */
var VIEW = { name:"dashboard", id:null, lang:"en", kind:null };
var FILTERS = { estQ:"", estStatus:"all", invQ:"", invStatus:"all", cliQ:"" };

DB = load();
UI_LANG = DB.uiLang === "es" ? "es" : "en";

/* ---------------- money math ---------------- */
/* the cash / Zelle discount lives as a normal code, so its % can be changed in Settings like any other */
function cashCode(){ return (DB.discounts||[]).filter(function(d){ return String(d.code).toUpperCase() === "CASH3"; })[0] || null; }
function cashPct(){ var c = cashCode(); return c ? num(c.value) : 3; }
function ensureCashCode(){
  if(!DB.discounts) DB.discounts = [];
  var c = cashCode();
  if(!c) DB.discounts.push({ code:"CASH3", type:"percent", value:3, label:"Cash / Zelle payment discount", labelEs:"Descuento por pago en efectivo o Zelle", active:true });
  else if(c.active === false) c.active = true;
}
function findDiscount(code){
  if(!code) return null;
  var c = String(code).trim().toUpperCase();
  if(!c) return null;
  for(var i=0;i<DB.discounts.length;i++){
    var d = DB.discounts[i];
    if(String(d.code).trim().toUpperCase() === c && d.active !== false) return d;
  }
  return null;
}
function calcEstimate(e){
  var lines = [];
  if(num(e.doors) > 0) lines.push({ kind:"door", qty:num(e.doors), rate:num(e.doorRate), amount:num(e.doors)*num(e.doorRate) });
  if(num(e.drawers) > 0) lines.push({ kind:"drawer", qty:num(e.drawers), rate:num(e.drawerRate), amount:num(e.drawers)*num(e.drawerRate) });
  /* frames: inside the door price, charged apart, or not painted at all */
  if(e.frameMode === "separate" && num(e.frames) > 0)
    lines.push({ kind:"frame", qty:num(e.frames), rate:num(e.frameRate), amount:num(e.frames)*num(e.frameRate) });
  if(e.boxMode === "separate" && num(e.boxes) > 0)
    lines.push({ kind:"box", qty:num(e.boxes), rate:num(e.boxRate), amount:num(e.boxes)*num(e.boxRate) });
  var items = e.items || [];
  for(var i=0;i<items.length;i++){
    var it = items[i];
    lines.push({ kind:"custom", item:it, qty:num(it.qty), rate:num(it.rate), amount:num(it.qty)*num(it.rate) });
  }
  /* upgrades: the ones marked "included" are priced into the job,
     the rest are quoted at the bottom of the document as add-ons */
  var ups = e.upgrades || [], optional = [], optionalTotal = 0;
  for(var u=0;u<ups.length;u++){
    var up = ups[u], upAmt = num(up.qty)*num(up.rate);
    if(up.included) lines.push({ kind:"upgrade", item:up, qty:num(up.qty), rate:num(up.rate), amount:upAmt });
    else if(up.desc || up.descEs){ optional.push(up); optionalTotal += upAmt; }
  }
  optionalTotal = Math.round(optionalTotal*100)/100;

  /* materials the client asked to see, itemised. "included" only shows
     what is already inside the prices; "added" bills them on top. */
  var matRows = e.showMaterials ? (e.materialsList || []) : [];
  var materialsTotal = 0;
  for(var mi=0; mi<matRows.length; mi++) materialsTotal += num(matRows[mi].qty)*num(matRows[mi].rate);
  materialsTotal = Math.round(materialsTotal*100)/100;
  var materialsAdded = (e.showMaterials && e.materialsMode === "added") ? materialsTotal : 0;

  var workSubtotal = 0;
  for(var j=0;j<lines.length;j++) workSubtotal += lines[j].amount;
  workSubtotal = Math.round(workSubtotal*100)/100;
  var subtotal = Math.round((workSubtotal + materialsAdded)*100)/100;

  var discAmt = 0, discLabel = "", discLabelEs = "";
  if(e.discountMode === "code"){
    var d = findDiscount(e.discountCode);
    if(d){
      discAmt = d.type === "fixed" ? num(d.value) : subtotal * num(d.value)/100;
      discLabel = (d.label || "Discount") + " (" + (d.type==="fixed" ? money(d.value) : num(d.value)+"%") + ")";
      discLabelEs = (d.labelEs || d.label || "Descuento") + " (" + (d.type==="fixed" ? money(d.value) : num(d.value)+"%") + ")";
    }
  } else if(e.discountMode === "manual"){
    if(e.manualType === "fixed"){
      discAmt = num(e.manualValue);
      discLabel = (e.manualLabel || "Discount");
      discLabelEs = (e.manualLabelEs || e.manualLabel || "Descuento");
    } else {
      discAmt = subtotal * num(e.manualValue)/100;
      discLabel = (e.manualLabel || "Discount") + " (" + num(e.manualValue) + "%)";
      discLabelEs = (e.manualLabelEs || e.manualLabel || "Descuento") + " (" + num(e.manualValue) + "%)";
    }
  }
  if(discAmt > subtotal) discAmt = subtotal;
  if(discAmt < 0) discAmt = 0;
  discAmt = Math.round(discAmt*100)/100;

  var afterDisc = Math.round((subtotal - discAmt)*100)/100;
  var taxAmt = e.taxEnabled ? Math.round(afterDisc * num(e.taxRate)/100 * 100)/100 : 0;
  var total = Math.round((afterDisc + taxAmt)*100)/100;

  var depositPct = payPlanOn(e) ? num(e.payPlan[0].pct) : num(e.depositPct);
  var deposit = Math.round(total * depositPct/100 * 100)/100;
  var balance = Math.round((total - deposit)*100)/100;

  return {
    lines:lines, optional:optional, optionalTotal:optionalTotal,
    workSubtotal:workSubtotal, materialsTotal:materialsTotal, materialsAdded:materialsAdded,
    subtotal:Math.round(subtotal*100)/100, discAmt:discAmt,
    discLabel:discLabel, discLabelEs:discLabelEs, afterDisc:afterDisc,
    taxAmt:taxAmt, total:total, deposit:deposit, balance:balance, depositPct:depositPct
  };
}
/* the client-facing materials list, pre-filled from the materials calculator.
   Every line stays editable — this is only a starting point. */
function materialsFromCalc(e){
  var m = calcMaterials(e), mm = DB.materials, out = [];
  if(m.buyPrimer > 0) out.push({ id:uid("mt"), desc:mm.primerName, descEs:"", qty:m.buyPrimer, unit:"gal", rate:num(mm.primerCostPerGal) });
  if(m.buyPaint > 0)  out.push({ id:uid("mt"), desc:mm.paintName,  descEs:"", qty:m.buyPaint,  unit:"gal", rate:num(mm.paintCostPerGal) });
  (m.supplyLines||[]).forEach(function(sp){
    var unitCost = sp.units ? Math.round(sp.amt/sp.units*100)/100 : 0;
    out.push({ id:uid("mt"), desc:sp.name, descEs:"", qty:sp.units, unit:"", rate:unitCost });
  });
  return out;
}
/* how many frames this job actually paints, and the sq ft that follows from it */
function frameUnits(e){
  return e.frameMode === "separate" ? num(e.frames) : (e.frameMode === "none" ? 0 : num(e.doors));
}
function boxUnits(e){
  return e.boxMode === "separate" ? num(e.boxes) : (e.boxMode === "none" ? 0 : num(e.doors));
}
/* how many square feet of paintable surface a line really has:
   from the service it came from, or from its unit when it was typed by hand */
function itemSqft(it){
  var sv = it.svc ? svcById(it.svc) : null;
  if(sv && sv.sqftPerUnit !== undefined && sv.sqftPerUnit !== null) return num(it.qty)*num(sv.sqftPerUnit);
  var u = String(it.unit || "").toLowerCase();
  if(u.indexOf("sq") >= 0 || u.indexOf("pie\u00b2") >= 0 || u.indexOf("ft2") >= 0) return num(it.qty);
  if(u.indexOf("lin") >= 0 || u.indexOf("lineal") >= 0) return num(it.qty)*0.6;
  return 0;
}
function otherSqft(e){
  var t = 0;
  (e.items || []).forEach(function(it){ t += itemSqft(it); });
  return Math.round(t*10)/10;
}
function jobSqft(e){
  var m = DB.materials;
  return num(e.doors)*num(m.sqftPerDoor) + frameUnits(e)*num(m.frameSqftPerDoor) +
         boxUnits(e)*num(m.sqftPerBox) + num(e.drawers)*num(m.sqftPerDrawer);
}
function calcMaterials(e){
  var m = DB.materials;
  var doors = num(e.doors), drawers = num(e.drawers);
  var sqft = jobSqft(e);
  var waste = 1 + num(m.wastePct)/100;
  var cov = num(m.coverageSqftPerGal) || 1;
  var primerGal = sqft * num(m.primerCoats) / cov * waste;
  var paintGal  = sqft * num(m.paintCoats)  / cov * waste;
  var buyPrimer = Math.ceil(primerGal*4)/4;   /* buy by the quart */
  var buyPaint  = Math.ceil(paintGal*4)/4;
  var primerCost = buyPrimer * num(m.primerCostPerGal);
  var paintCost  = buyPaint  * num(m.paintCostPerGal);
  var supplies = 0, supplyLines = [];
  (m.supplies || []).forEach(function(sp){
    /* "job" is the old name for a fixed line; it still counts as one */
    var mult = sp.basis === "door" ? doors : sp.basis === "drawer" ? drawers : (sqft > 0 ? 1 : 0);
    var qty = sp.qty === undefined ? 1 : num(sp.qty);
    var units = qty * mult;
    var amt = units * num(sp.cost);
    if(units > 0){
      supplies += amt;
      supplyLines.push({ name:sp.name, units:Math.round(units*100)/100, basis:sp.basis, amt:Math.round(amt*100)/100 });
    }
  });
  supplies = Math.round(supplies*100)/100;

  /* the rest of the house: walls, ceilings, trim, exterior */
  var wallSqft = otherSqft(e);
  var wallCov = num(m.wallCoverageSqftPerGal) || 350;
  var wallGal = wallSqft * (num(m.wallCoats) || 0) / wallCov * waste;
  var wallPrimerGal = wallSqft * num(m.wallPrimerCoats) / wallCov * waste;
  var buyWall = Math.ceil(wallGal*4)/4;
  var buyWallPrimer = Math.ceil(wallPrimerGal*4)/4;
  var wallCost = Math.round(buyWall * num(m.wallPaintCostPerGal) * 100)/100;
  var wallPrimerCost = Math.round(buyWallPrimer * num(m.wallPrimerCostPerGal) * 100)/100;

  /* when the client buys the paint (or everything), it is not his cost — the gallons still show so he can tell them what to buy */
  var buyer = e.matBuyer || "me";
  if(buyer === "paint" || buyer === "client"){ primerCost = 0; paintCost = 0; wallCost = 0; wallPrimerCost = 0; }
  if(buyer === "client"){ supplies = 0; supplyLines = supplyLines.map(function(l){ l.amt = 0; return l; }); }
  var totalCost = Math.round((primerCost + paintCost + supplies + wallCost + wallPrimerCost)*100)/100;
  return {
    sqft:Math.round(sqft*10)/10,
    primerGal:Math.round(primerGal*100)/100, paintGal:Math.round(paintGal*100)/100,
    buyPrimer:buyPrimer, buyPaint:buyPaint,
    primerCost:Math.round(primerCost*100)/100, paintCost:Math.round(paintCost*100)/100,
    wallSqft:wallSqft, wallGal:Math.round(wallGal*100)/100, buyWall:buyWall, wallCost:wallCost,
    wallPrimerGal:Math.round(wallPrimerGal*100)/100, buyWallPrimer:buyWallPrimer, wallPrimerCost:wallPrimerCost,
    sundries:supplies, supplyLines:supplyLines, totalCost:totalCost
  };
}
/* what his own finished jobs say about coverage — the only figures that are really his */
/* everything he logged buying for this job */
function jobExpenses(e){
  var t = 0;
  (e.expenses || []).forEach(function(x){ t += num(x.amount); });
  (DB.expenses || []).forEach(function(x){ if(!x.deleted && x.estId === e.id && x.category === "materials") t += num(x.amount); });
  return Math.round(t*100)/100;
}
function actualMaterials(e){
  var listed = jobExpenses(e);
  return listed > 0 ? listed : num(e.actualMaterialCost);
}
function coverageFromJobs(){
  var m = DB.materials, np = 0, nq = 0, sp = 0, sq = 0, jobs = 0;
  DB.estimates.forEach(function(e){
    var doors = num(e.doors), drawers = num(e.drawers);
    var sqft = jobSqft(e);
    if(sqft <= 0) return;
    var used = false;
    if(num(e.actualPrimerGal) > 0){ sp += sqft*num(m.primerCoats)/num(e.actualPrimerGal); np++; used = true; }
    if(num(e.actualPaintGal)  > 0){ sq += sqft*num(m.paintCoats)/num(e.actualPaintGal);  nq++; used = true; }
    if(used) jobs++;
  });
  return {
    jobs: jobs,
    primer: np ? Math.round(sp/np) : 0,
    paint:  nq ? Math.round(sq/nq) : 0,
    primerJobs: np, paintJobs: nq
  };
}
function invoicesFor(estId){
  return DB.invoices.filter(function(v){ return v.estimateId === estId; })
    .sort(function(a,b){ return invOrder(a) - invOrder(b); });
}
function jobStatus(e){
  var invs = invoicesFor(e.id);
  if(invs.length){
    var allPaid = invs.every(function(v){ return v.status === "Paid"; });
    if(allPaid) return "Paid in Full";
    var depPaid = invs.some(function(v){ return v.status === "Paid"; });
    if(depPaid) return "Deposit Paid";
    var anySent = invs.some(function(v){ return v.status === "Sent"; });
    if(anySent) return "Sent";
  }
  return e.status || "Draft";
}
function badgeClass(s){
  switch(s){
    case "Sent": return "b-sent";
    case "Accepted": return "b-accepted";
    case "Deposit Paid": return "b-deposit";
    case "Paid in Full": case "Paid": return "b-paid";
    case "Declined": return "b-declined";
    default: return "b-draft";
  }
}
function badge(s){ return '<span class="badge '+badgeClass(s)+'">'+esc(s)+'</span>'; }
function clientName(id){

var WON_ST = { "Accepted":1, "Deposit Paid":1, "Paid in Full":1 };
function jobRefDate(e){ return e.startDate || e.date || ""; }
function wonRange(){ var k = DB.wonRange; return (k === "month" || k === "all") ? k : "year"; }
function rangeBounds(kind){
  var t = todayISO();
  if(kind === "month") return { from: t.slice(0,7)+"-01", to: t.slice(0,7)+"-31" };
  if(kind === "year")  return { from: t.slice(0,4)+"-01-01", to: t.slice(0,4)+"-12-31" };
  return { from:"", to:"" };
}
function r2(x){ return Math.round(num(x)*100)/100; }
function wonSummary(kind){
  var b = rangeBounds(kind), list = [], total = 0, collected = 0, mat = 0;
  DB.estimates.forEach(function(e){
    var st = jobStatus(e);
    if(!WON_ST[st]) return;
    var d = jobRefDate(e);
    if(b.from && (!d || d < b.from || d > b.to)) return;
    var tot = calcEstimate(e).total + coSignedTotal(e), paid = 0;
    invoicesFor(e.id).forEach(function(v){ if(v.status === "Paid") paid += num(v.amount); });
    var mc = actualMaterials(e);
    if(!(mc > 0)) mc = calcMaterials(e).totalCost;
    total += tot; collected += paid; mat += num(mc);
    list.push({ e:e, st:st, total:r2(tot), paid:r2(paid), due:r2(tot-paid), mat:r2(mc) });
  });
  list.sort(function(a, c){ return String(jobRefDate(c.e)).localeCompare(String(jobRefDate(a.e))); });
  return { kind:kind, list:list, n:list.length, total:r2(total), collected:r2(collected),
           due:r2(total-collected), mat:r2(mat), after:r2(total-mat),
           avg: list.length ? r2(total/list.length) : 0 };
}
/* close rate and average bid, by the estimate date, for the same period as the money panel */
function closeStats(kind){
  var b = rangeBounds(kind), sent = 0, won = 0, lost = 0, bids = 0;
  DB.estimates.forEach(function(e){
    var st = jobStatus(e);
    if(st === "Draft") return;
    var d = e.date || e.sentAt || "";
    if(b.from && (!d || d.slice(0,10) < b.from || d.slice(0,10) > b.to)) return;
    sent++; bids += calcEstimate(e).total;
    if(WON_ST[st]) won++;
    else if(st === "Declined") lost++;
  });
  return { sent:sent, won:won, lost:lost, open:sent - won - lost,
           rate: sent ? Math.round(won/sent*100) : 0,
           decided: (won + lost) ? Math.round(won/(won + lost)*100) : 0,
           avgBid: sent ? r2(bids/sent) : 0 };
}

      save();
    };

      var mb = document.getElementById("matBox");

function photosHTML(e){
  var ph = e.photos || [];
  if(!ph.length) return '<div class="muted" style="font-size:13.5px;margin-top:12px">No photos on this job yet.</div>';
  return '<div class="pgrid">' + ph.map(function(x, i){
    return '<div class="pcard">'+
      '<img class="pthumb" data-photo="'+esc(x.id)+'" data-i="'+i+'" alt="'+esc(x.caption||"Job photo")+'">'+
      '<div class="pmeta">'+
        '<input type="text" class="ph-f" data-i="'+i+'" data-f="caption" placeholder="Caption (optional)" value="'+esc(x.caption||"")+'">'+
        '<div class="row">'+
          '<select class="ph-f" data-i="'+i+'" data-f="kind">'+
            ['','before','after','detail'].map(function(k){
              var lbl = k === "" ? "No label" : k.charAt(0).toUpperCase()+k.slice(1);
              return '<option value="'+k+'"'+((x.kind||"")===k?" selected":"")+'>'+lbl+'</option>';
            }).join("")+
          '</select>'+
          '<button class="li-del ph-del" data-i="'+i+'" title="Remove photo">×</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join("") + '</div>';
}
function addPhotos(e, files){
  var list = Array.prototype.slice.call(files || []).filter(function(f){ return /^image\//.test(f.type); });
  if(!list.length) return;
  toast(T("Adding {0} photos…", list.length));
  list.reduce(function(chain, f){
    return chain.then(function(){
      return resizeImage(f, 1400, 0.72).then(function(url){
        if(!url) return;
        var id = uid("ph");
        return PhotoStore.put(id, url).then(function(){
          e.photos = e.photos || [];
          e.photos.push({ id:id, caption:"", kind:"", createdAt:todayISO() });
          touch(e);
        });
      });
    });
  }, Promise.resolve()).then(function(){
    var box = document.getElementById("photoGrid");
    if(box){ box.innerHTML = photosHTML(e); bindPhotos(e); hydratePhotos(); }
    toast(T("Photos added."));
  });
}
function bindPhotos(e){
  document.querySelectorAll(".ph-f").forEach(function(el){
    var ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, function(){
      var i = num(el.getAttribute("data-i"));
      if(!e.photos[i]) return;
      e.photos[i][el.getAttribute("data-f")] = el.value;
      touch(e);
    }, {once:false});
  });
  document.querySelectorAll(".ph-del").forEach(function(el){
    el.onclick = function(){
      var i = num(el.getAttribute("data-i"));
      var ph = e.photos[i];
      if(!ph) return;
      if(!confirm(T("Remove this photo?"))) return;
      PhotoStore.del(ph.id);
      cloudDeletePhoto(ph.id);
      e.photos.splice(i,1); touch(e);
      document.getElementById("photoGrid").innerHTML = photosHTML(e);
      bindPhotos(e); hydratePhotos();
    };
  });
  document.querySelectorAll("#photoGrid .pthumb").forEach(function(el){
    el.onclick = function(){
      var i = num(el.getAttribute("data-i"));
      var ph = e.photos[i];
      if(ph) lightbox(ph.id, ph.caption);
    };
  });
}
function discMsg(e){
  if(e.discountMode !== "code") return "";
  var code = String(e.discountCode||"").trim();
  if(!code) return '<span class="muted" style="font-size:13px">Enter a code to apply a discount.</span>';
  var d = findDiscount(code);
  if(d) return '<span class="badge b-paid">'+esc(T("{0} applied — {1} off", d.label, (d.type==="fixed"?money(d.value):num(d.value)+"%")))+'</span>';
  return '<span class="badge b-declined">Code not recognised — add it in Settings</span>';
}
function recalc(){
  var e = currentEstimate();
  if(!e) return;
  var tb = document.getElementById("totalsBox"); if(tb) tb.innerHTML = totalsHTML(e);
  var mb = document.getElementById("matBox");   if(mb) mb.innerHTML = materialsHTML(e);
  var da = document.getElementById("doorAmt");  if(da) da.textContent = money(num(e.doors)*num(e.doorRate));
  var wa = document.getElementById("drawerAmt");if(wa) wa.textContent = money(num(e.drawers)*num(e.drawerRate));
  var fa = document.getElementById("frameAmt"); if(fa) fa.textContent = money(num(e.frames)*num(e.frameRate));
  var ba = document.getElementById("boxAmt");   if(ba) ba.textContent = money(num(e.boxes)*num(e.boxRate));
  var cm = document.getElementById("codeMsg");  if(cm) cm.innerHTML = discMsg(e);
  var mt = document.getElementById("mobiTotal"); if(mt) mt.textContent = money(calcEstimate(e).total);
  (e.items||[]).forEach(function(it,i){
    var el = document.querySelector('[data-amt="'+i+'"]');
    if(el) el.textContent = money(num(it.qty)*num(it.rate));
  });
  (e.upgrades||[]).forEach(function(u,i){
    var el = document.querySelector('[data-upamt="'+i+'"]');
    if(el) el.textContent = money(num(u.qty)*num(u.rate));
  });
}
function bindEditor(){
  var e = currentEstimate();
  if(!e) return;

  document.querySelectorAll("[data-ef]").forEach(function(el){
    var f = el.getAttribute("data-ef");
    var ev = (el.type === "checkbox" || el.tagName === "SELECT") ? "change" : "input";
    el.addEventListener(ev, function(){
      var prevVal = e[f];
      if(el.type === "checkbox") e[f] = el.checked;
      else if(el.type === "number") e[f] = el.value === "" ? 0 : num(el.value);
      else e[f] = el.value;
      touch(e);
      if(f === "docLang"){
        var c0 = e.clientId ? byId(DB.clients, e.clientId) : null;
        if(c0) c0.lang = e.docLang;
        save(); return;
      }
      if(f === "status"){
        if(e.status === "Sent" && !e.sentAt) e.sentAt = todayISO();
        save(); render(); return;
      }
      if(f === "startDate"){ var mv = shiftJobTasks(e, prevVal, e.startDate); save(); render(); tasksMovedToast(mv); return; }
      if(f === "days" || f === "leadSource"){ save(); render(); return; }
      if(f === "taxEnabled" || f === "manualType" || f === "showMaterials") { render(); return; }
      recalc();
    });
  });
  document.querySelectorAll("[data-cf]").forEach(function(el){
    var f = el.getAttribute("data-cf");
    el.addEventListener("input", function(){
      e[f] = el.value;
      ensureClient(e);
      touch(e);
    });
  });
  var pick = document.getElementById("cliPick");
  if(pick) pick.onchange = function(){
    if(!pick.value){ e.clientId = null; touch(e); render(); return; }
    var c = byId(DB.clients, pick.value);
    if(c){ e.clientId = c.id; e.clientName = c.name; e.address = c.address||""; e.phone = c.phone||""; e.email = c.email||""; if(c.lang) e.docLang = c.lang; }
    touch(e); render();
  };
  document.querySelectorAll("[data-fm]").forEach(function(el){
    el.onclick = function(){
      e.frameMode = el.getAttribute("data-fm");
      if(e.frameMode === "separate"){
        if(!num(e.frames)) e.frames = num(e.doors);
        if(!num(e.frameRate)) e.frameRate = num(DB.pricing.frameRate);
      }
      touch(e); render();
    };
  });
  document.querySelectorAll("[data-bm]").forEach(function(el){
    el.onclick = function(){
      e.boxMode = el.getAttribute("data-bm");
      if(e.boxMode === "separate"){
        if(!num(e.boxes)) e.boxes = num(e.doors);
        if(!num(e.boxRate)) e.boxRate = num(DB.pricing.boxRate);
      }
      touch(e); render();
    };
  });
  document.querySelectorAll("[data-dm]").forEach(function(el){
    el.onclick = function(){ e.discountMode = el.getAttribute("data-dm"); touch(e); render(); };
  });

function bindMaterials(e){
  document.querySelectorAll(".mat-f").forEach(function(el){
    el.addEventListener("input", function(){
      var i = num(el.getAttribute("data-i")), f = el.getAttribute("data-f");
      if(!e.materialsList || !e.materialsList[i]) return;
      e.materialsList[i][f] = (f === "qty" || f === "rate") ? (el.value === "" ? 0 : num(el.value)) : el.value;
      touch(e); recalc();
      var box = document.getElementById("matBoxList");
      if(box && (f === "qty" || f === "rate")){
        var tt = 0;
        e.materialsList.forEach(function(x){ tt += num(x.qty)*num(x.rate); });

        if(cell) cell.textContent = money(Math.round(tt*100)/100);
      }
    });
  });
  document.querySelectorAll(".mat-del").forEach(function(el){
    el.onclick = function(){
      e.materialsList.splice(num(el.getAttribute("data-i")), 1);
      touch(e); redrawMaterials(e);
    };
  });
}
